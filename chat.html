            default: return null;
        }
    } catch (e) {
        console.error('Chart render error:', e);
        return null;
    }
}

function renderChatChart(el) {
    const container = document.getElementById('chat-messages-container');
    if (!container || !el) return;
    hideWelcomeState();
    const div = document.createElement('div');
    div.className = 'chat-message assistant';
    div.style.cssText = 'display:flex; gap:0.75rem; align-items:flex-start;';
    const avatar = document.createElement('div');
    avatar.className = 'chat-avatar';
    avatar.innerHTML = '<i class="ri-bar-chart-2-line"></i>';
    div.appendChild(avatar);
    div.appendChild(el);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function resolveCountry(nameOrISO) {
    const upper = nameOrISO.trim().toUpperCase();
    let found = rawData.find(r => r.country === upper);
    if (found) return found;
    const lower = nameOrISO.trim().toLowerCase();
    found = rawData.find(r => r.country_name.toLowerCase() === lower);
    if (found) return found;
    found = rawData.find(r => r.country_name.toLowerCase().includes(lower));
    return found || null;
}

// Shared Chart.js theme defaults
const CHART_THEME = {
    bg: '#192030',
    gridColor: 'rgba(255,255,255,0.06)',
    tickColor: 'rgba(255,255,255,0.5)',
    gold: '#cba84e',
    goldDim: 'rgba(203,168,78,0.18)',
    blue: 'rgba(93,140,168,0.7)',
    blueSolid: '#5d8ca8',
    font: "'JetBrains Mono', monospace"
};

function makeChartWrapper(title) {
    const wrapper = document.createElement('div');
    wrapper.className = 'chat-chart-wrapper';
    if (title) {
        const h = document.createElement('div');
        h.className = 'chat-chart-title';
        h.textContent = title;
        wrapper.appendChild(h);
    }
    const canvas = document.createElement('canvas');
    canvas.className = 'chat-chart-canvas';
    wrapper.appendChild(canvas);
    return { wrapper, canvas };
}

const _chartInstances = [];
function registerChart(instance) { _chartInstances.push(instance); }

// ===== SCATTER PLOT (rao8: Opportunity vs Absorptive Capacity, colored by regime) =====
function buildScatterPlot({ highlight = [], title } = {}) {
    if (!latestSlice.length) return null;
    const { wrapper, canvas } = makeChartWrapper(title || 'Opportunity vs Absorptive Capacity — Structural Positioning');
    const highlightSet = new Set(highlight.map(h => resolveCountry(h)?.country).filter(Boolean));
    const regimes = ['RO','FO','SL','SR'];
    const datasets = regimes.map(regime => {
        const pts = latestSlice.filter(r => r.regime === regime && !highlightSet.has(r.country));
        return {
            label: REGIME_COLORS[regime].label,
            data: pts.map(r => ({ x: r.pillar_opportunity||0, y: r.pillar_absorptive_capacity||0, label: r.country_name, iso: r.country, rao: r.rao_score })),
            backgroundColor: REGIME_COLORS[regime].dim,
            borderColor: REGIME_COLORS[regime].solid,
            borderWidth: 1, pointRadius: 4, pointHoverRadius: 6
        };
    });
    // Highlighted countries on top
    const hlPts = latestSlice.filter(r => highlightSet.has(r.country));
    if (hlPts.length) datasets.push({
        label: 'Highlighted',
        data: hlPts.map(r => ({ x: r.pillar_opportunity||0, y: r.pillar_absorptive_capacity||0, label: r.country_name, iso: r.country, rao: r.rao_score })),
        backgroundColor: CHART_THEME.gold, borderColor: '#fff', borderWidth: 1.5,
        pointRadius: 7, pointHoverRadius: 9
    });
    const chart = new Chart(canvas, {
        type: 'scatter',
        data: { datasets },
        options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
            plugins: {
                legend: { display: true, position: 'top', labels: { color: 'rgba(255,255,255,0.7)', font: { size: 10 }, boxWidth: 8, padding: 10 } },
                tooltip: { callbacks: { title: i => i[0]?.raw?.label||'', label: item => { const d=item.raw; return [`Opportunity: ${d.x.toFixed(2)} · Absorptive: ${d.y.toFixed(2)}`, `RAO: ${(d.rao||0).toFixed(2)}`]; } }, backgroundColor: '#1f283b', borderColor: CHART_THEME.gold, borderWidth: 1, titleColor: CHART_THEME.gold }
            },
            scales: {
                x: { title: { display: true, text: 'Opportunity (0–1)', color: CHART_THEME.tickColor, font: { size: 10 } }, min: 0, max: 1, grid: { color: CHART_THEME.gridColor }, ticks: { color: CHART_THEME.tickColor, font: { size: 10 } } },
                y: { title: { display: true, text: 'Absorptive Capacity (0–1)', color: CHART_THEME.tickColor, font: { size: 10 } }, min: 0, max: 1, grid: { color: CHART_THEME.gridColor }, ticks: { color: CHART_THEME.tickColor, font: { size: 10 } } }
            }
        },
        plugins: [{
            id: 'hlLabels',
            afterDraw(ch) {
                if (!hlPts.length) return;
                const { ctx, scales: { x, y } } = ch;
                ctx.save();
                ctx.fillStyle = CHART_THEME.gold;
                ctx.font = `10px ${CHART_THEME.font}`;
                hlPts.forEach(r => { ctx.fillText(r.country, x.getPixelForValue(r.pillar_opportunity||0)+7, y.getPixelForValue(r.pillar_absorptive_capacity||0)-4); });
                ctx.restore();
            }
        }]
    });
    registerChart(chart);
    return wrapper;
}

// ===== RADAR CHART (rao8: 4 pillars, B inverted) =====
function buildRadarChart({ countries = [], title } = {}) {
    if (!countries.length) return null;
    const resolved = countries.map(resolveCountry).filter(Boolean).slice(0, 3);
    if (!resolved.length) return null;

    const { wrapper, canvas } = makeChartWrapper(title || `Pillar Radar — ${resolved.map(c => c.country_name).join(' · ')}`);
    const labels = ['Opportunity', 'Stability', 'Absorptive Capacity', 'Trajectory'];
    const colors = [
        { border: CHART_THEME.gold, bg: 'rgba(194,165,109,0.12)' },
        { border: CHART_THEME.blueSolid, bg: 'rgba(96,124,152,0.12)' },
        { border: '#5d8a72', bg: 'rgba(93,138,114,0.12)' }
    ];

    const datasets = resolved.map((c, i) => {
        const row = getLatestRow(c.country) || c;
        return {
            label: c.country_name,
            data: [
                (row.pillar_opportunity || 0) * 10,
                (row.pillar_stability || 0) * 10,
                (row.pillar_absorptive_capacity || 0) * 10,
                (row.pillar_trajectory || 0) * 10
            ],
            borderColor: colors[i].border,
            backgroundColor: colors[i].bg,
            pointBackgroundColor: colors[i].border,
            pointRadius: 3, borderWidth: 2
        };
    });

    const chart = new Chart(canvas, {
        type: 'radar',
        data: { labels, datasets },
        options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
            scales: {
                r: {
                    min: 0, max: 10,
                    ticks: { stepSize: 2, color: CHART_THEME.tickColor, font: { family: CHART_THEME.font, size: 9 }, backdropColor: 'transparent' },
                    pointLabels: { color: 'rgba(255,255,255,0.7)', font: { family: CHART_THEME.font, size: 9 } },
                    grid: { color: CHART_THEME.gridColor },
                    angleLines: { color: CHART_THEME.gridColor }
                }
            },
            plugins: {
                legend: { display: resolved.length > 1, labels: { color: 'rgba(255,255,255,0.7)', font: { family: CHART_THEME.font, size: 10 }, boxWidth: 12 } },
                tooltip: { backgroundColor: '#1f283b', borderColor: CHART_THEME.gold, borderWidth: 1, titleColor: CHART_THEME.gold, bodyColor: 'rgba(255,255,255,0.8)' }
            }
        }
    });
    registerChart(chart);
    return wrapper;
}

// ===== BAR CHART (rao8 pillars) =====
function buildBarChart({ mode, country, metric = 'rao_score', top_n = 15, title } = {}) {
    if (!latestSlice.length) return null;
    let labels, values, barColor, chartTitle, xMax = 1;

    if (mode === 'pillar_profile') {
        const c = resolveCountry(country || '');
        if (!c) return null;
        const row = getLatestRow(c.country) || c;
        const pillars = [
            { name: 'Opportunity',        score: row.pillar_opportunity || 0,              color: PILLARS.opportunity.color },
            { name: 'Stability',           score: row.pillar_stability || 0,                color: PILLARS.stability.color },
            { name: 'Absorptive Capacity',score: row.pillar_absorptive_capacity || 0,      color: PILLARS.absorptive.color },
            { name: 'Trajectory',         score: row.pillar_trajectory || 0,               color: PILLARS.trajectory.color }
        ];
        labels = pillars.map(p => p.name);
        values = pillars.map(p => parseFloat(p.score.toFixed(3)));
        barColor = pillars.map(p => p.color);
        chartTitle = title || `Pillar Profile — ${c.country_name}`;
    } else {
        const scorer = r => r[metric] ?? 0;
        const isRAO = metric === 'rao_score'; xMax = isRAO ? 10 : 1;
        const sorted = [...latestSlice]
            .map(r => ({ name: r.country_name, score: scorer(r) }))
            .filter(r => !isNaN(r.score))
            .sort((a, b) => b.score - a.score)
            .slice(0, Math.min(top_n, 20));
        labels = sorted.map(r => r.name);
        values = sorted.map(r => parseFloat(r.score.toFixed(3)));
        barColor = CHART_THEME.gold;
        chartTitle = title || `Top ${sorted.length} — ${metric.replace(/_/g,' ')}`;
    }

    const { wrapper, canvas } = makeChartWrapper(chartTitle);
    const chart = new Chart(canvas, {
        type: 'bar',
        data: { labels, datasets: [{ data: values, backgroundColor: barColor, borderRadius: 3, borderSkipped: false }] },
        options: {
            indexAxis: 'y', responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
            plugins: {
                legend: { display: false },
                tooltip: { backgroundColor: '#1f283b', borderColor: CHART_THEME.gold, borderWidth: 1, titleColor: CHART_THEME.gold, bodyColor: 'rgba(255,255,255,0.8)', callbacks: { label: ctx => ` ${ctx.raw.toFixed(3)}` } }
            },
            scales: {
                x: { min: 0, max: xMax, grid: { color: CHART_THEME.gridColor }, ticks: { color: CHART_THEME.tickColor, font: { size: 10 } } },
                y: { grid: { display: false }, ticks: { color: 'rgba(255,255,255,0.75)', font: { size: 10 } } }
            }
        }
    });
    canvas.style.height = `${Math.max(200, labels.length * 26 + 40)}px`;
    registerChart(chart);
    return wrapper;
}

// ===== LINE CHART (rao8 panel: time series) =====
function buildLineChart({ countries = [], metric = 'rao_score', title } = {}) {
    if (!countries.length || !panelData.length) return null;
    const resolved = countries.map(resolveCountry).filter(Boolean).slice(0, 3);
    if (!resolved.length) return null;
    const years = Array.from({length:15}, (_, i) => 2010 + i);
    const colors = [CHART_THEME.gold, CHART_THEME.blueSolid, '#5d8a72'];
    const datasets = resolved.map((c, i) => {
        const hist = getCountryHistory(c.country);
        const yearMap = new Map(hist.map(r => [r.year, r[metric]]));
        return {
            label: c.country_name,
            data: years.map(y => yearMap.get(y) ?? null),
            borderColor: colors[i], backgroundColor: 'transparent',
            borderWidth: 2, tension: 0.3, spanGaps: true, pointRadius: 3, pointHoverRadius: 5
        };
    });

    const isRAO = metric === 'rao_score';
    const { wrapper, canvas } = makeChartWrapper(title || `${metric.replace(/_/g,' ')} — ${resolved.map(c=>c.country_name).join(' · ')}`);
    const chart = new Chart(canvas, {
        type: 'line',
        data: { labels: years, datasets },
        options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 400 },
            scales: {
                x: { grid: { color: CHART_THEME.gridColor }, ticks: { color: CHART_THEME.tickColor, font: { size: 10 } } },
                y: { min: isRAO ? 1 : 0, max: isRAO ? 10 : 1, grid: { color: CHART_THEME.gridColor }, ticks: { color: CHART_THEME.tickColor, font: { size: 10 } } }
            },
            plugins: {
                legend: { display: resolved.length > 1, position: 'top', labels: { color: 'rgba(255,255,255,0.7)', font: { size: 10 }, boxWidth: 10, padding: 12 } },
                tooltip: { mode: 'index', intersect: false, backgroundColor: '#1f283b', borderColor: CHART_THEME.gold, borderWidth: 1, titleColor: CHART_THEME.gold }
            }
        }
    });
    registerChart(chart);
    return wrapper;
}

// ===== REGIME MATRIX (chatbot tool) =====
function buildChatRegimeMatrix({ year = 2025, title } = {}) {
    const ly = window.LATEST_YEAR || 2025;
    const slice = year === ly ? latestSlice : getSlice(year);
    if (!slice.length) return null;
    const wrapper = document.createElement('div');
    wrapper.className = 'chat-chart-wrapper';
    if (title || year !== ly) {
        const h = document.createElement('div');
        h.className = 'chat-chart-title';
        h.textContent = title || `Regime × TOS Investment Priority Matrix — ${year}`;
        wrapper.appendChild(h);
    }
    const div = document.createElement('div');
    const regimes = ['RO','FO','SL','SR'];
    const HIGH = 0.5;
    let html = `<div style="display:grid;grid-template-columns:auto repeat(4,1fr);gap:4px;font-size:0.72rem;margin-top:0.5rem;">`;
    html += `<div></div>`;
    regimes.forEach(r => { const c = REGIME_COLORS[r]; html += `<div style="padding:4px 6px;background:${c.dim};border:1px solid ${c.solid};border-radius:3px;text-align:center;font-family:var(--font-minor);color:${c.solid};font-weight:600;">${r}</div>`; });
    ['High TOS ≥ 0.5','Low TOS < 0.5'].forEach((rowLabel, rowIdx) => {
        const tosMin = rowIdx === 0 ? HIGH : 0;
        const tosMax = rowIdx === 0 ? 1 : HIGH;
        html += `<div style="padding:4px 6px;font-family:var(--font-minor);color:var(--text-muted);display:flex;align-items:center;white-space:nowrap;">${rowLabel}</div>`;
        regimes.forEach(regime => {
            const matches = slice.filter(r => r.regime === regime && (r.tos_score||0) >= tosMin && (r.tos_score||0) < tosMax);
            const isPulse = regime === 'FO' && rowIdx === 0 || regime === 'SR' && rowIdx === 0;
            const rc = REGIME_COLORS[regime];
            html += `<div style="padding:6px;background:${rc.dim};border:1px solid ${isPulse?rc.solid:rc.solid+'44'};border-radius:3px;${isPulse?'box-shadow:0 0 8px '+rc.solid+'55;':''}">`;
            html += `<div style="font-family:var(--font-mono);font-size:1rem;font-weight:700;color:${rc.solid};">${matches.length}</div>`;
            matches.slice(0,3).forEach(r => { html += `<div style="font-size:0.65rem;color:rgba(238,234,224,0.6);margin-top:1px;">${r.country_name}</div>`; });
            html += `</div>`;
        });
    });
    html += `</div>`;
    div.innerHTML = html;
    wrapper.appendChild(div);
    return wrapper;
}

// ===== MOBILE DRAWER FUNCTIONS =====
function toggleMobileSidebar() {
    const s = document.querySelector('.sessions-sidebar');
    const o = document.getElementById('mobile-overlay');
    const isOpen = s.classList.contains('mobile-open');
    closeMobileDrawers();
    if (!isOpen) { s.classList.add('mobile-open'); o.classList.add('open'); }
}
function toggleMobileTrace() {
    const t = document.querySelector('.trace-panel');
    const o = document.getElementById('mobile-overlay');
    const isOpen = t.classList.contains('mobile-open');
    closeMobileDrawers();
    if (!isOpen) { t.classList.add('mobile-open'); o.classList.add('open'); }
}
function closeMobileDrawers() {
    document.querySelector('.sessions-sidebar')?.classList.remove('mobile-open');
    document.querySelector('.trace-panel')?.classList.remove('mobile-open');
    document.getElementById('mobile-overlay')?.classList.remove('open');
}

// ===== KEYBOARD SHORTCUTS =====
function handleGlobalKeydown(e) {
    const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
    const isInput = tag === 'input' || tag === 'textarea';
    const isMeta = e.ctrlKey || e.metaKey;

    if (e.key === 'Escape') {
        const ssModal = document.getElementById('session-search-modal');
        if (ssModal && ssModal.style.display !== 'none') { ssModal.style.display = 'none'; return; }
        const modal = document.getElementById('trace-modal');
        if (modal && modal.style.display !== 'none' && modal.style.display !== '') {
            closeTraceModal();
        } else {
            closeMobileDrawers();
        }
        return;
    }
    if (isMeta && e.key === 'f' && !isInput) { e.preventDefault(); openSessionSearch(); return; }
    if (isInput) return;
    if (isMeta && e.key === 'n') { e.preventDefault(); newSession(); }
    if (isMeta && e.key === 'e') { e.preventDefault(); exportToMarkdown(); }
}
document.addEventListener('keydown', handleGlobalKeydown);
