    let html = `<div class="rtm-grid"><div class="rtm-row-header"></div>`;
    ['RO','FO','SL','SR'].forEach(reg => {
        html += `<div class="rtm-col-header"><span style="font-size:0.68rem;font-weight:700;font-family:var(--font-minor);text-transform:uppercase;letter-spacing:0.1em;color:${REGIME_COLORS[reg].solid};">${reg}</span><span style="font-size:0.56rem;color:var(--text-muted);display:block;margin-top:0.15rem;">${REGIME_COLORS[reg].label}</span></div>`;
    });
    ['high','low'].forEach(bucket => {
        const isHigh = bucket === 'high';
        html += `<div class="rtm-row-header"><span style="font-family:var(--font-minor);font-size:0.58rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:${isHigh?'var(--accent-gold)':'var(--text-muted)'};">${isHigh?'TOS ≥ 0.5':'TOS < 0.5'}</span></div>`;
        ['RO','FO','SL','SR'].forEach(reg => {
            const key = `${reg}_${bucket}`;
            const list = cells[reg][bucket];
            const top3 = list.slice(0,3);
            const extra = list.length > 3 ? `<span style="font-size:0.58rem;color:var(--text-muted);margin-top:2px;display:block;">+${list.length-3} more</span>` : '';
            html += `<div class="rtm-cell${PULSE.includes(key)?' rtm-pulse':''}">
                <div class="rtm-priority">${PRIORITY[key]||''}</div>
                <div class="rtm-count" style="color:${REGIME_COLORS[reg].solid};">${list.length}</div>
                <div class="rtm-countries">${top3.map(r=>`<span class="rtm-country-chip" onclick="openCountryAnalysis('${r.country}')">${r.country_name}</span>`).join('')}${extra}</div>
            </div>`;
        });
    });
    html += `</div>`;
    document.getElementById('regime-tos-matrix').innerHTML = html;
}

function renderScoreDistributionChart() {
    const slice = getSlice(_landscapeYear);
    const bins = [];
    for (let v = 1; v < 10; v += 0.5) bins.push({ lo: v, hi: v+0.5, label: v.toFixed(1), counts: {RO:0,FO:0,SL:0,SR:0} });
    slice.forEach(r => {
        const bin = bins.find(b => r.rao_score >= b.lo && r.rao_score < b.hi);
        if (bin && bin.counts[r.regime] !== undefined) bin.counts[r.regime]++;
    });
    const ctx = document.getElementById('score-dist-chart');
    if (!ctx) return;
    if (ctx._chartInst) { ctx._chartInst.destroy(); }
    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: bins.map(b => b.label),
            datasets: ['SR','SL','FO','RO'].map(reg => ({
                label: REGIME_COLORS[reg].label,
                data: bins.map(b => b.counts[reg]),
                backgroundColor: REGIME_COLORS[reg].solid,
                borderWidth: 0,
                borderRadius: 2
            }))
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { display: true, position: 'bottom', labels: { color: 'rgba(238,234,224,0.5)', font:{size:10}, boxWidth:10, padding:10 } },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    callbacks: {
                        title: items => `RAO Score ${items[0].label}–${(parseFloat(items[0].label)+0.5).toFixed(1)}`,
                        label: item => item.parsed.y > 0 ? ` ${item.dataset.label}: ${item.parsed.y} countries` : null
                    }
                }
            },
            scales: {
                x: { stacked: true, grid: { color:'rgba(255,255,255,0.04)' }, ticks: { color:'rgba(238,234,224,0.4)', font:{size:9}, maxRotation:0 } },
                y: { stacked: true, grid: { color:'rgba(255,255,255,0.04)' }, ticks: { color:'rgba(238,234,224,0.4)', font:{size:10} } }
            }
        }
    });
    ctx._chartInst = chart;
    registerChart(chart);
}

function renderRegionalOverview() {
    const slice = getSlice(_landscapeYear);
    const regionOrder = ['Asia-Pacific','Europe','Americas','Africa','Middle East'];
    const header = `<div style="display:grid;grid-template-columns:150px 65px 1fr 130px;align-items:center;gap:1rem;padding:0.4rem 1.4rem;border-bottom:1px solid var(--border-subtle);">
        <span style="font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-muted);">Region</span>
        <span style="font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-muted);">Avg RAO</span>
        <span style="font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-muted);">Opportunity · Stability · Absorptive Capacity · Trajectory</span>
        <span style="font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-muted);">Regime Mix</span>
    </div>`;

    const rows = regionOrder.map(region => {
        const countries = slice.filter(r => getRegion(r.country) === region);
        if (!countries.length) return '';
        const n = countries.length;
        const avg = f => countries.reduce((s,r)=>s+(r[f]||0),0)/n;
        const meanRAO = avg('rao_score');
        const meanA   = avg('pillar_opportunity');
        const meanB   = avg('pillar_stability');
        const meanC   = avg('pillar_absorptive_capacity');
        const meanD   = avg('pillar_trajectory');

        const pillarBar = (val, col) => `<div style="flex:1;height:6px;background:var(--tertiary-bg);border-radius:2px;overflow:hidden;"><div class="score-bar-animated" data-width="${val*100}" style="height:100%;background:${col};width:0%;transition:width 1s var(--easing);border-radius:2px;"></div></div>`;
        const pillarLabel = (letter, val, col) => `<span style="font-family:var(--font-mono);font-size:0.6rem;color:${col};min-width:14px;">${letter}</span>`;

        const regDots = ['RO','FO','SL','SR'].map(reg => {
            const cnt = countries.filter(r=>r.regime===reg).length;
            if (!cnt) return '';
            const w = Math.max(8, Math.round(cnt/n*60));
            return `<span title="${REGIME_COLORS[reg].label}: ${cnt}" style="display:inline-block;width:${w}px;height:8px;border-radius:2px;background:${REGIME_COLORS[reg].solid};margin-right:2px;"></span>`;
        }).join('');

        return `<div style="display:grid;grid-template-columns:150px 65px 1fr 130px;align-items:center;gap:1rem;padding:0.65rem 1.4rem;border-bottom:1px solid var(--border-subtle);">
            <span style="font-family:var(--font-minor);font-size:0.73rem;font-weight:600;color:var(--w65);">${region} <span style="font-size:0.6rem;color:var(--text-muted);font-weight:400;">(${n})</span></span>
            <span style="font-family:var(--font-mono);font-size:0.88rem;color:var(--accent-gold);">${meanRAO.toFixed(2)}</span>
            <div style="display:flex;gap:5px;align-items:center;">
                ${pillarLabel('A',meanA,'var(--accent-gold)')}${pillarBar(meanA,'var(--accent-gold)')}
                ${pillarLabel('B',meanB,'var(--accent-blue)')}${pillarBar(meanB,'var(--accent-blue)')}
                ${pillarLabel('C',meanC,'var(--accent-blue)')}${pillarBar(meanC,'var(--accent-blue)')}
                ${pillarLabel('D',meanD,'var(--accent-green)')}${pillarBar(meanD,'var(--accent-green)')}
            </div>
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:2px;">${regDots}</div>
        </div>`;
    }).join('');

    document.getElementById('regional-overview').innerHTML = header + rows;
    setTimeout(() => {
        document.querySelectorAll('#regional-overview .score-bar-animated').forEach(bar => {
            bar.style.width = bar.dataset.width + '%';
        });
    }, 120);
}

    tos:      { title:'TOS — Take-off Signal',    grad:'linear-gradient(to right,#252e42,#c9a961,#C2A56D)',            lo:'0',          hi:'1'         },

function drawMap() {
    const slice = getSlice(_landscapeYear);
    if (!slice.length) return;

    const dataTable = new google.visualization.DataTable();
    dataTable.addColumn('string', 'Country');
    dataTable.addColumn('number', 'Score');
    dataTable.addColumn({type: 'string', role: 'tooltip', p: {html: true}});

    const REGIME_NUMERIC = { RO:4, FO:3, SL:2, SR:1 };

    slice.forEach(row => {
        const googleName = ISO_DISPLAY_NAMES[row.country] || NAME_TO_GOOGLE[row.country_name] || row.country_name;
        let score;
        switch (currentMapView) {
            case 'pillar_a': score = row.pillar_opportunity; break;
            case 'pillar_b': score = row.pillar_stability; break;
            case 'pillar_c': score = row.pillar_absorptive_capacity; break;
            case 'pillar_d': score = row.pillar_trajectory; break;
            case 'tos':      score = row.tos_score; break;
            case 'regime':   score = REGIME_NUMERIC[row.regime] || 0; break;
            default:         score = row.rao_score;
        }
        dataTable.addRow([googleName, score, createTooltip(row)]);
    });

    let colorAxis;
    switch (currentMapView) {
        case 'regime':   colorAxis = { colors:['#966060','#607c98','#C2A56D','#5d8a72'], minValue:1, maxValue:4 }; break;
        case 'tos':      colorAxis = { colors:['#252e42','#c9a961','#C2A56D'], minValue:0, maxValue:1 }; break;
        case 'pillar_a': colorAxis = { colors:['#252e42','#5d8a72'], minValue:0, maxValue:1 }; break;
        case 'pillar_b': colorAxis = { colors:['#252e42','#607c98'], minValue:0, maxValue:1 }; break;
        case 'pillar_c': colorAxis = { colors:['#252e42','#607c98'], minValue:0, maxValue:1 }; break;
        case 'pillar_d': colorAxis = { colors:['#252e42','#5d8a72'], minValue:0, maxValue:1 }; break;
        default:         colorAxis = { colors:['#966060','#c9a961','#5d8a72'], minValue:1, maxValue:10 };
    }

    _updateMapLegend();

    const chart = new google.visualization.GeoChart(document.getElementById('regions_div'));
    google.visualization.events.addListener(chart, 'select', function() {
        const sel = chart.getSelection();
        if (sel.length > 0) {
            const gName = dataTable.getValue(sel[0].row, 0);
            const country = slice.find(c => (ISO_DISPLAY_NAMES[c.country] || NAME_TO_GOOGLE[c.country_name] || c.country_name) === gName);
            if (country) openCountryAnalysis(country.country);
        }
    });
    chart.draw(dataTable, { colorAxis, backgroundColor:'#192030', datalessRegionColor:'#252e42',
        defaultColor:'#252e42', legend:'none',
        tooltip:{isHtml:true,showTitle:false}, keepAspectRatio:true });
}

function _updateMapLegend() {
    const v = _MAP_VIEWS[currentMapView] || _MAP_VIEWS.rao;
    const t = document.getElementById('legend-title-text');
    const g = document.getElementById('legend-gradient-bar');
    const lo = document.getElementById('legend-label-lo');
    const hi = document.getElementById('legend-label-hi');
    if (t) t.textContent = v.title;
    if (g) g.style.background = v.grad;
    if (lo) lo.textContent = v.lo;
    if (hi) hi.textContent = v.hi;
}

function createTooltip(row) {
    const rc = row.regime ? REGIME_COLORS[row.regime] : null;

    const pillDef = [

        { label:'Stab', val: row.pillar_stability           || 0, color:'#607c98' },

            <div class="tt-pillar-bar-wrap">

            </div>

    const regBadge = rc

        : '';
    const archBadge = row.archetype
        ? `<span style="font-family:var(--font-minor);font-size:0.52rem;color:var(--text-muted);border:1px solid rgba(255,255,255,0.1);padding:2px 6px;border-radius:2px;">${row.archetype}</span>`
        : '';
    const tosSig = row.tos_signal_label
        ? `<span style="font-family:var(--font-minor);font-size:0.52rem;color:var(--accent-amber);padding:2px 6px;border:1px solid rgba(201,169,97,0.25);border-radius:2px;">${row.tos_signal_label}</span>`
        : '';

    return `<div class="tooltip-custom">
        <div class="tt-head">
            <div class="tt-head-left">
                <div class="tt-country">${row.country_name}</div>
            </div>
            <div class="tt-head-right">
                <div class="tt-rao">${(row.rao_score||0).toFixed(2)}</div>

let selectedAnalysisYear = 2025;

function initializeAnalysisTab() {
    const ly = window.LATEST_YEAR || 2025;
    const options = rawData.map(c => `<option value="${c.country}">${c.country_name}</option>`).join('');
    document.getElementById('analysis-country-select').innerHTML += options;
    const sel = document.getElementById('analysis-year-select');
    if (sel && sel.options.length === 0) {
        for (let y = ly; y >= 2010; y--) {
            const opt = document.createElement('option');
            opt.value = y; opt.textContent = y;
            if (y === ly) opt.selected = true;
            sel.appendChild(opt);
        }
    }
}

function setAnalysisYear(y) {
    selectedAnalysisYear = y;
    const iso = document.getElementById('analysis-country-select').value;
    if (iso) _renderCountryV8Sections(iso);
}

function loadCountryAnalysis(code) {
    if (!code) {
        document.getElementById('analysis-content').style.display = 'none';
        document.getElementById('analysis-empty').style.display = 'block';
        return;
    }

    const country = rawData.find(c => c.country === code);
    if (!country) return;

    selectedCountry = country;
    const _ly = window.LATEST_YEAR || 2025;
    selectedAnalysisYear = _ly;
    const yeaSel = document.getElementById('analysis-year-select');
    if (yeaSel) yeaSel.value = _ly;

    document.getElementById('analysis-content').style.display = 'block';
    document.getElementById('analysis-empty').style.display = 'none';

    // RAO v8 sections
    _renderCountryV8Sections(code);

    // Legacy sections
    renderCountryProfile(country);
    renderStrengthsWeaknesses(country);
    renderNeighbors(country);
    renderSimilarCountries(country);
    renderRegionalContext(country);
    renderPillarBalance(country);
    renderGlobalBenchmark(country);
    renderPeerComparison(country);
    renderDeepDive(country);
    animateAnalysisCards();
}

// ── RAO v8: RAO Time Series ──────────────────────────────────────────────
function renderRAOTimeSeries(iso) {
    const history = getCountryHistory(iso);
    if (!history.length) return;
    const ctx = document.getElementById('country-rao-timeseries');
    if (!ctx) return;
    Chart.getChart(ctx)?.destroy();

    // Compute pillar proportional contributions for each year
    const pillarFills = history.map(r => {
        const pA =     r.pillar_opportunity         ?? 0;
        const pB =     r.pillar_stability           ?? 0;
        const pC =     r.pillar_absorptive_capacity ?? 0;
        const pD =     r.pillar_trajectory          ?? 0;
        const total = pA + pB + pC + pD || 1;
        const s = r.rao_score ?? 0;
        return { a: (pA/total)*s, b: (pB/total)*s, c: (pC/total)*s, d: (pD/total)*s };
    });

    registerChart(new Chart(ctx, {
        type: 'line',
        data: {
            labels: history.map(r => r.year),
            datasets: [
                // ── Pillar fill layers (stacked, transparent) ──
                {
                    label: 'Opportunity',
                    data: pillarFills.map(p => p.a),
                    borderWidth: 0, pointRadius: 0, tension: 0.3,
                    fill: 'origin',
                    backgroundColor: 'rgba(232,148,58,0.18)'
                },
                {
                    label: 'Fragility',
                    data: pillarFills.map(p => p.a + p.b),
                    borderWidth: 0, pointRadius: 0, tension: 0.3,
                    fill: '-1',
                    backgroundColor: 'rgba(75,150,232,0.18)'
                },
                {
                    label: 'Absorptive Capacity',
                    data: pillarFills.map(p => p.a + p.b + p.c),
                    borderWidth: 0, pointRadius: 0, tension: 0.3,
                    fill: '-1',
                    backgroundColor: 'rgba(169,110,219,0.18)'
                },
                {
                    label: 'Trajectory',
                    data: pillarFills.map(p => p.a + p.b + p.c + p.d),
                    borderWidth: 0, pointRadius: 0, tension: 0.3,
                    fill: '-1',
                    backgroundColor: 'rgba(45,200,122,0.18)'
                },
                // ── Reference lines (dotted, readable) ──
                {
                    label: 'Global Mean',
                    data: history.map(r => getGlobalMean('rao_score', r.year)),
                    borderColor: 'rgba(238,234,224,0.65)', borderDash: [5, 4],
                    borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false
                },
                {
                    label: `${history[0].archetype || 'Archetype'} Mean`,
                    data: history.map(r => {
                        const peers = getPeersByArchetype(iso, r.year);
                        if (!peers.length) return null;
                        return peers.reduce((s,p)=>s+p.rao_score,0)/peers.length;
                    }),
                    borderColor: ARCHETYPE_COLORS[history[history.length-1].archetype] || '#607c98',
                    borderDash: [3, 3], borderWidth: 1.5, pointRadius: 0, tension: 0.3, fill: false
                },
                // ── Country line (on top) ──
                {
                    label: history[0].country_name,
                    data: history.map(r => r.rao_score),
                    borderColor: '#C2A56D', backgroundColor: 'rgba(194,165,109,0.0)',
                    borderWidth: 2.5, pointRadius: 3, pointBackgroundColor: '#C2A56D',
                    tension: 0.3, fill: false
                }
            ]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
                legend: { display: true, position: 'bottom', labels: { color:'rgba(238,234,224,0.5)', font:{size:10}, boxWidth:10, padding:12,
                    filter: item => !['Opportunity','Fragility','Absorptive Capacity','Trajectory'].includes(item.text)
                } },
                tooltip: {
                    mode: 'index', intersect: false,
                    callbacks: { label: ctx => {
                        if (['Opportunity','Fragility','Absorptive Capacity','Trajectory'].includes(ctx.dataset.label)) return null;
                        return `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(2) ?? '—'}`;
                    }}
                }
            },
            scales: {
                x: { grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'rgba(238,234,224,0.4)',font:{size:10}} },
                y: { min: 1, max: 10, grid:{color:'rgba(255,255,255,0.04)'}, ticks:{color:'rgba(238,234,224,0.4)',font:{size:10}} }
            }
        }
    }));
}

// ── RAO v8: Norm Variable Breakdown (table style) ────────────────────────
function renderNormVarBreakdown(iso, year) {
    const row = getCountry(iso, year) || getLatestRow(iso);
    const el = document.getElementById('country-norm-vars-table');
    if (!row || !el) return;

    const PILLAR_GROUPS = [
        { key:'opportunity', label:'Opportunity',        color:'#C2A56D', vars: PILLARS.opportunity.vars },
        { key:'stability',   label:'Stability',          color:'#607c98', vars: PILLARS.stability.vars },
        { key:'absorptive',  label:'Absorptive Capacity',color:'#607c98', vars: PILLARS.absorptive.vars },
        { key:'trajectory',  label:'Trajectory',         color:'#5d8a72', vars: PILLARS.trajectory.vars }
    ];

    const globalMeans = {};
    PILLAR_GROUPS.forEach(g => g.vars.forEach(v => {
        const vals = latestSlice.map(r => r[v]).filter(x => x != null && !isNaN(x));
        globalMeans[v] = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : 0.5;
    }));

    const rows = PILLAR_GROUPS.map(g => {
        const varRows = g.vars.map(v => {
            const val = row[v] ?? 0;
            const avg = globalMeans[v];
            const delta = val - avg;
            const barW = Math.round(val * 100);
            const deltaCol = delta >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';
            return `<tr style="border-bottom:1px solid rgba(255,255,255,0.03);" onmouseenter="this.style.background='rgba(255,255,255,0.02)'" onmouseleave="this.style.background=''">
                <td style="padding:0.45rem 1rem 0.45rem 1.4rem;font-family:var(--font-minor);font-size:0.68rem;color:var(--w65);">${NORM_VAR_LABELS[v]||v}</td>
                <td style="padding:0.45rem 0.5rem;width:42%;"><div style="height:6px;background:rgba(255,255,255,0.05);border-radius:2px;overflow:hidden;"><div style="width:${barW}%;height:100%;background:${g.color};border-radius:2px;transition:width 0.4s;"></div></div></td>
                <td style="padding:0.45rem 0.75rem;font-family:var(--font-mono);font-size:0.68rem;color:${g.color};text-align:right;white-space:nowrap;">${val.toFixed(3)}</td>
                <td style="padding:0.45rem 1rem 0.45rem 0.25rem;font-family:var(--font-mono);font-size:0.65rem;color:${deltaCol};text-align:right;white-space:nowrap;">${delta>=0?'+':''}${delta.toFixed(3)}</td>
            </tr>`;
        }).join('');
        const pillarVal = row[PILLARS[g.key]?.key] ?? null;
        const pillarDisp = pillarVal != null ? ` <span style="font-family:var(--font-mono);font-size:0.62rem;color:${g.color};margin-left:0.5rem;">${pillarVal.toFixed(2)}</span>` : '';
        return `<tr style="background:rgba(255,255,255,0.025);">
            <td colspan="4" style="padding:0.5rem 1rem;font-family:var(--font-minor);font-size:0.6rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:${g.color};">${g.label}${pillarDisp}</td>
        </tr>${varRows}`;
    }).join('');

    el.innerHTML = `<div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;">
            <thead><tr style="border-bottom:1px solid var(--border-subtle);">
                <th style="padding:0.5rem 1rem 0.5rem 1.4rem;font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);text-align:left;font-weight:400;">Variable</th>
                <th style="padding:0.5rem;font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);text-align:left;font-weight:400;width:42%;">Score</th>
                <th style="padding:0.5rem 0.75rem;font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);text-align:right;font-weight:400;">Value</th>
                <th style="padding:0.5rem 1rem 0.5rem 0.25rem;font-family:var(--font-minor);font-size:0.55rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);text-align:right;font-weight:400;">vs Global</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>
    </div>`;
}

// ── Legacy ───────────────────────────────────────────────────────────────
function renderCountryProfile(country) {
    const scoreClass = getScoreClass(country.calculated_rao);
    const percentile = ((rawData.length - country.rank + 1) / rawData.length) * 100;

    // Enhancement 13: Gradient background based on score tier
    let gradientBg = 'linear-gradient(135deg, rgba(74, 157, 111, 0.15), rgba(74, 157, 111, 0.05))';
    if (country.calculated_rao >= 7) {
        gradientBg = 'linear-gradient(135deg, rgba(74, 157, 111, 0.2), rgba(123, 168, 74, 0.1))';
    } else if (country.calculated_rao >= 6) {
        gradientBg = 'linear-gradient(135deg, rgba(123, 168, 74, 0.15), rgba(123, 168, 74, 0.05))';
    } else if (country.calculated_rao >= 5) {
        gradientBg = 'linear-gradient(135deg, rgba(201, 169, 97, 0.15), rgba(201, 169, 97, 0.05))';
    } else if (country.calculated_rao >= 3) {
        gradientBg = 'linear-gradient(135deg, rgba(198, 125, 82, 0.15), rgba(198, 125, 82, 0.05))';

// Enhancement 13: Animated counter function
function animateCounters() {
    document.querySelectorAll('.animated-counter').forEach(counter => {
        const target = parseFloat(counter.getAttribute('data-target'));
        const duration = 1500;
        const start = 0;
        const startTime = performance.now();

        function update(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const easeOutQuart = 1 - Math.pow(1 - progress, 4);
            const current = start + (target - start) * easeOutQuart;
            counter.textContent = current.toFixed(2);

            if (progress < 1) {
                requestAnimationFrame(update);
            } else {
                counter.textContent = target.toFixed(2);
            }
        }

        requestAnimationFrame(update);
    });

    // Animate pillar bars
    setTimeout(() => {
        document.querySelectorAll('.pillar-bar-animated').forEach(bar => {
            const width = bar.getAttribute('data-width');
            bar.style.width = width + '%';
            // Show percentile marker after animation
            setTimeout(() => {
                const marker = bar.querySelector('.pillar-percentile-marker');
                if (marker) marker.style.opacity = '1';
            }, 1000);
        });
    }, 300);
}

// Calculate pillar percentile rank
function calculatePillarPercentile(country, vars, isStability) {
    const scores = rawData.map(c => {
        const score = calculatePillarScore(c, vars);
        return isStability ? (10 - score) : score;
    }).sort((a, b) => a - b);

    const countryScore = isStability ?
        (10 - calculatePillarScore(country, vars)) :
        calculatePillarScore(country, vars);

    const rank = scores.filter(s => s < countryScore).length + 1;
    return Math.round((rank / scores.length) * 100);
}

// Calculate global variable average
function calculateGlobalVariableAverage(varName) {
    const values = rawData.map(c => c[varName]).filter(v => v !== null && !isNaN(v));
    return values.reduce((sum, v) => sum + v, 0) / values.length;
}

// Calculate variable percentile
function calculateVariablePercentile(country, varName) {
    const values = rawData.map(c => c[varName]).filter(v => v !== null && !isNaN(v)).sort((a, b) => a - b);
    const countryValue = country[varName];
    if (countryValue === null || isNaN(countryValue)) return 0;

    // For inverse variables, invert the ranking
    let rank;
    if (INVERSE_VARIABLES.includes(varName)) {
        rank = values.filter(v => v > countryValue).length + 1;
    } else {
        rank = values.filter(v => v < countryValue).length + 1;
    }

    return Math.round((rank / values.length) * 100);
}

function renderNeighbors(country) {
    const region = getRegion(country.country);
    const regional = latestSlice
        .filter(r => r.country !== country.country && getRegion(r.country) === region)
        .sort((a, b) => Math.abs(a.rao_score - country.calculated_rao) - Math.abs(b.rao_score - country.calculated_rao))
        .slice(0, 5);

    if (!regional.length) {
        document.getElementById('neighbors-content').innerHTML = '<p style="color:var(--text-muted); font-size:0.82rem; padding:1rem 1.2rem;">No regional data available.</p>';
        return;
    }

    const peers = regional.map(r => {
        const simScore = Math.max(0, 100 - Math.abs(r.rao_score - country.calculated_rao) * 20);
        return { name: r.country_name, code: r.country, score: r.rao_score, rank: r.rank, country: r,
            similarity: simScore };
    });

    document.getElementById('neighbors-content').innerHTML = `
        <div style="padding:0.6rem 1.2rem 0.75rem;">
            ${peers.map(n => renderConnectionCard(n.code, n.name, n.rank, n.score, n.country, n.similarity, n.similarity, 'Regional', country)).join('')}
        </div>`;

    setTimeout(() => animateBars('#neighbors-content'), 100);
}

function renderSimilarCountries(country) {
    // Enhancement 12: Smart matching with filters
    const matchMode = window.similarMatchMode || 'Both';

    // Calculate similarity scores
    const similarityScores = rawData
        .filter(c => c.country !== country.country)
        .map(c => {
            let score = 0;
            let matchingPillars = [];

            // Calculate opportunity similarity
            const oppDiff = Math.abs(c.calculated_opportunity - country.calculated_opportunity);
            const oppSimilarity = Math.max(0, 100 - (oppDiff * 20));

            // Calculate stability similarity
            const stabDiff = Math.abs(c.calculated_stability - country.calculated_stability);
            const stabSimilarity = Math.max(0, 100 - (stabDiff * 20));

            // Calculate pillar-level matching
            const allPillars = [...OPPORTUNITY_PILLARS, ...STABILITY_PILLARS];
            allPillars.forEach(p => {
                const countryPillarScore = calculatePillarScore(country, p.vars);
                const comparePillarScore = calculatePillarScore(c, p.vars);
                if (Math.abs(countryPillarScore - comparePillarScore) < 1.5) {
                    matchingPillars.push(p.name);
                }
            });

            // Apply match mode filter
            if (matchMode === 'Opportunity') {
                score = oppSimilarity;
            } else if (matchMode === 'Stability') {
                score = stabSimilarity;
            } else {
                score = (oppSimilarity + stabSimilarity) / 2;
            }

            return {
                country: c,
                score: score,
                oppSimilarity: oppSimilarity,
                stabSimilarity: stabSimilarity,
                matchingPillars: matchingPillars
            };
        })
        .sort((a, b) => b.score - a.score)
        .slice(0, 5);


    // Render filter buttons into the header
    document.getElementById('similar-filter-btns').innerHTML = ['Both','Opportunity','Stability'].map(m => `
        <button onclick="setSimilarMatchMode('${m}')"
            style="padding:0.3rem 0.75rem; border:1px solid ${matchMode===m ? 'var(--accent-gold)' : 'var(--border-subtle)'}; background:${matchMode===m ? 'rgba(194,165,109,0.12)' : 'transparent'}; color:${matchMode===m ? 'var(--accent-gold)' : 'var(--text-muted)'}; border-radius:2px; font-family:var(--font-minor); font-size:0.58rem; text-transform:uppercase; letter-spacing:0.1em; cursor:pointer; transition:all 0.15s;">
            ${m}
        </button>`).join('');

    document.getElementById('similar-content').innerHTML = `
        <div style="padding:0.6rem 1.2rem 0.75rem;">
            ${similarityScores.map(s => renderConnectionCard(
                s.country.country, s.country.country_name, s.country.rank,
                s.country.calculated_rao, s.country, s.score, s.score, 'RAO Match', country
            )).join('')}
        </div>`;

    setTimeout(() => animateBars('#similar-content'), 100);
}

function calculatePillarVariance(country) {
    const allPillarScores = [
        ...OPPORTUNITY_PILLARS.map(p => calculatePillarScore(country, p.vars)),
        ...STABILITY_PILLARS.map(p => 10 - calculatePillarScore(country, p.vars))
    ];
    const mean = allPillarScores.reduce((a, b) => a + b, 0) / allPillarScores.length;
    const variance = allPillarScores.reduce((sum, score) => sum + Math.pow(score - mean, 2), 0) / allPillarScores.length;
    return Math.sqrt(variance);
}

function renderDeepDive(country) {
    const allVars = [];
    [...OPPORTUNITY_PILLARS, ...STABILITY_PILLARS].forEach(pillar => {
        pillar.vars.forEach(v => {
            if (country[v] !== null && !isNaN(country[v])) {
                const rawScore = country[v];
                const effectiveScore = INVERSE_VARIABLES.includes(v) ? (10 - rawScore) : rawScore;

                // Calculate statistics
                const allValues = rawData.map(c => c[v]).filter(val => val !== null && !isNaN(val));
                const globalAvg = allValues.reduce((a, b) => a + b, 0) / allValues.length;
                const sortedValues = [...allValues].sort((a, b) => a - b);
                const globalMedian = sortedValues[Math.floor(sortedValues.length / 2)];
                const globalMin = Math.min(...allValues);
                const globalMax = Math.max(...allValues);
                const percentile = calculateVariablePercentile(country, v);

                allVars.push({
                    name: VARIABLE_NAMES[v] || v,
                    varKey: v,
                    pillar: pillar.name,
                    score: rawScore,
                    effectiveScore: effectiveScore,
                    isInverse: INVERSE_VARIABLES.includes(v),
                    globalAvg: globalAvg,
                    globalMedian: globalMedian,
                    globalMin: globalMin,
                    globalMax: globalMax,
                    percentile: percentile
                });
            }
        });
    });

    // Store for sorting
    window.deepDiveVars = allVars;
    window.deepDiveSortMode = 'strength';

    renderDeepDiveTable();
}

                    </tr>

                    ${sortedVars.map((v, idx) => {

                                        ${vsAvg > 0 ? '+' : ''}${vsAvg.toFixed(2)}

                                <td style="padding: 1rem; text-align: center; font-family: var(--font-mono); color: var(--text-muted); font-size: 0.95rem;">
                                    ${v.globalMedian.toFixed(2)}

                                    ${v.globalMin.toFixed(1)} - ${v.globalMax.toFixed(1)}
                                </td>
                                <td style="padding: 1rem; text-align: center;">
                                    <div style="font-family: var(--font-mono); font-weight: 600; color: ${color}; font-size: 0.95rem;">
                                        ${v.percentile}th
                                    </div>
                                </td>
                                <td style="padding: 1rem; text-align: center;">
                                    <div style="width: 100%; max-width: 100px; margin: 0 auto;">
                                        <div style="height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;">

                                        </div>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>
    `;

    document.getElementById('deep-dive-content').innerHTML = html;
}

function _renderCompareDecompTable(isos) {
    const el = document.getElementById('compare-decomp-table');
    if (!el) return;
    const rows2024 = isos.map(iso => getLatestRow(iso)).filter(Boolean); // named rows2024 for compat
    if (!rows2024.length) return;

    const fields = [
        { key:'rao_score_pre_overlay', label:'Pre-Overlay Score' },
        { key:'overlay_adjustment',    label:'Overlay Adjustment' },
        { key:'market_size_bonus',     label:'Market Size Bonus' },
        { key:'rao_score',             label:'Final RAO', bold:true },
        { key:'cvar25',                label:'CVaR₂₅' },
        { key:'volatility_band',       label:'Scenario Uncertainty (±)' }
    ];

    const header = `<tr><th style="text-align:left;padding:0.5rem;font-family:var(--font-minor);font-size:0.58rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);">Metric</th>
        ${rows2024.map((r,i)=>`<th style="text-align:right;padding:0.5rem;font-family:var(--font-minor);font-size:0.68rem;color:${_COMPARE_COLORS[i]};">${r.country_name}</th>`).join('')}</tr>`;

    const rowsHTML = fields.map(f => {
        const vals = rows2024.map(r => r[f.key] ?? null);
        const maxVal = Math.max(...vals.filter(v=>v!=null));
        const cells = vals.map((v, i) => {
            const isMax = v != null && v === maxVal;
            const style = `text-align:right;padding:0.45rem 0.5rem;font-family:var(--font-mono);font-size:0.8rem;${f.bold?'font-weight:600;':''} color:${isMax?_COMPARE_COLORS[i]:'var(--w65)'};`;

        }).join('');
        return `<tr style="border-bottom:1px solid var(--border-subtle);">
            <td style="padding:0.45rem 0.5rem;font-family:var(--font-minor);font-size:0.72rem;color:var(--w65);${f.bold?'font-weight:600;color:var(--text-white);':''}">${f.label}</td>${cells}</tr>`;

    el.innerHTML = `<table style="width:100%;border-collapse:collapse;"><thead>${header}</thead><tbody>${rowsHTML}</tbody></table>`;

function findSimilarCountries() {
    if (rawData.length < 3) return;

    // Pick a random well-performing country and find similar ones
    const base = rawData[Math.floor(Math.random() * Math.min(30, rawData.length))];
    const similar = rawData
        .filter(c => c.country !== base.country && Math.abs(c.calculated_rao - base.calculated_rao) < 1)
        .sort((a, b) => Math.abs(a.calculated_rao - base.calculated_rao) - Math.abs(b.calculated_rao - base.calculated_rao))
        .slice(0, 2);

    document.getElementById('compare-country-1').value = base.country;
    if (similar[0]) document.getElementById('compare-country-2').value = similar[0].country;
    if (similar[1]) document.getElementById('compare-country-3').value = similar[1].country;

    updateComparison();
}

function updateComparison() {
    const code1 = document.getElementById('compare-country-1').value;
    const code2 = document.getElementById('compare-country-2').value;
    const code3 = document.getElementById('compare-country-3').value;

    const countries = [code1, code2, code3].filter(c => c).map(code => rawData.find(r => r.country === code));

    if (countries.length < 2) {
        document.getElementById('compare-cards').innerHTML = '<p style="color: var(--text-muted); padding: 2rem;">Please select at least 2 countries to compare.</p>';
        document.getElementById('compare-details').style.display = 'none';
        document.getElementById('comparison-summary').innerHTML = '';
        return;
    }

    // Item 20: Comparison Summary Card
    if (countries.length === 2) {
        const c1 = countries[0];
        const c2 = countries[1];

        const allPillars = [
            ...OPPORTUNITY_PILLARS.map(p => ({...p, type: 'opp'})),
            ...STABILITY_PILLARS.map(p => ({...p, type: 'stab'}))
        ];

        let c1Wins = 0, c2Wins = 0;
        let maxDiff = 0;
        let maxDiffPillar = '';

        allPillars.forEach(p => {
            const s1 = p.type === 'stab' ? 10 - calculatePillarScore(c1, p.vars) : calculatePillarScore(c1, p.vars);
            const s2 = p.type === 'stab' ? 10 - calculatePillarScore(c2, p.vars) : calculatePillarScore(c2, p.vars);
            const diff = Math.abs(s1 - s2);

            if (s1 > s2) c1Wins++;
            else if (s2 > s1) c2Wins++;

            if (diff > maxDiff) {
                maxDiff = diff;
                maxDiffPillar = p.name;
            }
        });

        // Calculate similarity score (0-100%)
        const totalPillars = allPillars.length;
        const avgDiff = allPillars.reduce((sum, p) => {
            const s1 = p.type === 'stab' ? 10 - calculatePillarScore(c1, p.vars) : calculatePillarScore(c1, p.vars);
            const s2 = p.type === 'stab' ? 10 - calculatePillarScore(c2, p.vars) : calculatePillarScore(c2, p.vars);
            return sum + Math.abs(s1 - s2);
        }, 0) / totalPillars;
        const similarity = Math.max(0, 100 - (avgDiff * 10));

        const winner = c1.calculated_rao > c2.calculated_rao ? c1 : c2;

        const summaryHTML = `
            <div class="comparison-summary">
                <div class="summary-title">
                    <i class="ri-bar-chart-grouped-line"></i>
                    Comparison Overview
                </div>
                <div class="summary-stats">
                    <div class="summary-stat">
                        <div class="summary-stat-value">${c1Wins}</div>
                        <div class="summary-stat-label">${c1.country_name} Leads</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${c2Wins}</div>
                        <div class="summary-stat-label">${c2.country_name} Leads</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${similarity.toFixed(0)}%</div>
                        <div class="summary-stat-label">Similarity Score</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${maxDiff.toFixed(1)}</div>
                        <div class="summary-stat-label">Biggest Gap</div>
                    </div>
                </div>
                <div class="summary-insight">
                    <strong>${c1.country_name}</strong> leads in <strong>${c1Wins} pillars</strong>, while <strong>${c2.country_name}</strong> leads in <strong>${c2Wins} pillars</strong>.
                    The biggest differential is in <strong>${maxDiffPillar}</strong> (${maxDiff.toFixed(2)} points).
                    Overall, <strong>${winner.country_name}</strong> ranks higher at <strong>#${winner.rank}</strong> with an RAO score of <strong>${winner.calculated_rao.toFixed(2)}</strong>.
                </div>
            </div>
        `;
        document.getElementById('comparison-summary').innerHTML = summaryHTML;
    } else if (countries.length >= 3) {
        // Show aggregate statistics for 3-5 selected countries
        const raoScores = countries.map(c => c.calculated_rao);
        const oppScores = countries.map(c => c.calculated_opportunity);
        const stabScores = countries.map(c => c.calculated_stability);

        const avgRAO = (raoScores.reduce((a, b) => a + b, 0) / raoScores.length).toFixed(2);
        const avgOpp = (oppScores.reduce((a, b) => a + b, 0) / oppScores.length).toFixed(2);
        const avgStab = (stabScores.reduce((a, b) => a + b, 0) / stabScores.length).toFixed(2);

        const minRAO = Math.min(...raoScores).toFixed(2);
        const maxRAO = Math.max(...raoScores).toFixed(2);
        const minOpp = Math.min(...oppScores).toFixed(2);
        const maxOpp = Math.max(...oppScores).toFixed(2);
        const minStab = Math.min(...stabScores).toFixed(2);
        const maxStab = Math.max(...stabScores).toFixed(2);

        const bestCountry = countries.reduce((best, c) => c.calculated_rao > best.calculated_rao ? c : best);
        const worstCountry = countries.reduce((worst, c) => c.calculated_rao < worst.calculated_rao ? c : worst);

        const summaryHTML = `
            <div class="comparison-summary">
                <div class="summary-title">
                    <i class="ri-bar-chart-grouped-line"></i>
                    Selected Countries Statistics (${countries.length} Countries)
                </div>
                <div class="summary-stats">
                    <div class="summary-stat">
                        <div class="summary-stat-value">${avgRAO}</div>
                        <div class="summary-stat-label">Average RAO Score</div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem;">Range: ${minRAO} - ${maxRAO}</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${avgOpp}</div>
                        <div class="summary-stat-label">Average Opportunity</div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem;">Range: ${minOpp} - ${maxOpp}</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${avgStab}</div>
                        <div class="summary-stat-label">Average Stability</div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem;">Range: ${minStab} - ${maxStab}</div>
                    </div>
                    <div class="summary-stat">
                        <div class="summary-stat-value">${(parseFloat(maxRAO) - parseFloat(minRAO)).toFixed(2)}</div>
                        <div class="summary-stat-label">Score Spread</div>
                        <div style="font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem;">Gap between highest & lowest</div>
                    </div>
                </div>
                <div class="summary-insight">
                    Among the selected countries, <strong>${bestCountry.country_name}</strong> ranks highest at <strong>#${bestCountry.rank}</strong> with an RAO score of <strong>${bestCountry.calculated_rao.toFixed(2)}</strong>, while <strong>${worstCountry.country_name}</strong> ranks <strong>#${worstCountry.rank}</strong> with a score of <strong>${worstCountry.calculated_rao.toFixed(2)}</strong>.
                </div>
            </div>
        `;
        document.getElementById('comparison-summary').innerHTML = summaryHTML;
    } else {
        document.getElementById('comparison-summary').innerHTML = '';
    }

    // Item 22: Enhanced Comparison Cards with Winner Indicators
    const topCountry = countries.reduce((max, c) => c.calculated_rao > max.calculated_rao ? c : max);

    const cardsHTML = countries.map(c => {
        const isWinner = c === topCountry;
        const oppWinner = countries.reduce((max, ct) => ct.calculated_opportunity > max.calculated_opportunity ? ct : max) === c;
        const stabWinner = countries.reduce((max, ct) => ct.calculated_stability > max.calculated_stability ? ct : max) === c;
        const rankWinner = countries.reduce((best, ct) => ct.rank < best.rank ? ct : best) === c;

        return `
            <div class="compare-card ${isWinner ? 'winner' : ''}">
                <div class="compare-header">
                    <div>
                        <div class="compare-country-name">
                            ${c.country_name}${isWinner ? '<span class="winner-badge">Top Score</span>' : ''}
                        </div>
                    </div>
                    <div class="compare-score ${getScoreClass(c.calculated_rao)}">${c.calculated_rao.toFixed(2)}</div>
                </div>
                <div class="compare-row ${rankWinner ? 'winner-row' : ''}">
                    <span class="compare-label">
                        Global Rank
                        ${rankWinner ? '<i class="ri-trophy-fill winner-icon"></i>' : ''}
                    </span>
                    <span class="compare-value">#${c.rank}</span>
                </div>
                <div class="compare-row ${oppWinner ? 'winner-row' : ''}">
                    <span class="compare-label">
                        Opportunity
                        ${oppWinner ? '<i class="ri-check-line winner-icon"></i>' : ''}
                    </span>
                    <span class="compare-value ${getScoreClass(c.calculated_opportunity)}">${c.calculated_opportunity.toFixed(2)}</span>
                </div>
                <div class="compare-row ${stabWinner ? 'winner-row' : ''}">

// Item 25: Pillar Winners Scorecard
function renderPillarScorecard(c1, c2) {
    const allPillars = [
        ...OPPORTUNITY_PILLARS.map(p => ({...p, type: 'opp'})),
        ...STABILITY_PILLARS.map(p => ({...p, type: 'stab'}))
    ];

    const pillarResults = allPillars.map(p => {
        const s1 = p.type === 'stab' ? 10 - calculatePillarScore(c1, p.vars) : calculatePillarScore(c1, p.vars);
        const s2 = p.type === 'stab' ? 10 - calculatePillarScore(c2, p.vars) : calculatePillarScore(c2, p.vars);
        const diff = Math.abs(s1 - s2);
        const winner = diff < 0.5 ? 'tie' : (s1 > s2 ? 'c1' : 'c2');
        return { pillar: p, s1, s2, diff, winner };
    });

    const c1Wins = pillarResults.filter(r => r.winner === 'c1').length;
    const c2Wins = pillarResults.filter(r => r.winner === 'c2').length;
    const ties = pillarResults.filter(r => r.winner === 'tie').length;

    const html = `
        <div class="pillar-scorecard">
            <h3 class="chart-title" style="margin-bottom: 1.5rem;">
                <i class="ri-medal-line"></i> Pillar Winners Scorecard
            </h3>
            <div class="scorecard-header">
                <div class="scorecard-country ${c1Wins > c2Wins ? 'leading' : ''}">
                    <div class="scorecard-medal">${c1Wins > c2Wins ? '#1' : c1Wins === c2Wins ? '=' : '#2'}</div>
                    <div class="scorecard-country-name">${c1.country_name}</div>
                    <div class="scorecard-wins">${c1Wins}</div>
                    <div class="scorecard-label">Pillars Won</div>
                </div>
                <div class="scorecard-country ${c2Wins > c1Wins ? 'leading' : ''}">
                    <div class="scorecard-medal">${c2Wins > c1Wins ? '#1' : c2Wins === c1Wins ? '=' : '#2'}</div>
                    <div class="scorecard-country-name">${c2.country_name}</div>
                    <div class="scorecard-wins">${c2Wins}</div>
                    <div class="scorecard-label">Pillars Won</div>
                </div>
                ${ties > 0 ? `
                <div class="scorecard-country">
                    <div class="scorecard-medal">=</div>
                    <div class="scorecard-country-name">Ties</div>
                    <div class="scorecard-wins">${ties}</div>
                    <div class="scorecard-label">Close Matches</div>
                </div>
                ` : ''}
            </div>
            <h4 style="font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); margin-bottom: 1rem;">
                Pillar-by-Pillar Results
            </h4>
            <div class="pillar-winners-grid">
                ${pillarResults.map(r => `
                    <div class="pillar-winner-item ${r.winner === 'c1' ? 'country-1' : r.winner === 'c2' ? 'country-2' : 'tie'}"
                         onclick="showPillarVariablesBreakdown('${r.pillar.name}', '${r.pillar.key}', '${r.pillar.type}', '${c1.country}', '${c2.country}')"
                         title="Click to see variable breakdown">
                        <div class="pillar-winner-name">
                            ${r.winner === 'c1' ? '#1' : r.winner === 'c2' ? '#2' : '='}
                            ${r.pillar.name}
                        </div>
                        <div class="pillar-winner-score">
                            ${r.s1.toFixed(2)} vs ${r.s2.toFixed(2)}
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;

    document.getElementById('pillar-scorecard').innerHTML = html;
}

function showPillarVariablesBreakdown(pillarName, pillarKey, pillarType, code1, code2) {
    const c1 = rawData.find(r => r.country === code1);
    const c2 = rawData.find(r => r.country === code2);
    const pillar = pillarType === 'opp' ?
        OPPORTUNITY_PILLARS.find(p => p.key === pillarKey) :
        STABILITY_PILLARS.find(p => p.key === pillarKey);

    if (!pillar) return;

    const vars = pillar.vars.map(v => {
        const v1 = parseFloat(c1[v]) || 0;
        const v2 = parseFloat(c2[v]) || 0;
        return {
            name: VARIABLE_NAMES[v] || v,
            v1, v2,
            diff: v1 - v2,
            winner: Math.abs(v1 - v2) < 0.1 ? 'tie' : (v1 > v2 ? c1.country_name : c2.country_name)
        };
    });

    const html = `
        <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 2rem;"
             onclick="this.remove()">
            <div style="background: var(--secondary-bg); border: 2px solid var(--accent-gold); border-radius: 12px; padding: 2rem; max-width: 600px; width: 100%; max-height: 80vh; overflow-y: auto;"
                 onclick="event.stopPropagation()">
                <h3 style="font-family: var(--font-head); font-size: 1.5rem; color: var(--accent-gold); margin-bottom: 1.5rem;">
                    ${pillarName} - Variable Breakdown
                </h3>
                <div style="display: grid; gap: 0.75rem;">
                    ${vars.map(v => `
                        <div style="padding: 0.75rem 1rem; background: rgba(255,255,255,0.02); border-radius: 3px; border-top: 2px solid ${v.winner === c1.country_name ? 'var(--accent-gold)' : v.winner === c2.country_name ? 'var(--accent-blue)' : 'var(--accent-amber)'}; display: flex; justify-content: space-between; align-items: center;">
                            <div style="font-family: var(--font-body); font-size: 0.88rem; font-weight: 500;">${v.name}</div>
                            <div style="display: flex; gap: 1.5rem; font-family: var(--font-mono); font-size: 0.85rem;">
                                <span style="color: ${v.v1 > v.v2 ? 'var(--accent-gold)' : 'var(--text-muted)'}">${c1.country_name}: <strong>${v.v1.toFixed(2)}</strong></span>
                                <span style="color: ${v.v2 > v.v1 ? 'var(--accent-gold)' : 'var(--text-muted)'}">${c2.country_name}: <strong>${v.v2.toFixed(2)}</strong></span>
                            </div>
                        </div>
                    `).join('')}
                </div>
                <button onclick="this.closest('div[style*=\"position: fixed\"]').remove()"
                        style="margin-top: 1.5rem; padding: 0.75rem 1.5rem; background: var(--accent-gold); color: var(--primary-bg); border: none; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%;">
                    Close
                </button>
            </div>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', html);
}

// Item 23: Enhanced Pillar Comparison Table
function renderEnhancedPillarTable(countries) {
    const allPillars = [
        ...OPPORTUNITY_PILLARS.map(p => ({...p, type: 'opp'})),
        ...STABILITY_PILLARS.map(p => ({...p, type: 'stab'}))
    ];

    const pillarData = allPillars.map(p => {
        const scores = countries.map(c => {
            const score = p.type === 'stab' ? 10 - calculatePillarScore(c, p.vars) : calculatePillarScore(c, p.vars);
            return score;
        });
        const maxScore = Math.max(...scores);
        const winnerIndices = scores.map((s, i) => s === maxScore ? i : -1).filter(i => i !== -1);

        let diff = 0;
        if (countries.length === 2) {
            diff = scores[0] - scores[1];
        }

        return { pillar: p, scores, maxScore, winnerIndices, diff };
    });

    const html = `
        <h3 class="chart-title" style="margin-top: 0; margin-bottom: 1rem; padding: 0.85rem 1.2rem 0; border-bottom: none;">
            <i class="ri-table-line"></i> Enhanced Pillar Comparison
        </h3>
        <table style="width: 100%; border-collapse: separate; border-spacing: 0;">
            <thead>
                <tr style="background: var(--secondary-bg);">
                    <th style="padding: 1rem; text-align: left; border-bottom: 2px solid var(--accent-gold); font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold);">
                        Pillar
                    </th>
                    ${countries.map(c => `
                        <th style="padding: 1rem; text-align: center; border-bottom: 2px solid var(--accent-gold); font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold);">
                            ${c.country_name}
                        </th>
                    `).join('')}
                    ${countries.length === 2 ? `
                        <th style="padding: 1rem; text-align: center; border-bottom: 2px solid var(--accent-gold); font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold);">
                            Differential
                        </th>
                    ` : ''}
                </tr>
            </thead>
            <tbody>
                ${pillarData.map(pd => `
                    <tr style="border-bottom: 1px solid var(--border-subtle); transition: all 0.3s ease;">
                        <td style="padding: 1rem;">${pd.pillar.name}</td>
                        ${pd.scores.map((s, idx) => {
                            const isWinner = pd.winnerIndices.includes(idx);
                            const isLargeDiff = countries.length === 2 && Math.abs(pd.diff) > 1.0;
                            return `
                                <td style="padding: 1rem; text-align: center; ${isWinner ? 'background: rgba(194, 165, 109, 0.05); font-weight: 600; color: var(--accent-gold);' : ''} ${isLargeDiff && idx === 0 ? 'border-top: 2px solid var(--accent-amber);' : ''}">
                                    ${isWinner ? '<i class="ri-trophy-fill" style="color: var(--accent-gold); margin-right: 0.25rem;"></i>' : ''}
                                    <span class="${getScoreClass(s)}">${s.toFixed(2)}</span>
                                    <div class="pillar-value-bar" style="width: ${(s / 10) * 100}%; opacity: ${isWinner ? 1 : 0.3};"></div>
                                </td>
                            `;
                        }).join('')}
                        ${countries.length === 2 ? `
                            <td class="pillar-diff-col" style="padding: 1rem;">
                                <span style="padding: 4px 8px; background: ${pd.diff > 0 ? 'rgba(74, 157, 111, 0.2)' : 'rgba(168, 79, 79, 0.2)'}; color: ${pd.diff > 0 ? 'var(--accent-green)' : 'var(--accent-red)'}; border-radius: 4px; font-weight: 600;">
                                    ${pd.diff > 0 ? '+' : ''}${pd.diff.toFixed(2)}
                                </span>
                            </td>
                        ` : ''}
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;

    document.getElementById('pillar-comparison').innerHTML = html;
}

// Item 21: Expanded Differential Analysis
function renderExpandedDifferential(c1, c2) {
    const allPillars = [
        ...OPPORTUNITY_PILLARS.map(p => ({...p, type: 'opp'})),
        ...STABILITY_PILLARS.map(p => ({...p, type: 'stab'}))
    ];

    const pillarDiffs = allPillars.map(p => {
        const s1 = p.type === 'stab' ? 10 - calculatePillarScore(c1, p.vars) : calculatePillarScore(c1, p.vars);
        const s2 = p.type === 'stab' ? 10 - calculatePillarScore(c2, p.vars) : calculatePillarScore(c2, p.vars);
        const diff = s1 - s2;
        return {
            name: p.name,
            diff,
            absDiff: Math.abs(diff),
            leader: diff > 0 ? c1.country_name : c2.country_name,
            s1, s2
        };
    });

    pillarDiffs.sort((a, b) => b.absDiff - a.absDiff);

    const diff = c1.calculated_rao - c2.calculated_rao;
    const oppDiff = c1.calculated_opportunity - c2.calculated_opportunity;
    const stabDiff = c1.calculated_stability - c2.calculated_stability;
    const rankDiff = c2.rank - c1.rank;

    const html = `
        <div style="background: var(--card-bg); border: 1px solid var(--border-subtle); box-shadow: var(--card-shadow); border-radius: var(--card-radius); padding: 2rem; margin-top: 2rem;">
            <div class="differential-title" style="font-family: var(--font-head); font-size: 1.3rem; color: var(--accent-gold); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="ri-git-compare-line"></i>
                Expanded Differential Analysis: ${c1.country_name} vs ${c2.country_name}
            </div>

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem;">
                <div class="differential-item">
                    <span style="font-family: var(--font-body); font-size: 0.88rem; font-weight: 500;">RAO Score</span>
                    <span style="font-family: var(--font-mono); font-size: 1rem; font-weight: 600;" class="${diff > 0 ? 'score-color-good' : 'score-color-concerning'}">${diff > 0 ? '+' : ''}${diff.toFixed(2)}</span>
                </div>
                <div class="differential-item">
                    <span style="font-family: var(--font-body); font-size: 0.88rem;">Opportunity</span>
                    <span class="${oppDiff > 0 ? 'score-color-good' : 'score-color-concerning'}" style="font-family: var(--font-mono); font-size: 1rem;">${oppDiff > 0 ? '+' : ''}${oppDiff.toFixed(2)}</span>
                </div>
                <div class="differential-item">
                    <span style="font-family: var(--font-body); font-size: 0.88rem;">Stability</span>
                    <span class="${stabDiff > 0 ? 'score-color-good' : 'score-color-concerning'}" style="font-family: var(--font-mono); font-size: 1rem;">${stabDiff > 0 ? '+' : ''}${stabDiff.toFixed(2)}</span>
                </div>
                <div class="differential-item">
                    <span style="font-family: var(--font-body); font-size: 0.88rem;">Rank</span>
                    <span style="color: ${rankDiff > 0 ? 'var(--accent-green)' : 'var(--accent-red)'}; font-family: var(--font-mono); font-size: 1rem;">${rankDiff > 0 ? '+' : ''}${rankDiff}</span>
                </div>
            </div>

            <h4 style="font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); margin-bottom: 1rem;">
                All 12 Pillar Differentials (Ranked by Magnitude)
            </h4>
            <div style="display: grid; gap: 0.5rem;">
                ${pillarDiffs.map((pd, idx) => `
                    <div style="padding: 0.65rem 1rem; background: ${idx === 0 ? 'rgba(194,165,109,0.04)' : 'transparent'}; border-top: ${idx === 0 ? '2px solid rgba(194,165,109,0.4)' : '1px solid var(--border-subtle)'}; display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 1rem; align-items: center;">
                        <div>
                            ${idx === 0 ? '<i class="ri-star-fill" style="color: var(--accent-gold); margin-right: 0.5rem;"></i>' : ''}
                            <strong>${pd.name}</strong>
                        </div>
                        <div style="text-align: center; font-family: var(--font-mono); font-size: 0.85rem;">
                            ${c1.country_name}: <strong>${pd.s1.toFixed(2)}</strong>
                        </div>
                        <div style="text-align: center; font-family: var(--font-mono); font-size: 0.85rem;">
                            ${c2.country_name}: <strong>${pd.s2.toFixed(2)}</strong>
                        </div>
                        <div style="text-align: center;">
                            <span style="padding: 4px 8px; background: ${pd.diff > 0 ? 'rgba(74, 157, 111, 0.2)' : 'rgba(168, 79, 79, 0.2)'}; color: ${pd.diff > 0 ? 'var(--accent-green)' : 'var(--accent-red)'}; border-radius: 4px; font-family: var(--font-mono); font-size: 0.85rem; font-weight: 600;">
                                ${pd.diff > 0 ? '+' : ''}${pd.diff.toFixed(2)}
                            </span>

                    </div>
                `).join('')}

            <div style="margin-top: 1.25rem; padding: 0.85rem 1.2rem; background: rgba(194, 165, 109, 0.05); border-top: 2px solid rgba(194,165,109,0.35); border-radius: 3px;">
                <div style="font-family: var(--font-minor); font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 0.5rem;">

                    }

                    where <strong>${pillarDiffs[0].leader}</strong> has a clear advantage.
                </div>
            </div>
        </div>
    `;

    document.getElementById('differential-panel').innerHTML = html;
    document.getElementById('differential-panel').style.display = 'block';
}

// Item 26: Gap Analysis View
function renderGapAnalysis(c1, c2) {
    const allPillars = [
        ...OPPORTUNITY_PILLARS.map(p => ({...p, type: 'opp'})),
        ...STABILITY_PILLARS.map(p => ({...p, type: 'stab'}))
    ];

    const gaps = allPillars.map(p => {
        const s1 = p.type === 'stab' ? 10 - calculatePillarScore(c1, p.vars) : calculatePillarScore(c1, p.vars);
        const s2 = p.type === 'stab' ? 10 - calculatePillarScore(c2, p.vars) : calculatePillarScore(c2, p.vars);
        const gap = s1 - s2;
        return { name: p.name, gap, s1, s2 };
    }).filter(g => g.gap < 0); // Only show where c2 needs improvement

    gaps.sort((a, b) => a.gap - b.gap); // Largest gaps first (most negative)

    const html = `
        <div class="gap-analysis">
            <div style="font-family: var(--font-minor); font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--accent-gold); padding: 0.85rem 1.2rem 0.4rem; border-bottom: 1px solid var(--border-subtle);">Gap Analysis · ${c2.country_name} vs ${c1.country_name}</div>
            ${gaps.length === 0 ? `
                <div style="padding: 2rem; text-align: center; color: var(--text-muted);">
                    <i class="ri-trophy-line" style="font-size: 3rem; color: var(--accent-gold);"></i>
                    <p style="margin-top: 1rem;"><strong>${c2.country_name}</strong> is leading or tied in all pillars!</p>
                </div>
            ` : `
                <div style="display: grid; gap: 0.75rem;">
                    ${gaps.map((g, idx) => {
                        const magnitude = Math.abs(g.gap);
                        const difficulty = magnitude < 1 ? 'easy-win' : magnitude < 2 ? 'moderate' : 'difficult';
                        const difficultyLabel = magnitude < 1 ? 'Easy Win' : magnitude < 2 ? 'Moderate' : 'Challenging';
                        return `
                            <div class="gap-item ${difficulty}">
                                <div>
                                    <div class="gap-pillar">${idx + 1}. ${g.name}</div>
                                    <div class="gap-details">${c2.country_name}: ${g.s2.toFixed(2)} → ${g.s1.toFixed(2)} · ${difficultyLabel}</div>
                                </div>
                                <div class="gap-magnitude">-${magnitude.toFixed(2)}</div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `}
        </div>
    `;

    document.getElementById('gap-analysis').innerHTML = html;
}

// Item 27: All Variables Comparison
function renderAllVariablesComparison(c1, c2) {
    const allVars = [...new Set([
        ...OPPORTUNITY_PILLARS.flatMap(p => p.vars),
        ...STABILITY_PILLARS.flatMap(p => p.vars)
    ])];

    const varData = allVars.map(v => {
        const v1 = parseFloat(c1[v]) || 0;
        const v2 = parseFloat(c2[v]) || 0;
        const diff = v1 - v2;
        return {
            name: VARIABLE_NAMES[v] || v,
            v1, v2, diff,
            absDiff: Math.abs(diff),
            winner: Math.abs(diff) < 0.1 ? 'tie' : (v1 > v2 ? c1.country_name : c2.country_name)
        };
    });

    // Sort by difference magnitude
    varData.sort((a, b) => b.absDiff - a.absDiff);

    const html = `
        <div class="all-variables-section">
            <div class="variables-toggle" onclick="toggleVariablesView()">
                <div class="variables-toggle-title">
                    <i class="ri-database-2-line"></i>
                    All Variables Comparison (${allVars.length} variables)
                </div>
                <i class="ri-arrow-down-s-line variables-toggle-icon" id="variables-toggle-icon" style="font-size: 1.5rem;"></i>
            </div>
            <div class="variables-content" id="variables-content">
                <div style="background: var(--card-bg); border: 1px solid var(--border-subtle); box-shadow: var(--card-shadow); border-radius: var(--card-radius); padding: 0; margin-top: 0.75rem; overflow: hidden;">
                    <div style="padding: 0.65rem 1.2rem; border-bottom: 1px solid var(--border-subtle); font-family: var(--font-minor); font-size: 0.65rem; color: var(--text-muted);">
                        Sorted by difference magnitude. ${c1.country_name} leads in green, ${c2.country_name} leads in red.
                    </div>
                    <div class="variables-table">
                        <div class="variable-row header">
                            <div>Variable Name</div>
                            <div>${c1.country_name}</div>
                            <div>${c2.country_name}</div>
                            <div>Difference</div>
                        </div>
                        ${varData.map(vd => `
                            <div class="variable-row">
                                <div class="variable-name">${vd.name}</div>
                                <div class="variable-value ${vd.winner === c1.country_name ? 'winner' : ''}">${vd.v1.toFixed(2)}</div>
                                <div class="variable-value ${vd.winner === c2.country_name ? 'winner' : ''}">${vd.v2.toFixed(2)}</div>
                                <div class="variable-diff ${vd.diff > 0 ? 'positive' : vd.diff < 0 ? 'negative' : ''}">${vd.diff > 0 ? '+' : ''}${vd.diff.toFixed(2)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
        </div>
    `;

    document.getElementById('all-variables-section').innerHTML = html;
}

function applyQuickScreen(screenKey) {
    _screenerActiveFilter = screenKey === 'clear' ? null : screenKey;
    // Reset all chip active states
    document.querySelectorAll('.screener-chip').forEach(c => c.classList.remove('active'));
    if (screenKey !== 'clear') {
        event.target.closest('.screener-chip')?.classList.add('active');
    }
    // Reset regime chips to all-checked and TOS slider to 0
    document.querySelectorAll('.regime-chip-cb').forEach(cb => cb.checked = true);
    const tosSlider = document.getElementById('tos-min-slider');
    const tosVal = document.getElementById('tos-min-val');
    if (tosSlider) { tosSlider.value = 0; if (tosVal) tosVal.textContent = '0.00'; }

    filterRankings();
}

function _getV8FilteredSet() {
    const screen = _screenerActiveFilter;
    const regimes = Array.from(document.querySelectorAll('.regime-chip-cb:checked')).map(cb=>cb.value);
    const tosMin = parseFloat(document.getElementById('tos-min-slider')?.value || 0);

    return latestSlice.filter(r => {
        if (!regimes.includes(r.regime)) return false;
        if ((r.tos_score||0) < tosMin) return false;
        if (!screen) return true;
        if (screen === 'prebreakout') return ['FO','SR'].includes(r.regime) && (r.tos_score||0) >= 0.5;
        if (screen === 'high_conviction') return ['RO','FO'].includes(r.regime) && (r.tos_score||0) >= 0.6;
        if (screen === 'reform_story') return r.tos_signal_label === 'Reform Story';
        if (screen === 'commodity_trap') return (r.norm_natural_resource_rents_pct_gdp||0) > 0.6 && (r.pillar_absorptive_capacity||0) < 0.4;
        if (screen === 'sr_monitor') return r.regime === 'SR';
        return true;
    }).map(r => r.country);
}

// Enhancement #28-30: Enhanced filtering with score range, tier, and percentile
function handleRegionFilter(value) {
    window.selectedRegionFilter = value;

function filterRankings() {
    const searchTerm = document.getElementById('rankings-search').value.toLowerCase();
    const regionFilter = document.getElementById('rankings-region-filter').value;
    const minScore = parseFloat(document.getElementById('min-score-slider').value);
    const maxScore = parseFloat(document.getElementById('max-score-slider').value);
    const percentileFilter = document.getElementById('percentile-filter').value;

    // Get selected tiers and update active states
    const selectedTiers = Array.from(document.querySelectorAll('.tier-checkbox input:checked'))
        .map(cb => cb.value);

    // Update active class on tier checkboxes
    document.querySelectorAll('.tier-checkbox').forEach(label => {
        const checkbox = label.querySelector('input');
        if (checkbox.checked) {
            label.classList.add('active');
        } else {
            label.classList.remove('active');
        }
    });

    const v8Allowed = new Set(_getV8FilteredSet());

    filteredRankings = rawData.filter(c => {
        if (!v8Allowed.has(c.country)) return false;

        const matchesSearch = c.country_name.toLowerCase().includes(searchTerm) ||
                            c.country.toLowerCase().includes(searchTerm);
        const matchesRegion = !regionFilter || getRegion(c.country) === regionFilter;
        const matchesScoreRange = c.calculated_rao >= minScore && c.calculated_rao <= maxScore;
        const tier = getTier(c.calculated_rao);
        const matchesTier = selectedTiers.includes(tier);
        let matchesPercentile = true;
        if (percentileFilter) {
            const percentile = getPercentile(c.rank);
            switch(percentileFilter) {
                case 'top10': matchesPercentile = percentile >= 90; break;
                case 'top25': matchesPercentile = percentile >= 75; break;
                case 'top50': matchesPercentile = percentile >= 50; break;
                case 'bottom50': matchesPercentile = percentile < 50; break;
                case 'bottom25': matchesPercentile = percentile < 25; break;
                case 'bottom10': matchesPercentile = percentile < 10; break;
            }
        }
        const favoritesOnly = window.selectedRegionFilter === 'favorites';
        const matchesFavorites = !favoritesOnly || favoriteCountries.has(c.country);

        return matchesSearch && matchesRegion && matchesScoreRange && matchesTier && matchesPercentile && matchesFavorites;
    });

    updateRankingsTable();
    updateQuickStats();
    drawRankDistributionHistogram();

    // Enhancement #49: Show no results message if empty
    if (filteredRankings.length === 0) {
        const tbody = document.getElementById('rankings-tbody');
        if (tbody) {
            showNoResultsMessage(tbody, searchTerm ? 'search' : 'filter');
        }
    }

    // Update footer view count
}

// Enhancement #28: Enhanced sorting with new columns
function sortRankings(column) {
    if (sortColumn === column) {
        sortAscending = !sortAscending;
    } else {
        sortColumn = column;
        sortAscending = true;
    }

    filteredRankings.sort((a, b) => {
        let aVal, bVal;
        switch(column) {
            case 'rank':
                aVal = a.rank;
                bVal = b.rank;
                break;
            case 'country':
                aVal = a.country_name;
                bVal = b.country_name;
                break;
            case 'rao':
                aVal = a.calculated_rao;
                bVal = b.calculated_rao;
                break;
            case 'percentile':
                aVal = getPercentile(a.rank);
                bVal = getPercentile(b.rank);
                break;
            case 'opportunity':
                aVal = a.calculated_opportunity;
                bVal = b.calculated_opportunity;
                break;
            case 'stability':
                aVal = a.calculated_stability;
                bVal = b.calculated_stability;
                break;
            case 'regime':
                aVal = a.regime || ''; bVal = b.regime || ''; break;
            case 'tos':
                aVal = a.tos_score ?? -1; bVal = b.tos_score ?? -1; break;
            case 'yoy':
                aVal = computeYoY(a.country,'rao_score') ?? -99;
                bVal = computeYoY(b.country,'rao_score') ?? -99; break;
            default:
                aVal = a.rank;
                bVal = b.rank;
        }

        if (typeof aVal === 'string') {
            return sortAscending ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
        }
        return sortAscending ? aVal - bVal : bVal - aVal;
    });

    updateRankingsTable();
}

// Score Distribution Bar Chart (Chart.js, with country names on hover)
function drawRankDistributionHistogram() {
    const ctx = document.getElementById('score-dist-rankings-chart');
    if (!ctx) return;
    if (ctx._distChart) { ctx._distChart.destroy(); ctx._distChart = null; }

    const numBins = 18;
    const binSize = 10 / numBins;
    // bins[i] = { count, countries: [] }
    const bins = Array.from({length: numBins}, (_, i) => ({
        lo: i * binSize,
        hi: (i + 1) * binSize,
        label: (i * binSize).toFixed(1),
        countries: []
    }));

    filteredRankings.forEach(c => {
        const idx = Math.min(Math.floor(c.calculated_rao / binSize), numBins - 1);
        bins[idx].countries.push(c.country_name);
    });

    const counts = bins.map(b => b.countries.length);
    const labels = bins.map(b => b.label);

    const sortedScores = filteredRankings.map(c => c.calculated_rao).sort((a,b) => a-b);
    const median = sortedScores[Math.floor(sortedScores.length/2)] || 5;
    const medianBin = Math.min(Math.floor(median / binSize), numBins - 1);

    const barColors = counts.map((_, i) =>
        i === medianBin ? 'rgba(194,165,109,0.85)' : 'rgba(194,165,109,0.38)'
    );

    const chart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels,
            datasets: [{
                data: counts,
                backgroundColor: barColors,
                borderColor: barColors.map(c => c.replace('0.38','0.7').replace('0.85','1')),
                borderWidth: 1,
                borderRadius: 2,
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            animation: { duration: 400 },
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: items => `RAO ${items[0].label}–${(parseFloat(items[0].label)+binSize).toFixed(1)}`,
                        label: item => `${item.parsed.y} countries`,
                        afterBody: items => {
                            const names = bins[items[0].dataIndex].countries;
                            if (!names.length) return [];
                            return names.length <= 10
                                ? names
                                : [...names.slice(0, 9), `+${names.length - 9} more`];
                        }
                    },
                    backgroundColor: 'rgba(22,30,48,0.97)',
                    borderColor: 'rgba(194,165,109,0.3)',
                    borderWidth: 1,
                    titleColor: 'rgba(238,234,224,0.9)',
                    bodyColor: 'rgba(238,234,224,0.6)',
                    padding: 10,
                    displayColors: false
                }
            },
            scales: {
                x: {
                    grid: { color: 'rgba(255,255,255,0.04)' },
                    ticks: { color: 'rgba(238,234,224,0.4)', font:{size:9}, maxRotation:0 }
                },
                y: {
                    grid: { color: 'rgba(255,255,255,0.04)' },
                    ticks: { color: 'rgba(238,234,224,0.4)', font:{size:9}, precision:0 }
                }
            },
            onClick: (evt, elements) => {
                if (!elements.length) return;
                const b = bins[elements[0].index];
                filterByScoreRange(b.lo, b.hi);
            }
        }
    });
    ctx._distChart = chart;
    registerChart(chart);
}
