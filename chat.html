<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAO Intelligence Assistant | GSU</title>
    <link rel="icon" type="image/x-icon" href="assets/gsu.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* Copernicus (serif) — supply woff2/woff files to activate; falls back to EB Garamond */
        @font-face { font-family: 'Copernicus'; src: local('Copernicus'), url('fonts/Copernicus-Book.woff2') format('woff2'), url('fonts/Copernicus-Book.woff') format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Copernicus'; src: local('Copernicus Semibold'), url('fonts/Copernicus-Semibold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Copernicus'; src: local('Copernicus Italic'), url('fonts/Copernicus-BookItalic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
        /* StyreneB (sans) — supply woff2/woff files to activate; falls back to system sans */
        @font-face { font-family: 'StyreneB'; src: local('StyreneB'), url('fonts/StyreneB-Regular.woff2') format('woff2'), url('fonts/StyreneB-Regular.woff') format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'StyreneB'; src: local('StyreneB Medium'), url('fonts/StyreneB-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
    <style>
        :root {
            --primary-bg: #192030;
            --secondary-bg: #1f283b;
            --tertiary-bg: #232d44;
            --bg-raised: #232d44;
            --text-white: #eeeae0;
            --text-muted: rgba(238,234,224,.70);
            --w45: rgba(238,234,224,.45);
            --w20: rgba(238,234,224,.20);
            --w08: rgba(238,234,224,.08);
            --w04: rgba(238,234,224,.04);
            --accent-gold: #C2A56D;
            --gold-faint: rgba(194,165,109,.07);
            --gold-mid: rgba(194,165,109,.15);
            --accent-gold-dim: rgba(194,165,109,0.3);
            --accent-green: #5d8a72;
            --accent-lime: #7a8e62;
            --accent-amber: #c4a060;
            --accent-orange: #a87a5e;
            --accent-red: #966060;
            --accent-blue: #607c98;
            --font-head: 'Copernicus', 'EB Garamond', Georgia, serif;
            --font-body: 'StyreneB', 'EB Garamond', Georgia, serif;
            --font-minor: 'Montserrat', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --easing: cubic-bezier(.25,1,.35,1);
            --border-subtle: rgba(255,255,255,.07);
            --border-hover: rgba(194,165,109,0.3);
            --glass-bg: rgba(31, 40, 59, 0.65);
            --glass-border: rgba(255, 255, 255, 0.07);
            --card-radius: 3px;
            --card-bg: linear-gradient(160deg, rgba(30,40,60,.97) 0%, rgba(22,32,50,.93) 100%);
            --card-bg-hover: linear-gradient(160deg, rgba(34,44,66,.98) 0%, rgba(26,36,58,.95) 100%);
            --card-shadow: 0 2px 14px rgba(0,0,0,.22), 0 1px 0 rgba(255,255,255,.04) inset;
            --card-shadow-hover: 0 6px 24px rgba(0,0,0,.3), 0 0 16px rgba(194,165,109,.04), 0 1px 0 rgba(255,255,255,.05) inset;
            --regime-ro: #5d8a72;
            --regime-fo: #C2A56D;
            --regime-sl: #607c98;
            --regime-sr: #966060;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        /* ─── PROGRESS BAR ───────────────────────────── */
        #progress-bar {
            position: fixed; top: 0; left: 0;
            height: 2px; width: 0%;
            background: linear-gradient(90deg, transparent 0%, var(--accent-gold) 50%, rgba(194,165,109,.3) 100%);
            z-index: 9999; transition: width .08s linear;
        }

        body {
            background-color: var(--primary-bg);
            color: var(--text-white);
            font-family: var(--font-body);
            font-size: 1rem;
            line-height: 1.65;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, h5 { font-family: var(--font-head); font-weight: 400; line-height: 1.25; }
        p { opacity: .82; line-height: 1.65; }
        strong { font-weight: 600; color: var(--text-white); opacity: 1; }
        em { font-style: italic; color: var(--accent-gold); opacity: 1; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--primary-bg); }
        ::-webkit-scrollbar-thumb { background: var(--accent-gold-dim); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-gold); }

        .glass-panel {
            background: linear-gradient(160deg, rgba(25,33,50,.98) 0%, rgba(20,28,44,.97) 100%);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 2px 20px rgba(0,0,0,.3), 0 1px 0 rgba(255,255,255,.04) inset;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(20,27,42,.99) 0%, rgba(22,30,46,.97) 100%);
            border-bottom: 1px solid rgba(255,255,255,.06);
            box-shadow: 0 1px 30px rgba(0,0,0,.4);
            padding: 14px 40px;
            position: fixed;
            top: 2px;
            left: 0;
            right: 0;
            z-index: 1000;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 40px;
        }
        .header-left { display: flex; align-items: center; gap: 1.5rem; }
        .logo {
            font-family: var(--font-head);
            font-size: 1.35rem;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .logo span {
            font-family: var(--font-head);
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .28em;
            color: var(--w45);
            text-transform: uppercase;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }
        .header-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
        }
        .header-center { display: flex; align-items: center; gap: 1rem; }
        .search-box {
            display: flex;
            align-items: center;
            background: var(--w04);
            border: 1px solid var(--border-subtle);
            border-radius: 0;
            padding: 10px 20px;
            width: 100%;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-white);
            font-family: var(--font-body);
            font-size: 0.95rem;
            width: 100%;
            outline: none;
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-results {
            position: fixed;
            background: var(--secondary-bg);
            border: 1px solid var(--border-subtle);
            border-top: none;
            border-radius: 0 0 4px 4px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 9999;
        }
        .search-results.active { display: block; }
        .search-result-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
        }
        .search-result-item:hover,
        .search-result-item.kb-active { background: var(--tertiary-bg); }
        .search-result-item.kb-active { outline: 1px solid rgba(194,165,109,0.35); outline-offset: -1px; }
        .search-result-item:last-child { border-bottom: none; }
        .header-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            justify-content: flex-end;
        }

        .nav-menu {
            display: flex;
            gap: 5px;
            background: rgba(255,255,255,0.03);
            padding: 5px;
            border-radius: 50px;
            justify-content: center;
            max-width: 750px;
        }

        .nav-item {
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.72rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.4s var(--easing);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            font-family: var(--font-minor);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            white-space: nowrap;
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .nav-item::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
            transition: left 0.5s var(--easing);
        }

        .nav-item:hover::before { left: 100%; }

        .nav-item:hover {
            color: var(--text-white);
            background: rgba(255,255,255,0.07);
            transform: translateY(-1px);
        }

        .nav-item.active {
            background: var(--accent-gold);
            color: var(--primary-bg);
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(194,165,109,0.28);
            transform: translateY(0);
        }

        .nav-item.active::before { display: none; }

        .nav-item:not(.active):active { transform: scale(0.98); }

        .nav-item i {
            font-size: 0.95rem;
            transition: transform 0.3s var(--easing);
        }

        .nav-item:hover i { transform: scale(1.1); }
        .nav-item.active i { transform: scale(1); }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border-subtle);
            background: var(--w04);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--w45);
            cursor: pointer;
            transition: all 0.3s var(--easing);
            font-size: 1.1rem;
            position: relative;
        }

        .icon-btn:hover {
            background: linear-gradient(140deg, rgba(194,165,109,.16) 0%, rgba(194,165,109,.06) 100%);
            color: var(--accent-gold);
            border-color: rgba(194,165,109,.38);
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(194,165,109,.08);
        }


        .btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            font-family: var(--font-minor);
            font-size: .68rem;
            font-weight: 500;
            letter-spacing: .1em;
            text-transform: uppercase;
            padding: .65rem 1.4rem;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: transform .4s var(--easing), box-shadow .4s var(--easing),
                        background .35s, border-color .35s;
            background: var(--w04);
            border: 1px solid var(--w20);
            color: var(--w45);
        }
        .btn:hover {
            transform: translateY(-2px);
            background: var(--w08);
            border-color: rgba(255,255,255,.3);
            box-shadow: 0 4px 16px rgba(0,0,0,.22);
            color: var(--text-white);
        }
        .btn-primary {
            background: linear-gradient(140deg, rgba(194,165,109,.2) 0%, rgba(194,165,109,.1) 100%);
            border: 1px solid rgba(194,165,109,.45);
            color: var(--accent-gold);
            box-shadow: 0 2px 14px rgba(194,165,109,.07), inset 0 1px 0 rgba(255,255,255,.04);
            font-weight: 600;
        }
        .btn-primary:hover {
            background: linear-gradient(140deg, rgba(194,165,109,.3) 0%, rgba(194,165,109,.15) 100%);
            border-color: rgba(194,165,109,.7);
            box-shadow: 0 6px 22px rgba(194,165,109,.15), inset 0 1px 0 rgba(255,255,255,.06);
            transform: translateY(-3px);
            color: var(--accent-gold);
        }

        /* Main Container */
        .main-container {
            padding-top: 90px;
            min-height: 100vh;
        }

        .tab-content {
            display: none;
            opacity: 0;
            animation: fadeOut 0.2s ease-out;
        }
        .tab-content.active {
            display: block;
            opacity: 1;
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
            }
        }

        /* Common Components */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .kpi-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            padding: 16px 18px;
            border-radius: var(--card-radius);
            text-align: center;
            transition: all 0.45s var(--easing);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .kpi-card::before {
            content: '';
            position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(194,165,109,.25), transparent);
            opacity: 0; transition: opacity .4s;
        }
        .kpi-card:hover::before { opacity: 1; }
        .kpi-card:hover {
            border-color: rgba(194,165,109,.25);
            transform: translateY(-5px);
            box-shadow: var(--card-shadow-hover);
            background: var(--card-bg-hover);
        }
        .kpi-value {
            font-family: var(--font-mono);
            font-size: 1.75rem;
            color: var(--accent-gold);
            margin-bottom: 0.3rem;
            line-height: 1;
        }
        .kpi-label {
            font-family: var(--font-minor);
            font-size: .62rem;
            color: var(--w45);
            text-transform: uppercase;
            letter-spacing: .14em;
            font-weight: 500;
        }
        .kpi-sublabel {
            font-size: 0.72rem;
            color: var(--w45);
            margin-top: 0.2rem;
            opacity: .75;
        }
        .kpi-sub {
            font-size: 0.68rem;
            color: var(--w45);
            margin-top: 0.25rem;
            font-family: var(--font-minor);
            opacity: .8;
        }
        .kpi-strip {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0;
            border-top: 1px solid var(--border-subtle);
            border-bottom: 1px solid var(--border-subtle);
        }
        .kpi-strip .kpi-card {
            border-radius: 0;
            border: none;
            border-right: 1px solid var(--border-subtle);
            text-align: center;
            padding: 1rem 0.75rem;
        }
        .kpi-strip .kpi-card:last-child { border-right: none; }

        /* Regime × TOS Matrix */
        .rtm-grid {
            display: grid;
            grid-template-columns: 80px repeat(4, 1fr);
            gap: 6px;
        }
        .rtm-col-header, .rtm-row-header {
            display: flex; flex-direction: column; justify-content: center;
            padding: 0.4rem 0.5rem;
        }
        .rtm-col-header { text-align: center; }
        .rtm-row-header { align-items: flex-end; text-align: right; }
        .rtm-cell {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 3px;
            padding: 0.6rem 0.7rem;
            min-height: 80px;
        }
        .rtm-priority {
            font-family: var(--font-minor);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }
        .rtm-count {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            font-weight: 600;
            line-height: 1;
            margin-bottom: 0.4rem;
        }
        .rtm-countries { display: flex; flex-wrap: wrap; gap: 3px; }
        .rtm-country-chip {
            font-size: 0.62rem;
            font-family: var(--font-minor);
            color: var(--w65);
            cursor: pointer;
            padding: 1px 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.04);
            transition: color 0.2s;
        }
        .rtm-country-chip:hover { color: var(--accent-gold); }
        .screener-chip {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            color: var(--w65);
            padding: 4px 10px;
            font-family: var(--font-minor);
            font-size: 0.62rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .screener-chip:hover {
            border-color: rgba(194,165,109,0.5);
            color: var(--accent-gold);
            background: rgba(194,165,109,0.08);
        }
        .screener-chip.active {
            border-color: rgba(194,165,109,0.6);
            color: var(--accent-gold);
            background: rgba(194,165,109,0.12);
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(194,165,109,0.18);
        }

        @keyframes tosGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(194,165,109,0); border-color: rgba(194,165,109,0.35); }
            50%       { box-shadow: 0 0 14px 2px rgba(194,165,109,0.2); border-color: rgba(194,165,109,0.7); }
        }
        .rtm-pulse { animation: tosGlow 2.6s ease-in-out infinite; }

        .section-container {
            padding: 1.75rem 2rem;
            position: relative;
        }

        /* ─── AMBIENT GLOW SYSTEM ─────────────────── */
        .tab-content.active {
            position: relative;
        }

        /* Off-center glows mimicking test.html */
        .glow-section {
            position: relative;
            overflow: hidden;
        }
        .glow-section::before {
            content: '';
            position: absolute; inset: 0;
            pointer-events: none; z-index: 0;
        }
        .glow-tl::before {
            background: radial-gradient(ellipse 70% 60% at -5% 20%,
                rgba(28,37,64,.7) 0%, transparent 70%);
        }
        .glow-br::before {
            background: radial-gradient(ellipse 65% 55% at 108% 85%,
                rgba(28,37,64,.65) 0%, transparent 65%);
        }
        .glow-tr::before {
            background: radial-gradient(ellipse 60% 55% at 110% 15%,
                rgba(28,37,64,.6) 0%, transparent 65%);
        }
        .glow-cl::before {
            background: radial-gradient(ellipse 55% 70% at 15% 55%,
                rgba(28,40,68,.6) 0%, transparent 65%);
        }
        .glow-section > * { position: relative; z-index: 1; }

        /* ─── h4 eyebrow labels ──────────────────── */
        h4.eyebrow, .eyebrow {
            font-size: .62rem; letter-spacing: .26em;
            text-transform: uppercase; color: var(--accent-gold);
            font-weight: 600; margin-bottom: .6rem;
            font-family: var(--font-minor);
        }

        .section-title {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            display: block;
        }

        /* ─── GOLD THIN DIVIDER ──────────────────── */
        .section-divider {
            height: 1px; margin: 0 2rem;
            background: linear-gradient(90deg,
                transparent 0%, rgba(194,165,109,.14) 30%,
                rgba(194,165,109,.14) 70%, transparent 100%);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* ─── BENTO GRID ─────────────────────────────── */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 1.5rem 2rem 0;
        }
        .bento-cell {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            border-radius: var(--card-radius);
            overflow: hidden;
            min-height: 0;
            position: relative;
        }
        .bento-cell-inner {
            padding: 0;
        }
        .bento-span-2 { grid-column: span 2; }
        .bento-span-3 { grid-column: span 3; }
        .bento-row-2 { grid-row: span 2; }
        .bento-label {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent-gold);
            padding: 0.85rem 1.2rem 0.4rem;
            display: block;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
        }

        /* Map Section */
        .map-section {
            position: relative;
            background: linear-gradient(180deg, rgba(22,30,46,.6) 0%, rgba(18,26,42,.4) 100%);
            border-bottom: 1px solid var(--border-subtle);
            border-top: 1px solid rgba(255,255,255,.03);
            margin-bottom: 0;
            padding-top: 0;
        }
        .map-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 2rem 0.6rem;
            background: rgba(20,27,42,0.5);
            border-bottom: 1px solid var(--border-subtle);
        }
        .map-control-btn {
            background: linear-gradient(140deg, rgba(25,33,50,.97) 0%, rgba(20,28,44,.95) 100%);
            border: 1px solid var(--border-subtle);
            color: var(--w45);
            padding: 7px 16px;
            font-family: var(--font-minor);
            font-size: .63rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s var(--easing);
            border-radius: 3px;
            text-transform: uppercase;
            letter-spacing: .1em;
            box-shadow: 0 1px 8px rgba(0,0,0,.2);
        }
        .map-control-btn:hover {
            color: var(--text-white);
            border-color: rgba(255,255,255,.15);
            transform: translateY(-1px);
        }
        .map-control-btn.active {
            background: linear-gradient(140deg, rgba(194,165,109,.18) 0%, rgba(194,165,109,.08) 100%);
            color: var(--accent-gold);
            border-color: rgba(194,165,109,.45);
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(194,165,109,.1);
        }
        .map-legend {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            background: linear-gradient(140deg, rgba(25,33,50,.98) 0%, rgba(20,28,44,.97) 100%);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            padding: 1rem;
            border-radius: 0;
            z-index: 10;
        }
        .legend-title {
            font-family: var(--font-minor);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }
        .legend-gradient {
            width: 150px;
            height: 12px;
            background: linear-gradient(to right, #966060, #a87a5e, #c9a961, #7a8e62, #5d8a72);
            border-radius: 2px;
        }
        .legend-labels {
            display: flex;
            justify-content: space-between;
            font-family: var(--font-minor);
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        #map-container {
            width: 100%;
            height: 50vh;
            min-height: 360px;
        }
        #regions_div { width: 100%; height: 100%; }

        /* Google Charts Tooltip Override */
        div.google-visualization-tooltip {
            background-color: var(--secondary-bg) !important;
            border: 1px solid var(--accent-gold) !important;
            border-radius: 4px !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
            padding: 0 !important;
        }
        .tooltip-custom {
            font-family: var(--font-body);
            color: white;
            min-width: 240px;
            max-width: 280px;
            background: linear-gradient(160deg, rgba(22,30,50,0.99) 0%, rgba(18,26,44,0.99) 100%);
            border: 1px solid rgba(194,165,109,0.25);
            border-radius: 4px;
            overflow: hidden;
        }
        .tt-head {
            padding: 0.75rem 1rem 0.6rem;
            border-bottom: 1px solid rgba(255,255,255,0.07);
            background: rgba(194,165,109,0.05);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
        }
        .tt-head-left { flex: 1; min-width: 0; }
        .tt-head-right { text-align: right; flex-shrink: 0; }
        .tt-country {
            font-family: var(--font-head);
            font-size: 1.25rem;
            color: var(--text-white);
            line-height: 1.2;
        }
        .tt-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 0.5rem;
        }
        .tt-body {
            padding: 0.6rem 1rem 0.75rem;
        }
        .tt-score-row { display: none; }
        .tt-rao {
            font-family: var(--font-mono);
            font-size: 1.8rem;
            font-weight: 500;
            line-height: 1;
            color: var(--accent-gold);
        }
        .tt-rao-label {
            font-family: var(--font-minor);
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-top: 0.15rem;
        }
        .tt-pillars {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px 10px;
            margin: 0.5rem 0 0.6rem;
        }
        .tt-pillar-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .tt-pillar-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tt-pillar-name {
            font-family: var(--font-minor);
            font-size: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            min-width: 50px;
        }
        .tt-pillar-bar-wrap {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 2px;
            overflow: hidden;
        }
        .tt-pillar-bar-fill {
            height: 100%;
            border-radius: 2px;
        }
        .tt-pillar-val {
            font-family: var(--font-mono);
            font-size: 0.58rem;
            color: rgba(238,234,224,0.55);
            min-width: 26px;
            text-align: right;
        }
        .tt-hint {
            font-family: var(--font-minor);
            font-size: 0.58rem;
            color: rgba(194,165,109,0.65);
            letter-spacing: 0.05em;
            text-align: center;
            padding-top: 0.35rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .tt-rank-badge {
            font-family: var(--font-mono);
            font-size: 0.62rem;
            color: var(--text-muted);
        }
        .tooltip-title {
            font-family: var(--font-head);
            font-size: 1.2rem;
            color: var(--accent-gold);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .tooltip-score {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            color: var(--text-white);
        }
        .tooltip-rank {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .tooltip-hint {
            font-size: 0.8rem;
            color: var(--accent-gold);
            margin-top: 0.5rem;
            font-style: italic;
        }
        #regions_div svg g g path {
            transition: stroke 0.1s ease;
            stroke: #1f283b;
            stroke-width: 0.5px;
        }
        #regions_div svg g g path:hover {
            stroke: #ffffff !important;
            stroke-width: 1.5px !important;
        }

        /* Top/Bottom Lists */
        .rank-list {
            background: transparent;
            border: none;
            box-shadow: none;
            border-radius: 0;
            overflow: hidden;
        }
        .rank-list-header {
            padding: .7rem 1.2rem;
            background: linear-gradient(140deg, rgba(32,42,62,.97) 0%, rgba(24,34,54,.95) 100%);
            font-family: var(--font-minor);
            font-size: .6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: .18em;
            color: var(--accent-gold);
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 600;
        }
        .rank-item {
            padding: 0.55rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .rank-item:last-child { border-bottom: none; }
        .rank-item:hover {
            background: var(--tertiary-bg);
        }
        .rank-number {
            width: 30px;
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--accent-gold);
        }
        .rank-country {
            flex: 1;
            font-size: 0.95rem;
        }
        .rank-score {
            font-family: var(--font-mono);
            font-size: 1rem;
        }

        /* Country Analysis Layout */
        .country-selector-bar {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            padding: 16px 20px;
            border-radius: var(--card-radius);
            margin-bottom: 14px;
        }
        .country-selector-bar label {
            display: block;
            margin-bottom: 0.75rem;
            font-family: var(--font-minor);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            letter-spacing: 0.1em;
        }
        .country-selector-bar select {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-white);
            padding: 0.75rem 1rem;
            font-family: var(--font-body);
            font-size: 1rem;
            width: 100%;
            border-radius: 2px;
            cursor: pointer;
        }

        /* Dropdown option panel colours (Chrome/Edge honour these) */
        #landscape-year-select,
        #analysis-year-select {
            color: var(--text-white);
        }
        #landscape-year-select option,
        #analysis-year-select option,
        .country-selector-bar select option,
        .rankings-filter select option,
        .percentile-filter select option {
            background: #1f283b;
            color: #e8e8e8;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .analysis-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            border-radius: var(--card-radius);
            padding: 0;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
        }
        .analysis-card::before {
            content: '';
            position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(194,165,109,.25), transparent);
            opacity: 0; transition: opacity .4s;
        }
        .analysis-card:hover::before { opacity: 1; }
        .analysis-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow-hover);
            border-color: rgba(194,165,109,.18);
            background: var(--card-bg-hover);
        }

        /* Enhancement 16: Card animations */
        .analysis-card, .analysis-card-enhanced {
            animation: fadeInUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .context-item-enhanced:hover {
            transform: translateY(-3px);
            border-color: var(--accent-gold);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .pillar-row-enhanced:hover .pillar-row {
            background: rgba(194, 165, 109, 0.1);
        }

        /* Match filter button hover */
        .match-filter-btn:hover:not(.active) {
            background: rgba(194, 165, 109, 0.2);
            border-color: var(--accent-gold);
        }

        /* Sort button hover */
        .sort-btn:hover:not(.active) {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent-gold);
            padding: 0.85rem 1.2rem 0.4rem;
            border-bottom: 1px solid var(--border-subtle);
            display: block;
            margin: 0;
        }

        /* Country Profile */
        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .profile-name {
            font-family: var(--font-head);
            font-size: 1.75rem;
            color: var(--text-white);
        }
        .profile-meta {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .profile-score-box {
            text-align: center;
            background: var(--tertiary-bg);
            padding: 1.25rem;
            border-radius: 4px;
        }
        .profile-score {
            font-family: var(--font-mono);
            font-size: 2.5rem;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        .profile-rank {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--accent-gold);
        }

        /* Pillar Breakdown */
        .pillar-section {
            margin-bottom: 2rem;
        }
        .pillar-section-header {
            font-family: var(--font-minor);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .pillar-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .pillar-dot.opp { background: var(--accent-gold); }
        .pillar-dot.stab { background: var(--accent-blue); }

        .pillar-row {
            display: flex;
            align-items: center;
            margin-bottom: 0.75rem;
            gap: 1rem;
        }
        .pillar-name {
            width: 140px;
            font-size: 0.85rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }
        .pillar-bar-container {
            flex: 1;
            height: 10px;
            background: var(--tertiary-bg);
            border-radius: 5px;
            overflow: hidden;
        }
        .pillar-bar {
            height: 100%;
            border-radius: 5px;
            transition: width 0.5s var(--easing);
        }
        .pillar-bar.opp { background: linear-gradient(90deg, var(--accent-gold-dim), var(--accent-gold)); }
        .pillar-bar.stab { background: linear-gradient(90deg, rgba(93, 140, 168, 0.3), var(--accent-blue)); }
        .pillar-value {
            width: 45px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-align: right;
            flex-shrink: 0;
        }

        /* Strengths/Weaknesses */
        .insights-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        .insight-box {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-subtle);
            padding: 1.25rem;
            border-radius: 4px;
        }
        .insight-header {
            font-family: var(--font-minor);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .insight-header.strength { color: var(--accent-green); }
        .insight-header.weakness { color: var(--accent-red); }
        .insight-item {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.6rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .insight-item-value {
            font-family: var(--font-minor);
            font-size: 0.85rem;
            color: var(--text-white);
        }

        /* Neighbor/Similar Lists */
        .context-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        .context-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.6rem 1rem;
            background: transparent;
            border-radius: 0;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
        }
        .context-item:last-child { border-bottom: none; }
        .context-item:hover { background: rgba(255,255,255,0.025); }
        .context-item-name {
            font-family: var(--font-body);
            font-size: 0.88rem;
            color: var(--text-white);
        }
        .context-item-score {
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }
        .context-item-rank {
            font-family: var(--font-minor);
            font-size: 0.68rem;
            color: var(--w45);
            margin-left: 0.5rem;
            font-weight: 500;
        }

        /* Regional Context */
        .regional-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .regional-stat {
            text-align: center;
            padding: 1rem;
            background: var(--tertiary-bg);
            border-radius: 4px;
        }
        .regional-stat-value {
            font-family: var(--font-mono);
            font-size: 1.4rem;
            color: var(--accent-gold);
            margin-bottom: 0.25rem;
        }
        .regional-stat-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .regional-leaders {
            background: var(--tertiary-bg);
            padding: 1rem;
            border-radius: 4px;
        }
        .regional-leaders-title {
            font-family: var(--font-minor);
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }
        .regional-leader-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.85rem;
            border-bottom: 1px solid var(--border-subtle);
            cursor: pointer;
        }
        .regional-leader-item:last-child { border-bottom: none; }
        .regional-leader-item:hover { color: var(--accent-gold); }

        /* Compare Split Screen */
        .compare-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }
        .compare-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            border-radius: var(--card-radius);
            padding: 8px 14px;
            transition: all 0.45s var(--easing);
            position: relative;
            overflow: hidden;
        }
        .compare-card::before {
            content: '';
            position: absolute; top: 0; left: 10%; right: 10%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(194,165,109,.25), transparent);
            opacity: 0; transition: opacity .4s;
        }
        .compare-card:hover::before { opacity: 1; }
        .compare-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-shadow-hover);
            border-color: rgba(194,165,109,.2);
            background: var(--card-bg-hover);
        }
        .compare-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
            padding-bottom: 0.35rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .compare-country-name {
            font-family: var(--font-head);
            font-size: 1.0rem;
            color: var(--text-white);
        }
        .compare-score {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            color: var(--accent-gold);
        }
        .compare-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.2rem 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .compare-row:last-child { border-bottom: none; }
        .compare-label {
            font-size: 0.74rem;
            color: var(--text-muted);
        }
        .compare-value {
            font-family: var(--font-minor);
            font-size: 0.78rem;
        }

        /* Enhanced Compare Styles */
        .compare-card {
            position: relative;
        }
        .compare-card.winner {
            border: 2px solid rgba(194,165,109,.5);
            background: linear-gradient(140deg, rgba(194,165,109,.12) 0%, rgba(30,40,60,.97) 100%);
            box-shadow: 0 4px 20px rgba(194,165,109,.1), var(--card-shadow);
        }
        .winner-badge {
            display: inline-block;
            background: var(--accent-gold);
            color: var(--primary-bg);
            padding: 2px 7px;
            border-radius: 10px;
            font-size: 0.52rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            vertical-align: middle;
            margin-left: 0.4rem;
        }
        .compare-row.winner-row {
            background: rgba(194, 165, 109, 0.05);
            margin: 0 -0.5rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }
        .compare-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .compare-value {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .winner-icon {
            color: var(--accent-gold);
            font-size: 1.1rem;
        }

        /* Summary Card */
        .comparison-summary {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 0.9rem 1.1rem;
            margin-bottom: 8px;
            box-shadow: var(--card-shadow);
            animation: fadeInUp 0.6s var(--easing);
        }
        .summary-title {
            font-family: var(--font-head);
            font-size: 1rem;
            color: var(--accent-gold);
            margin-bottom: 0.65rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 0.65rem;
        }
        .summary-stat {
            text-align: center;
            padding: 0.5rem 0.75rem;
            background: var(--card-bg);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-subtle);
        }
        .summary-stat-value {
            font-family: var(--font-mono);
            font-size: 1.3rem;
            color: var(--accent-gold);
            font-weight: 500;
        }
        .summary-stat-label {
            font-family: var(--font-minor);
            font-size: 0.58rem;
            color: var(--w45);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-weight: 500;
            margin-top: 0.2rem;
        }
        .summary-insight {
            padding: 0.55rem 0.75rem;
            background: rgba(194,165,109,0.04);
            border: 1px solid var(--border-subtle);
            border-top: 2px solid rgba(194,165,109,0.35);
            border-radius: var(--card-radius);
            font-family: var(--font-body);
            font-size: 0.82rem;
            line-height: 1.5;
        }
        .summary-insight strong {
            color: var(--accent-gold);
        }

        /* Pillar Winners Scorecard */
        .pillar-scorecard {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 0;
            margin-top: 1.5rem;
            box-shadow: var(--card-shadow);
            animation: fadeInUp 0.6s var(--easing) 0.2s backwards;
            overflow: hidden;
        }
        .scorecard-header {
            display: flex;
            justify-content: stretch;
            margin-bottom: 0;
            gap: 0;
        }
        .scorecard-country {
            text-align: center;
            padding: 1.1rem 1.25rem;
            background: transparent;
            flex: 1;
            border: none;
            border-right: 1px solid var(--border-subtle);
            transition: background 0.3s;
        }
        .scorecard-country:last-child { border-right: none; }
        .scorecard-country.leading {
            background: rgba(194,165,109,0.05);
            border-top: 2px solid var(--accent-gold);
        }
        .scorecard-medal {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
            line-height: 1;
        }
        .scorecard-wins {
            font-family: var(--font-mono);
            font-size: 2rem;
            color: var(--accent-gold);
            font-weight: 500;
            line-height: 1;
        }
        .scorecard-label {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--w45);
            margin-top: 0.3rem;
        }
        .scorecard-country-name {
            font-family: var(--font-head);
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
            color: var(--text-white);
        }
        .pillar-winners-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 0.75rem;
        }
        .pillar-winner-item {
            padding: 0.6rem 1rem;
            background: var(--card-bg);
            border-radius: var(--card-radius);
            border: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s var(--easing);
            cursor: pointer;
        }
        .pillar-winner-item:hover {
            background: var(--card-bg-hover);
            border-color: rgba(194,165,109,0.2);
        }
        .pillar-winner-item.country-1 { border-top: 2px solid var(--accent-gold); }
        .pillar-winner-item.country-2 { border-top: 2px solid var(--accent-blue); }
        .pillar-winner-item.tie       { border-top: 2px solid var(--accent-amber); }
        .pillar-winner-name {
            font-family: var(--font-body);
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .pillar-winner-score {
            font-family: var(--font-minor);
            font-size: 0.78rem;
            color: var(--w45);
        }

        /* Gap Analysis */
        .gap-analysis {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 0;
            margin-top: 1.25rem;
            box-shadow: var(--card-shadow);
            overflow: hidden;
            animation: fadeInUp 0.6s var(--easing) 0.3s backwards;
        }
        .gap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.65rem 1.2rem;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            transition: background 0.2s;
        }
        .gap-item:last-child { border-bottom: none; }
        .gap-item:hover { background: rgba(255,255,255,0.025); }
        .gap-item.easy-win { border-left: 2px solid var(--accent-green); }
        .gap-item.moderate { border-left: 2px solid var(--accent-amber); }
        .gap-item.difficult { border-left: 2px solid var(--accent-red); }
        .gap-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .gap-pillar {
            font-family: var(--font-body);
            font-size: 0.88rem;
            font-weight: 500;
        }
        .gap-magnitude {
            font-family: var(--font-mono);
            font-size: 0.82rem;
            padding: 2px 6px;
            background: rgba(150,96,96,0.15);
            border-radius: 2px;
            color: var(--accent-red);
        }
        .gap-details {
            font-family: var(--font-minor);
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* All Variables Comparison */
        .all-variables-section {
            margin-top: 2rem;
        }
        .variables-toggle {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            border-radius: var(--card-radius);
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s var(--easing);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .variables-toggle:hover {
            border-color: rgba(194,165,109,.3);
            background: var(--card-bg-hover);
        }
        .variables-toggle-title {
            font-family: var(--font-head);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .variables-toggle-icon {
            transition: transform 0.3s var(--easing);
        }
        .variables-toggle-icon.expanded {
            transform: rotate(180deg);
        }
        .variables-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s var(--easing);
        }
        .variables-content.expanded {
            max-height: 5000px;
        }
        .variables-table {
            margin-top: 1rem;
        }
        .variable-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 1rem;
            padding: 0.6rem 1rem;
            background: transparent;
            border-radius: 0;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 0;
            transition: background 0.2s;
        }
        .variable-row:hover { background: rgba(255,255,255,0.025); }
        .variable-row.header {
            background: transparent;
            font-family: var(--font-minor);
            font-weight: 600;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--w45);
            border-bottom: 1px solid var(--border-subtle);
        }
        .variable-name {
            font-family: var(--font-body);
            font-size: 0.88rem;
        }
        .variable-value {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            text-align: center;
        }
        .variable-value.winner {
            color: var(--accent-gold);
            font-weight: 500;
        }
        .variable-diff {
            font-family: var(--font-minor);
            font-size: 0.78rem;
            font-weight: 500;
            text-align: center;
            padding: 3px 7px;
            border-radius: 2px;
        }
        .variable-diff.positive {
            background: rgba(93,138,114,0.15);
            color: var(--accent-green);
        }
        .variable-diff.negative {
            background: rgba(150,96,96,0.15);
            color: var(--accent-red);
        }

        /* Enhanced Pillar Comparison Table */
        .pillar-table-controls {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1rem;
            gap: 1rem;
        }
        .pillar-comparison table th {
            cursor: pointer;
            transition: all 0.3s var(--easing);
        }
        .pillar-comparison table th:hover {
            background: rgba(194, 165, 109, 0.1);
        }
        .pillar-comparison td.winner-cell {
            background: rgba(194, 165, 109, 0.05);
            font-weight: 600;
            color: var(--accent-gold);
        }
        .pillar-comparison td.large-diff {
            border-top: 2px solid var(--accent-amber);
        }
        .pillar-value-bar {
            height: 4px;
            background: var(--accent-gold);
            margin-top: 4px;
            border-radius: 2px;
            transition: width 0.5s var(--easing);
        }
        .pillar-diff-col {
            text-align: center;
            font-family: var(--font-minor);
        }

        /* Waterfall Visual Upgrade */
        .waterfall-panel {
            animation: fadeInUp 0.6s var(--easing);
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .waterfall-step {
            position: relative;
            padding-left: 1rem;
            transition: all 0.3s var(--easing);
        }
        .waterfall-step::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 4px;
            height: 100%;
            background: var(--accent-gold);
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s var(--easing);
        }
        .waterfall-step:hover::before {
            opacity: 1;
        }
        .waterfall-visual-separator {
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            margin: 1rem 0;
            opacity: 0.3;
        }

        /* Country Selector */
        .country-selector {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            padding: 16px 20px;
            border-radius: var(--card-radius);
            margin-bottom: 8px;
        }
        .country-selector label {
            display: block;
            margin-bottom: 0.5rem;
            font-family: var(--font-minor);
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--accent-gold);
        }
        .selector-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .country-selector select {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-white);
            padding: 0.5rem;
            font-family: var(--font-body);
            font-size: 0.9rem;
            width: 100%;
            border-radius: 2px;
        }

        /* Waterfall Breakdown */
        .waterfall-panel {
            background: var(--tertiary-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 3px;
            padding: 1rem 1.25rem 1.25rem;
            margin-top: 1rem;
            overflow: hidden;
        }
        .waterfall-title {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent-gold);
            padding: 0.85rem 1.2rem 0.4rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .waterfall-step {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.65rem 1.2rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .waterfall-step:last-child {
            border-bottom: none;
            border-top: 2px solid rgba(194,165,109,0.3);
            font-weight: 600;
        }
        .waterfall-label {
            font-family: var(--font-body);
            font-size: 0.88rem;
        }
        .waterfall-value {
            font-family: var(--font-mono);
            font-size: 0.95rem;
        }

        /* Differential Panel */
        .differential-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 3px;
            padding: 0;
            margin-top: 1.25rem;
            box-shadow: var(--card-shadow);
            overflow: hidden;
        }
        .differential-title {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            color: var(--accent-gold);
            padding: 0.85rem 1.2rem 0.4rem;
            border-bottom: 1px solid var(--border-subtle);
        }
        .differential-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1rem;
            margin-bottom: 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-subtle);
            transition: background 0.2s;
        }
        .differential-item:hover { background: rgba(255,255,255,0.025); }
        .differential-item:last-child { border-bottom: none; }

        /* Pillar Comparison Table */
        .pillar-comparison {
            margin-top: 0.75rem;
            overflow-x: auto;
            background: var(--card-bg);
            border-radius: 3px;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            padding: 0;
        }
        .pillar-comparison table {
            width: 100%;
            border-collapse: collapse;
        }
        .pillar-comparison th {
            background: var(--tertiary-bg);
            padding: 1rem;
            text-align: left;
            font-family: var(--font-minor);
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--accent-gold);
            border-bottom: 2px solid var(--accent-gold-dim);
            letter-spacing: 0.1em;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .pillar-comparison th:first-child {
            border-top-left-radius: 8px;
        }
        .pillar-comparison th:last-child {
            border-top-right-radius: 8px;
        }
        .pillar-comparison td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border-subtle);
            font-family: var(--font-minor);
            font-size: 0.85rem;
        }
        .pillar-comparison td:first-child {
            font-weight: 500;
            color: var(--text-white);
        }
        .pillar-comparison tbody tr {
            transition: all 0.2s ease;
        }
        .pillar-comparison tbody tr:hover {
            background: rgba(194, 165, 109, 0.08);
        }

        /* Rankings Table */
        .rankings-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .rankings-search {
            min-width: 240px;
            max-width: 420px;
            flex: 1;
        }
        .rankings-search input {
            width: 100%;
            background: var(--secondary-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-white);
            padding: 0.5rem 1rem;
            font-family: var(--font-body);
            font-size: 0.9rem;
            border-radius: 2px;
        }
        .rankings-filter select {
            background: var(--secondary-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-white);
            padding: 0.28rem 0.55rem;
            border-radius: 3px;
            font-size: 0.72rem;
            font-family: var(--font-body);
            line-height: 1;
            width: 200px;
            height: 32px;
            cursor: pointer;
        }

        /* Enhancement #30: Advanced Filters */
        .rankings-advanced-filters {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-label {
            font-family: var(--font-minor);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .score-range-slider {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            background: var(--secondary-bg);
            border: 1px solid var(--border-subtle);
            padding: 0 0.6rem;
            border-radius: 3px;
            height: 32px;
            box-sizing: border-box;
        }

        .score-range-slider input[type="range"] {
            width: 120px;
            height: 14px;
            background: transparent;
            cursor: pointer;
            margin: 0;
            padding: 0;
        }

        .score-range-slider input[type="range"]::-webkit-slider-runnable-track {
            background: linear-gradient(90deg, rgba(194,165,109,0.25) 0%, var(--accent-gold) 50%, rgba(194,165,109,0.25) 100%);
            height: 3px;
            border-radius: 2px;
        }

        .score-range-slider input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent-gold);
            border-radius: 50%;
            cursor: pointer;
            margin-top: -4.5px;
            box-shadow: 0 0 4px rgba(194,165,109,0.5);
        }

        .score-range-slider input[type="range"]::-moz-range-track {
            background: linear-gradient(90deg, rgba(194,165,109,0.25) 0%, var(--accent-gold) 50%, rgba(194,165,109,0.25) 100%);
            height: 3px;
            border-radius: 2px;
        }

        .score-range-slider input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: var(--accent-gold);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 4px rgba(194,165,109,0.5);
        }

        .score-value {
            font-family: var(--font-mono);
            font-size: 0.68rem;
            color: var(--accent-gold);
            min-width: 28px;
            text-align: center;
        }

        .tier-filter-checkboxes {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .tier-checkbox {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            cursor: pointer;
            font-size: 0.75rem;
            padding: 0.35rem 0.75rem;
            background: var(--secondary-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 15px;
            transition: all 0.3s var(--easing);
        }

        .tier-checkbox:hover {
            border-color: var(--accent-gold);
            background: rgba(194, 165, 109, 0.1);
        }

        .tier-checkbox input[type="checkbox"] {
            cursor: pointer;
        }

        .tier-checkbox.active {
            background: rgba(194, 165, 109, 0.2);
            border-color: var(--accent-gold);
        }

        .percentile-filter {
            display: contents;
        }

        .percentile-filter select {
            background: var(--secondary-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-white);
            padding: 0.28rem 0.55rem;
            border-radius: 3px;
            font-family: var(--font-body);
            font-size: 0.72rem;
            line-height: 1;
            width: 200px;
            height: 32px;
            cursor: pointer;
            outline: none;
        }

        /* Enhancement #35: Quick Stats Banner */
        .quick-stats-banner {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            box-shadow: var(--card-shadow);
            padding: 0;
            margin-bottom: 1.25rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 0;
            align-items: stretch;
            overflow: hidden;
        }

        .quick-stat-item {
            text-align: center;
            padding: 0.9rem 1rem;
            border-right: 1px solid var(--border-subtle);
        }
        .quick-stat-item:last-child { border-right: none; }

        .quick-stat-value {
            font-family: var(--font-mono);
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--accent-gold);
            margin-bottom: 0.2rem;
        }

        .quick-stat-label {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--w45);
        }

        .regional-breakdown-chart {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
        }

        .region-pie-segment {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            font-size: 0.7rem;
        }

        .region-color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        /* Enhancement #34: Histogram */
        .rank-distribution-histogram {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--card-shadow);
            border-radius: 0;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .histogram-title {
            font-family: var(--font-minor);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent-gold);
            margin-bottom: 1rem;
        }

        .histogram-bars {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 120px;
            position: relative;
        }

        .histogram-bar-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
            cursor: pointer;
            transition: all 0.3s var(--easing);
        }

        .histogram-bar-wrapper:hover {
            transform: translateY(-3px);
        }

        .histogram-bar-wrapper:hover .histogram-bar-inner {
            background: var(--accent-gold);
        }

        .histogram-bar-inner {
            width: 100%;
            background: linear-gradient(to top, var(--accent-gold), rgba(194, 165, 109, 0.5));
            border-radius: 2px 2px 0 0;
            transition: all 0.3s var(--easing);
            animation: barGrow 0.6s var(--easing);
            position: relative;
        }

        @keyframes barGrow {
            from {
                transform: scaleY(0);
                transform-origin: bottom;
            }
            to {
                transform: scaleY(1);
                transform-origin: bottom;
            }
        }

        .histogram-bar-count {
            font-family: var(--font-minor);
            font-size: 0.65rem;
            color: var(--text-white);
            margin-top: 0.25rem;
        }

        .histogram-bar-label {
            font-family: var(--font-minor);
            font-size: 0.6rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            writing-mode: horizontal-tb;
        }

        .median-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--accent-red);
            border-top: 2px dashed var(--accent-red);
            pointer-events: none;
        }

        .median-label {
            position: absolute;
            right: 0;
            top: -20px;
            font-family: var(--font-minor);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-red);
            background: var(--primary-bg);
            padding: 0 0.5rem;
        }

        /* Enhancement #36: Bulk Selection */
        .bulk-compare-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: linear-gradient(135deg, rgba(194,165,109,.1) 0%, rgba(194,165,109,.04) 100%);
            border: 1px solid rgba(194,165,109,.35);
            border-radius: 0;
            margin-bottom: 1rem;
            animation: slideDown 0.3s var(--easing);
            box-shadow: 0 2px 12px rgba(194,165,109,.06);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .selected-countries-list {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            flex: 1;
        }

        .selected-country-badge {
            background: var(--accent-gold);
            color: var(--primary-bg);
            padding: 0.35rem 0.75rem;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.3s var(--easing);
        }

        .selected-country-badge:hover {
            background: var(--text-white);
            transform: translateY(-2px);
        }

        .selected-country-badge i {
            font-size: 0.9rem;
        }

        .compare-selected-btn {
            padding: 0.5rem 1.5rem;
            background: var(--accent-gold);
            color: var(--primary-bg);
            border: none;
            border-radius: 20px;
            font-family: var(--font-minor);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.3s var(--easing);
        }

        .compare-selected-btn:hover {
            background: var(--text-white);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(194, 165, 109, 0.4);
        }

        .compare-selected-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Enhancement #49: Better Error Messages */
        .no-results-message {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--card-bg);
            border: 1px dashed rgba(255,255,255,.1);
            border-radius: 0;
            margin: 2rem 0;
        }
        .no-results-icon {
            font-size: 3rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
        }
        .no-results-title {
            font-family: var(--font-head);
            font-size: 1.3rem;
            color: var(--text-white);
            margin-bottom: 0.5rem;
        }
        .no-results-suggestion {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
        }

        /* Enhancement #52: Pulse effect for important metrics */
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }
        .pulse-effect {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Enhancement #52: Success feedback animation */
        @keyframes successPop {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .success-feedback {
            animation: successPop 0.4s var(--easing);
        }

        /* Enhancement #53: Tier Color System */
        .tier-excellent { color: var(--accent-green) !important; }
        .tier-good { color: var(--accent-lime) !important; }
        .tier-moderate { color: var(--accent-amber) !important; }
        .tier-weak { color: var(--accent-orange) !important; }
        .tier-poor { color: var(--accent-red) !important; }

        /* Enhancement #55: Favorite Star Button */
        .favorite-star {
            cursor: pointer;
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: all 0.3s var(--easing);
            display: inline-block;
        }
        .favorite-star:hover {
            color: var(--accent-gold);
            transform: scale(1.2);
        }
        .favorite-star.active {
            color: var(--accent-gold);
            animation: starPop 0.4s var(--easing);
        }
        @keyframes starPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(15deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .favorites-dropdown {
            position: relative;
        }
        .favorites-menu {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            background: var(--secondary-bg);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            min-width: 200px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1001;
        }
        .favorites-menu.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .favorites-menu-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            border-bottom: 1px solid var(--border-subtle);
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .favorites-menu-item:hover {
            background: var(--tertiary-bg);
        }
        .favorites-menu-empty {
            padding: 2rem 1rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Enhancement #58: Data Completeness Indicator */
        .data-completeness {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            font-family: var(--font-minor);
