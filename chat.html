// Enhancement #35: Update quick stats banner
function updateQuickStats() {
    const count = filteredRankings.length;
    const scores = filteredRankings.map(c => c.calculated_rao);
    const avg = scores.length > 0 ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
    const min = scores.length > 0 ? Math.min(...scores) : 0;
    const max = scores.length > 0 ? Math.max(...scores) : 0;

    document.getElementById('filtered-count').textContent = count;
    document.getElementById('filtered-avg').textContent = avg.toFixed(2);
    document.getElementById('filtered-range').textContent = `${min.toFixed(2)} - ${max.toFixed(2)}`;

    // Regional breakdown
    const regionalCounts = {};
    filteredRankings.forEach(c => {
        const region = getRegion(c.country);
        regionalCounts[region] = (regionalCounts[region] || 0) + 1;
    });

    const colors = {
        'Africa': '#a87a5e',
        'Americas': '#5d8a72',
        'Asia-Pacific': '#607c98',
        'Europe': '#C2A56D',
        'Middle East': '#9b7bb5'
    };

    const regionalHTML = Object.entries(regionalCounts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 5)
        .map(([region, count]) => `
            <div class="region-pie-segment">
                <div class="region-color-box" style="background: ${colors[region] || '#888'};"></div>
                <span>${region}: ${count}</span>
            </div>
        `).join('');

    document.getElementById('regional-breakdown').innerHTML = regionalHTML;
}

// Helper functions for new features
function getTier(score) {
    if (score >= 7) return 'excellent';
    if (score >= 6) return 'good';
    if (score >= 5) return 'moderate';
    if (score >= 3) return 'concerning';
    return 'critical';
}

function getTierBadge(tier) {
    const labels = {
        'excellent': 'Excellent',
        'good': 'Good',
        'moderate': 'Moderate',
        'concerning': 'Concerning',
        'critical': 'Critical'
    };
    return `<span class="tier-badge tier-${tier}">${labels[tier]}</span>`;
}

function getNextTier(score) {
    if (score < 3) return { tier: 'concerning', threshold: 3 };
    if (score < 5) return { tier: 'moderate', threshold: 5 };
    if (score < 6) return { tier: 'good', threshold: 6 };
    if (score < 7) return { tier: 'excellent', threshold: 7 };
    return { tier: 'top', threshold: 10 };
}

function getPercentile(rank) {
    const totalCountries = rawData.length;
    return Math.round(((totalCountries - rank + 1) / totalCountries) * 100);
}

// getRankBadge function removed - ranks now displayed as plain numbers

function calculatePillarPercentile(country, vars, isOpportunity) {
    const pillarScore = calculatePillarScore(country, vars);
    const allPillarScores = rawData.map(c => calculatePillarScore(c, vars))
        .filter(s => !isNaN(s));

    const rank = allPillarScores.filter(s => s > pillarScore).length + 1;
    return Math.round(((allPillarScores.length - rank + 1) / allPillarScores.length) * 100);
}

function renderRegimeTransitionTracker() {
    const ly = window.LATEST_YEAR || 2025;
    const fromY = parseInt(document.getElementById('regime-trans-from')?.value || 2010);
    const toY   = parseInt(document.getElementById('regime-trans-to')?.value || ly);
    const container = document.getElementById('regime-transitions');
    if (!container) return;

    const regimes = ['RO','FO','SL','SR'];
    // Build 4×4 count matrix and country lists
    const matrix = {};
    const lists = {};
    regimes.forEach(fr => { matrix[fr] = {}; lists[fr] = {}; regimes.forEach(to => { matrix[fr][to] = 0; lists[fr][to] = []; }); });

    for (const [iso, yearMap] of countryMap) {
        const fromRow = yearMap.get(fromY);
        const toRow   = yearMap.get(toY);
        if (!fromRow?.regime || !toRow?.regime) continue;
        const fr = fromRow.regime, to = toRow.regime;
        if (matrix[fr] && matrix[fr][to] !== undefined) { matrix[fr][to]++; lists[fr][to].push({ iso, name: fromRow.country_name || iso, rao: toRow.rao_score }); }
    }

    let html = `<table style="border-collapse:collapse;width:100%;min-width:500px;">
        <thead><tr><th style="padding:0.5rem 0.75rem;font-family:var(--font-minor);font-size:0.6rem;text-transform:uppercase;color:var(--text-muted);text-align:left;">From \\ To</th>`;
    regimes.forEach(to => {
        const c = REGIME_COLORS[to];
        html += `<th style="padding:0.5rem 0.75rem;font-family:var(--font-minor);font-size:0.6rem;text-transform:uppercase;color:${c.solid};text-align:center;background:${c.dim};">${to}</th>`;
    });
    html += `</tr></thead><tbody>`;

    regimes.forEach(fr => {
        const fc = REGIME_COLORS[fr];
        html += `<tr><td style="padding:0.5rem 0.75rem;font-family:var(--font-minor);font-size:0.65rem;font-weight:600;color:${fc.solid};background:${fc.dim};white-space:nowrap;">${fr} · ${fc.label}</td>`;
        regimes.forEach(to => {
            const count = matrix[fr][to];
            const isDiag = fr === to;
            const isSignal = !isDiag && count > 0 && (to === 'FO' || to === 'RO') && fr === 'SR';
            const cellBg = isDiag ? 'rgba(255,255,255,0.04)' : (isSignal ? 'rgba(194,165,109,0.12)' : 'transparent');
            const txtCol = isDiag ? 'var(--text-muted)' : (count > 0 ? 'var(--text-white)' : 'var(--text-muted)');
            const listId = `rtm-list-${fr}-${to}`;
            html += `<td style="padding:0.5rem 0.75rem;text-align:center;background:${cellBg};border:1px solid rgba(255,255,255,0.04);cursor:${count>0?'pointer':'default'};" onclick="toggleRTMList('${listId}',${count})">
                <span style="font-family:var(--font-mono);font-size:1rem;font-weight:700;color:${txtCol};">${count}</span>
                ${count>0?`<div id="${listId}" style="display:none;font-size:0.72rem;color:var(--text-muted);margin-top:0.35rem;text-align:left;">${lists[fr][to].sort((a,b)=>b.rao-a.rao).slice(0,8).map(c=>`<div style="padding:0.1rem 0;cursor:pointer;color:var(--accent-gold);" onclick="event.stopPropagation();openCountryFromElsewhere('${c.iso}')">${c.name} <span style="color:var(--text-muted);">(${(c.rao||0).toFixed(1)})</span></div>`).join('')}${lists[fr][to].length>8?`<div style="color:var(--text-muted);">+${lists[fr][to].length-8} more</div>`:''}</div>`:''}
            </td>`;
        });
        html += `</tr>`;
    });

    html += `</tbody></table>
    <p style="color:var(--text-muted);font-size:0.78rem;margin-top:0.75rem;">Showing regime transitions from ${fromY} to ${toY} · Click a cell to expand/collapse country list · Diagonal = no change</p>`;
    container.innerHTML = html;
}

function initializeAnalyticsTab() {
    initializeAnalyticsV8();
    const scores = rawData.map(c => c.calculated_rao);
    const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
    const sorted = [...scores].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];
    const stddev = Math.sqrt(scores.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / scores.length);
    const range = Math.max(...scores) - Math.min(...scores);

    // Enhancement #37: Additional statistical metrics
    const q1 = sorted[Math.floor(sorted.length * 0.25)];
    const q3 = sorted[Math.floor(sorted.length * 0.75)];
    const iqr = q3 - q1;
    const cv = (stddev / mean) * 100;
    const min = Math.min(...scores);
    const max = Math.max(...scores);

    // Calculate skewness
    const skewness = scores.reduce((sum, val) => sum + Math.pow((val - mean) / stddev, 3), 0) / scores.length;
    const skewnessLabel = skewness > 0.5 ? 'Right-skewed' : skewness < -0.5 ? 'Left-skewed' : 'Symmetric';

    document.getElementById('analytics-mean').textContent = mean.toFixed(2);
    document.getElementById('analytics-median').textContent = median.toFixed(2);
    document.getElementById('analytics-stddev').textContent = stddev.toFixed(2);
    document.getElementById('analytics-range').textContent = range.toFixed(2);
    document.getElementById('analytics-iqr').textContent = iqr.toFixed(2);
    document.getElementById('analytics-cv').textContent = cv.toFixed(1) + '%';
    document.getElementById('analytics-min').textContent = min.toFixed(2);
    document.getElementById('analytics-max').textContent = max.toFixed(2);
    document.getElementById('analytics-skewness').textContent = skewness.toFixed(2);
    document.getElementById('analytics-skewness-label').textContent = skewnessLabel;

    // Enhancement #38: Variable Explorer with better organization
    populateVariableExplorerDropdown();

    // Enhancement #41: Distribution histogram with better chart
    drawHistogram();

    // Enhancement #43: Regional chart with grouped bars

    // Enhancement #46: Fragility Analysis Section

}

    document.getElementById('variable-explorer-content').style.display = 'block';

    const values = rawData.map(c => ({ name: c.country_name, code: c.country, value: c[varName] }))
        .filter(v => v.value !== null && !isNaN(v.value));

    const scores = values.map(v => v.value);
    const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
    const sorted = [...scores].sort((a, b) => a - b);
    const min = sorted[0];
    const max = sorted[sorted.length - 1];
    const median = sorted[Math.floor(sorted.length / 2)];
    const std = Math.sqrt(scores.reduce((sum, val) => sum + Math.pow(val - mean, 2), 0) / scores.length);

    // Enhancement #38: Missing value count
    const missingCount = rawData.length - values.length;

    // Stats with global avg/median
    const statsHTML = `
        <div class="variable-stat">
            <div class="variable-stat-value">${mean.toFixed(2)}</div>
            <div class="variable-stat-label">Global Average</div>
        </div>
        <div class="variable-stat">
            <div class="variable-stat-value">${median.toFixed(2)}</div>
            <div class="variable-stat-label">Global Median</div>
        </div>
        <div class="variable-stat">
            <div class="variable-stat-value">${std.toFixed(2)}</div>
            <div class="variable-stat-label">Std Dev</div>
        </div>
        <div class="variable-stat">
            <div class="variable-stat-value">${min.toFixed(2)}</div>
            <div class="variable-stat-label">Min</div>
        </div>
        <div class="variable-stat">
            <div class="variable-stat-value">${max.toFixed(2)}</div>
            <div class="variable-stat-label">Max</div>
        </div>
        <div class="variable-stat">
            <div class="variable-stat-value" style="color: ${missingCount > 0 ? 'var(--accent-red)' : 'var(--accent-green)'}">${missingCount}</div>
            <div class="variable-stat-label">Missing Values</div>
        </div>
    `;
    document.getElementById('variable-stats').innerHTML = statsHTML;

    // Histogram
    const bins = Array(15).fill(0);
    const binSize = (max - min) / 15;
    scores.forEach(s => {
        const idx = Math.min(Math.floor((s - min) / binSize), 14);
        bins[idx]++;
    });
    const maxBin = Math.max(...bins);

    const histHTML = bins.map((count, i) => {
        const height = maxBin > 0 ? (count / maxBin * 100) : 0;
        return `<div class="histogram-bar" style="height: ${height}%;" title="${(min + i * binSize).toFixed(1)}-${(min + (i + 1) * binSize).toFixed(1)}: ${count} countries"></div>`;
    }).join('');

    document.getElementById('variable-histogram').innerHTML = `
        <div style="margin-bottom: 0.5rem; font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--text-muted);">Distribution</div>
        <div class="histogram">${histHTML}</div>
    `;

    // Top 5
    const sortedValues = [...values].sort((a, b) => b.value - a.value);
    const top5 = sortedValues.slice(0, 5);
    const top5HTML = top5.map((v, i) => `
        <div class="context-item" onclick="openCountryAnalysis('${v.code}')">
            <span>${i + 1}. ${v.name}</span>
            <span class="context-item-score score-color-good">${v.value.toFixed(2)}</span>
        </div>
    `).join('');
    document.getElementById('variable-top-countries').innerHTML = top5HTML;

    // Bottom 5
    const bottom5 = sortedValues.slice(-5).reverse();
    const bottom5HTML = bottom5.map((v, i) => `
        <div class="context-item" onclick="openCountryAnalysis('${v.code}')">
            <span>${sortedValues.length - i}. ${v.name}</span>
            <span class="context-item-score score-color-poor">${v.value.toFixed(2)}</span>
        </div>
    `).join('');
    document.getElementById('variable-bottom-countries').innerHTML = bottom5HTML;
}

// Enhancement #41: Distribution Histogram - Better Chart
function drawHistogram() {
    const scores = rawData.map(c => c.calculated_rao);
    const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
    const sorted = [...scores].sort((a, b) => a - b);
    const median = sorted[Math.floor(sorted.length / 2)];

    const bins = Array(20).fill(0).map(() => ({ count: 0, countries: [] }));
    rawData.forEach(c => {
        const idx = Math.min(Math.floor(c.calculated_rao / 0.5), 19);
        bins[idx].count++;
        bins[idx].countries.push(c.country_name);
    });
    const maxBin = Math.max(...bins.map(b => b.count));

    // Get tier colors
    const getTierColor = (score) => {
        if (score >= 7) return 'var(--accent-green)';
        if (score >= 6) return 'var(--accent-lime)';
        if (score >= 5) return 'var(--accent-amber)';
        if (score >= 3) return 'var(--accent-orange)';
        return 'var(--accent-red)';
    };

    const histHTML = bins.map((bin, i) => {
        const height = maxBin > 0 ? (bin.count / maxBin * 100) : 0;
        const score = i * 0.5;
        const color = getTierColor(score);
        const countriesList = bin.countries.slice(0, 5).join(', ') + (bin.count > 5 ? ` +${bin.count - 5} more` : '');
        return `
            <div class="histogram-bar"
                style="height: ${height}%; background: ${color}; animation: barGrow 0.6s ease-out ${i * 0.03}s both;"
                title="${score.toFixed(1)}-${(score + 0.5).toFixed(1)}: ${bin.count} countries&#10;${countriesList}">
            </div>
        `;
    }).join('');

    // Mean and median line positions
    const meanPos = (mean / 10) * 100;
    const medianPos = (median / 10) * 100;

    document.getElementById('distribution-histogram').innerHTML = `
        <div style="position: relative;">
            <div class="histogram">${histHTML}</div>
            <div style="position: absolute; left: ${meanPos}%; top: 0; bottom: 25px; width: 2px; background: var(--accent-gold); opacity: 0.7;"></div>
            <div style="position: absolute; left: ${meanPos}%; bottom: 25px; font-size: 0.75rem; font-weight: 600; color: var(--accent-gold); transform: translateX(-50%); white-space: nowrap;">Mean: ${mean.toFixed(2)}</div>
            <div style="position: absolute; left: ${medianPos}%; top: 0; bottom: 25px; width: 2px; background: var(--accent-blue); opacity: 0.7; border-style: dashed;"></div>
            <div style="position: absolute; left: ${medianPos}%; bottom: 10px; font-size: 0.75rem; font-weight: 600; color: var(--accent-blue); transform: translateX(-50%); white-space: nowrap;">Median: ${median.toFixed(2)}</div>
        </div>
        <div style="display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-muted); margin-top: 0.5rem;">
            <span>0</span><span>5</span><span>10</span>
        </div>
    `;
}

function drawAnalyticsQuadrant() {
    const oppMedian = rawData.map(c => c.calculated_opportunity).sort((a, b) => a - b)[Math.floor(rawData.length / 2)];
    const stabMedian = rawData.map(c => c.calculated_stability).sort((a, b) => a - b)[Math.floor(rawData.length / 2)];

    // Categorize countries by quadrant
    const quadrants = {
        topRight: [], // High Opp, High Stab - Stars
        topLeft: [], // Low Opp, High Stab - Stable but Limited
        bottomRight: [], // High Opp, Low Stab - High Potential
        bottomLeft: [] // Low Opp, Low Stab - At Risk
    };

    const quadrantDots = rawData.map(c => {
        const x = (c.calculated_opportunity / 10) * 100;
        const y = (c.calculated_stability / 10) * 100;
        const region = getRegion(c.country);
        const size = 4 + (c.calculated_rao / 10) * 4; // Size based on RAO score

        // Categorize
        if (c.calculated_opportunity >= oppMedian && c.calculated_stability >= stabMedian) quadrants.topRight.push(c);
        else if (c.calculated_opportunity < oppMedian && c.calculated_stability >= stabMedian) quadrants.topLeft.push(c);
        else if (c.calculated_opportunity >= oppMedian && c.calculated_stability < stabMedian) quadrants.bottomRight.push(c);

// Enhancement #40: Pillar Performance Matrix - Add Context
function drawPillarPerformanceMatrix() {
    const allPillars = [
        ...OPPORTUNITY_PILLARS.map(p => ({...p, type: 'Opportunity'})),
        ...STABILITY_PILLARS.map(p => ({...p, type: 'Stability'}))
    ];

    const matrixData = allPillars.map(pillar => {
        const scores = rawData.map(c => {
            if (pillar.type === 'Stability') {
                return 10 - calculatePillarScore(c, pillar.vars);
            }
            return calculatePillarScore(c, pillar.vars);
        });
        const sorted = [...scores].sort((a, b) => a - b);
        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
        const median = sorted[Math.floor(sorted.length / 2)];
        const max = Math.max(...scores);
        const min = Math.min(...scores);
        const variance = scores.reduce((sum, s) => sum + Math.pow(s - avg, 2), 0) / scores.length;
        const stdDev = Math.sqrt(variance);

        // Country count per quartile
        const q1Count = sorted.filter(s => s < sorted[Math.floor(sorted.length * 0.25)]).length;
        const q2Count = sorted.filter(s => s >= sorted[Math.floor(sorted.length * 0.25)] && s < median).length;
        const q3Count = sorted.filter(s => s >= median && s < sorted[Math.floor(sorted.length * 0.75)]).length;
        const q4Count = sorted.filter(s => s >= sorted[Math.floor(sorted.length * 0.75)]).length;

        return { name: pillar.name, type: pillar.type, avg, median, max, min, stdDev, q1Count, q2Count, q3Count, q4Count };
    });

    // Sort by variance (highest first)
    const sortedByVariance = [...matrixData].sort((a, b) => b.stdDev - a.stdDev);

    const html = `
        <div style="overflow-x: auto;">
            <table style="width: 100%; margin-top: 1rem; border-collapse: collapse;">
                <thead>
                    <tr style="background: var(--tertiary-bg);">

                        <th style="padding: 1rem; text-align: center; font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold);">Avg</th>
                        <th style="padding: 1rem; text-align: center; font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold);">Median</th>
                        <th style="padding: 1rem; text-align: center; font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold);">Best</th>
                        <th style="padding: 1rem; text-align: center; font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold);">Worst</th>
                        <th style="padding: 1rem; text-align: center; font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold);">Std Dev</th>
                        <th style="padding: 1rem; text-align: center; font-family: var(--font-minor); font-size: 0.6rem; text-transform: uppercase; color: var(--accent-gold); border-bottom: 2px solid var(--accent-gold);">Quartiles (Q1/Q2/Q3/Q4)</th>
                    </tr>
                </thead>
                <tbody>
                    ${matrixData.map((p, idx) => {
                        const isHighVariance = sortedByVariance.indexOf(p) < 3;
                        const rowBg = isHighVariance ? 'background: rgba(194, 165, 109, 0.05);' : '';
                        return `
                        <tr style="border-bottom: 1px solid var(--border-subtle); ${rowBg}">
                            <td style="padding: 1rem;">
                                ${p.name}
                                ${isHighVariance ? '<span style="margin-left: 0.5rem; font-size: 0.65rem; color: var(--accent-orange); font-family: var(--font-minor); text-transform: uppercase; letter-spacing: 0.06em;">High Variance</span>' : ''}
                            </td>
                            <td style="padding: 1rem; text-align: center;">
                                <span style="color: ${p.type === 'Opportunity' ? 'var(--accent-gold)' : 'var(--accent-blue)'}; font-weight: 600; font-size: 0.85rem;">${p.type}</span>
                            </td>
                            <td style="padding: 1rem; text-align: center;" class="${getScoreClass(p.avg)}">${p.avg.toFixed(2)}</td>
                            <td style="padding: 1rem; text-align: center; font-family: var(--font-mono);">${p.median.toFixed(2)}</td>

// Enhancement #39: Correlation Heatmap - Expand
function drawCorrelationHeatmap() {
    const allPillars = [
        ...OPPORTUNITY_PILLARS,
        ...STABILITY_PILLARS
    ];

    // Calculate correlation coefficients between pillars
    const correlations = [];
    for (let i = 0; i < allPillars.length; i++) {
        for (let j = i + 1; j < allPillars.length; j++) {
            const pillar1Scores = rawData.map(c => calculatePillarScore(c, allPillars[i].vars));
            const pillar2Scores = rawData.map(c => calculatePillarScore(c, allPillars[j].vars));

            const corr = calculateCorrelation(pillar1Scores, pillar2Scores);
            correlations.push({
                pillar1: allPillars[i].name,
                pillar2: allPillars[j].name,
                correlation: corr
            });
        }
    }

    // Apply filters
    const filter = document.getElementById('correlation-filter')?.value || 'all';
    const threshold = parseFloat(document.getElementById('correlation-threshold')?.value || 0);

    let filtered = correlations.filter(c => {
        const meetsThreshold = Math.abs(c.correlation) >= threshold;
        if (filter === 'positive') return c.correlation > 0 && meetsThreshold;
        if (filter === 'negative') return c.correlation < 0 && meetsThreshold;
        return meetsThreshold;
    });

    // Update threshold display
    if (document.getElementById('correlation-threshold-value')) {
        document.getElementById('correlation-threshold-value').textContent = threshold.toFixed(1) + '+';
    }

    // Sort by absolute correlation value and highlight strongest
    filtered.sort((a, b) => Math.abs(b.correlation) - Math.abs(a.correlation));
    const top15 = filtered.slice(0, 15);

    const html = `

function calculateCorrelation(x, y) {
    const n = x.length;
    const sumX = x.reduce((a, b) => a + b, 0);
    const sumY = y.reduce((a, b) => a + b, 0);
    const sumXY = x.reduce((sum, xi, i) => sum + xi * y[i], 0);
    const sumX2 = x.reduce((sum, xi) => sum + xi * xi, 0);
    const sumY2 = y.reduce((sum, yi) => sum + yi * yi, 0);

    const numerator = (n * sumXY) - (sumX * sumY);
    const denominator = Math.sqrt(((n * sumX2) - (sumX * sumX)) * ((n * sumY2) - (sumY * sumY)));

    return denominator === 0 ? 0 : numerator / denominator;
}

// ===== HELPER FUNCTIONS =====
function calculatePillarScore(country, vars) {
    let sum = 0, count = 0;
    vars.forEach(v => {
        if (country[v] !== null && !isNaN(country[v])) { sum += country[v]; count++; }
    });
    return count > 0 ? sum / count : 5;
}

function getScoreClass(score) {
    if (score >= 7) return 'score-color-excellent';
    if (score >= 6) return 'score-color-good';
    if (score >= 5) return 'score-color-moderate';
    if (score >= 3) return 'score-color-concerning';
    return 'score-color-poor';
}

function getRegion(code) {
    for (const [region, codes] of Object.entries(REGIONS)) {
        if (codes.includes(code)) return region;
    }
    return 'Other';
}

// ===== SEARCH =====
let _searchKbIndex = -1;

function _positionSearchResults() {
    const box     = document.querySelector('.search-box');
    const results = document.getElementById('search-results');
    if (!box || !results) return;
    const r = box.getBoundingClientRect();
    results.style.top   = r.bottom + 'px';
    results.style.left  = r.left   + 'px';
    results.style.width = r.width  + 'px';
}

function _setSearchKbIndex(idx) {
    const items = document.querySelectorAll('#search-results .search-result-item');
    items.forEach(el => el.classList.remove('kb-active'));
    _searchKbIndex = Math.max(-1, Math.min(idx, items.length - 1));
    if (_searchKbIndex >= 0) {
        items[_searchKbIndex].classList.add('kb-active');
        items[_searchKbIndex].scrollIntoView({ block: 'nearest' });
    }
}

function handleSearchKeydown(e) {
    const results = document.getElementById('search-results');
    const isOpen  = results && results.classList.contains('active');

    if (e.key === 'Escape') {
        if (results) results.classList.remove('active');
        _searchKbIndex = -1;
        return;
    }
    if (!isOpen) return;

    const items = results.querySelectorAll('.search-result-item');
    if (e.key === 'ArrowDown') {
        e.preventDefault();
        _setSearchKbIndex(_searchKbIndex + 1);
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        _setSearchKbIndex(_searchKbIndex - 1);
    } else if (e.key === 'Enter') {
        e.preventDefault();
        if (_searchKbIndex >= 0 && items[_searchKbIndex]) {
            items[_searchKbIndex].click();
            _searchKbIndex = -1;
        }
    }
}

function _closeSearch() {
    const results = document.getElementById('search-results');
    if (results) results.classList.remove('active');
    _searchKbIndex = -1;
}

function handleGlobalSearch(query) {
    _searchKbIndex = -1;
    const results = document.getElementById('search-results');
    if (!query || rawData.length === 0) { _closeSearch(); return; }

    const q = query.toLowerCase();
    const matches = rawData.filter(c =>
        c.country_name.toLowerCase().includes(q) ||
        c.country.toLowerCase().includes(q)
    ).slice(0, 8);

    if (matches.length === 0) { _closeSearch(); return; }

    results.innerHTML = matches.map(c => `
        <div class="search-result-item" data-iso="${c.country}"
             onclick="openCountryAnalysis('${c.country}'); _closeSearch(); document.getElementById('global-search').value = '';">
            <span>${c.country_name}</span>
            <span class="${getScoreClass(c.calculated_rao)}">${c.calculated_rao.toFixed(2)} (#${c.rank})</span>
        </div>
    `).join('');
    _positionSearchResults();
    results.classList.add('active');
}

function showSearchResults() {
    const query = document.getElementById('global-search').value;
    if (query) handleGlobalSearch(query);
}

window.addEventListener('scroll', () => {
    const results = document.getElementById('search-results');
    if (results && results.classList.contains('active')) _positionSearchResults();
}, { passive: true });

// ===== ENHANCEMENT #56: COMPARISON PRESETS =====
function loadComparisonPreset(presetKey) {
    const preset = COMPARISON_PRESETS[presetKey];
    if (!preset) return;

    let selectedCountries = [];

    if (preset.type === 'top') {
        selectedCountries = rawData.slice(0, preset.count).map(c => c.country);
    } else if (preset.type === 'bottom') {
        selectedCountries = rawData.slice(-preset.count).map(c => c.country);
    } else if (preset.type === 'regional') {
        Object.keys(REGIONS).forEach(region => {
            const countries = rawData.filter(c => REGIONS[region].includes(c.country));
            if (countries.length > 0) selectedCountries.push([...countries].sort((a,b)=>b.calculated_rao-a.calculated_rao)[0].country);
        });
    } else if (preset.type === 'prebreakout') {
        selectedCountries = getRegimeCell(['FO','SR'], 0.5)
            .sort((a,b)=>b.tos_score-a.tos_score).slice(0,3).map(r=>r.country);
    } else if (preset.type === 'tos_label') {
        selectedCountries = latestSlice.filter(r=>r.tos_signal_label===preset.label)
            .sort((a,b)=>b.tos_score-a.tos_score).slice(0,3).map(r=>r.country);
    } else if (preset.countries) {
        selectedCountries = preset.countries.filter(code =>
            rawData.some(c => c.country === code)
        );
    }

    // Switch to Compare tab and populate
    switchTab('compare');

    // Populate comparison (this will depend on your existing compare tab implementation)
    selectedCountries.forEach((code, idx) => {
        const dropdown = document.getElementById(`compare-country-${idx + 1}`);
        if (dropdown) dropdown.value = code;
    });

    // Trigger comparison update
    if (typeof updateComparison === 'function') {
        updateComparison();
    }

    showSuccessFeedback(document.querySelector('.nav-item.active'));
}

// ===== ENHANCEMENT #58: DATA COMPLETENESS INDICATOR =====
function calculateDataCompleteness(country) {
    const allVars = [...OPPORTUNITY_PILLARS, ...STABILITY_PILLARS]
        .flatMap(p => p.vars);

    let present = 0;
    allVars.forEach(v => {
        if (country[v] !== null && !isNaN(country[v])) present++;
    });

    return (present / allVars.length) * 100;
}

function getCompletenessHTML(completeness) {
    let className = 'completeness-high';
    if (completeness < 60) className = 'completeness-low';
    else if (completeness < 80) className = 'completeness-medium';

    return `
        <span class="data-completeness" title="Data completeness: ${completeness.toFixed(0)}%">
            <span class="completeness-badge ${className}">${completeness.toFixed(0)}%</span>
        </span>
    `;
}

function calculateGlobalCompleteness() {
    let total = 0;
    rawData.forEach(c => {
        total += calculateDataCompleteness(c);
    });
    return (total / rawData.length).toFixed(1);
}

// TIER 1 (always, cached): global stats + regional averages + compact ranking index
// ===== CHATBOT CONTEXT (RAO v2.1 / rao8) =====

function buildStaticContext() {
    if (datasetContextCache) return datasetContextCache;
    const slice = latestSlice;
    const n = slice.length;
    const avg = arr => arr.length ? (arr.reduce((s,v)=>s+v,0)/arr.length).toFixed(2) : 'N/A';
    const globalAvgRAO = avg(slice.map(r => r.rao_score));
    const globalAvgTOS = avg(slice.map(r => r.tos_score || 0));

    // Compact index — 6 fields only; pillar detail available via tier-2 retrieval
    const indexRows = slice.map(r =>
        `${r.country}|${r.country_name}|${r.rank}|${(r.rao_score||0).toFixed(2)}|${r.regime||'?'}|${(r.tos_score||0).toFixed(2)}`
    ).join('\n');

    datasetContextCache = `RAO Framework v2.1 — ${n} countries, 1–10 scale (higher=better).
Pillars: Opportunity | Stability | Absorptive Capacity (geometric mean) | Trajectory (OLS trend×R²).
Regimes: RO=Robust Opportunity | FO=Fragile Opportunity | SL=Stable/Low | SR=Structural Risk.
TOS: geometric mean of SIS×DGI×RVS. Signal: FO/SR + TOS>0.50 = pre-breakout candidate.
Global 2024: mean RAO=${globalAvgRAO}, mean TOS=${globalAvgTOS}
INDEX(ISO|Name|Rank|RAO|Regime|TOS):
${indexRows}`;

    return datasetContextCache;
}

// Tier 2 (on demand): recent panel history for named/regional countries (2020–2024 only)
function retrievePillarContext(isos) {
    if (!isos.length) return '';
    const capped = isos.slice(0, 12);
    const header = 'HISTORY(ISO|Year|RAO|Regime|TOS|Opp|Stab|AbsCap|Traj):';
    const rows = [];
    for (const iso of capped) {
        const hist = getCountryHistory(iso).filter(r => r.year >= 2015);
        for (const r of hist) {
            rows.push(`${r.country}|${r.year}|${(r.rao_score||0).toFixed(2)}|${r.regime||''}|${(r.tos_score||0).toFixed(2)}|${(r.pillar_opportunity||0).toFixed(2)}|${(r.pillar_stability||0).toFixed(2)}|${(r.pillar_absorptive_capacity||0).toFixed(2)}|${(r.pillar_trajectory||0).toFixed(2)}`);
        }
    }
    if (!rows.length) return '';
    return `\n${header}\n${rows.join('\n')}`;
}

// Tier 3: all 17 norm vars for explicitly named countries, 2022–2024 (always injected for named countries)
function retrieveVariableContext(isos) {
    if (!isos.length) return '';
    const NORM_FIELDS = ['norm_gdp_growth','norm_export_growth','norm_net_fdi_pct_gdp','norm_gross_capital_formation','norm_secondary_school_enrolment',
        'norm_cpi_inflation','norm_government_debt_pct_gdp','norm_current_account_pct_gdp','norm_external_debt_pct_gni',
        'norm_political_stability','norm_rule_of_law','norm_control_of_corruption',
        'norm_natural_resource_rents_pct_gdp','norm_gdp_per_capita_growth','norm_youth_unemployment','norm_vulnerable_employment','norm_regulatory_quality'];
    const header = `VARIABLES(ISO|Year|${NORM_FIELDS.join('|')}):`;
    const rows = [];
    for (const iso of isos) {
        const hist = getCountryHistory(iso).filter(r => r.year >= 2022);
        for (const r of hist) {
            rows.push(`${r.country}|${r.year}|${NORM_FIELDS.map(f => r[f] != null ? (r[f]).toFixed(2) : 'N/A').join('|')}`);
        }
    }
    if (!rows.length) return '';
    return `\n${header}\n${rows.join('\n')}`;
}

// Resolve context based on query intent
function resolveContext(query) {
    const q = query.toLowerCase();
    const isTemporal = /evolv|trend|history|over time|since|trajectory|2010|2015|2018|2020|2021|2022|2023|2024|year|change/.test(q);
    const isRegime = /pre.?break|frontier|reform story|fo\b|sr\b|breakout|takeoff|take.off|tos|fragile opp|structural risk/.test(q);
    const isArchetype = /archetype|cluster|high.growth|commodity|advanced economy|diversified|knowledge|service economy/.test(q);
    const isScreening = /screen|filter|top \d|best countries|highest|lowest|rank/.test(q);

    const namedISOs = latestSlice
        .filter(r => q.includes(r.country_name.toLowerCase()) || q.includes(r.country.toLowerCase()))
        .map(r => r.country);

    let tier2ISOs = [...namedISOs];
    let tier3ISOs = [...namedISOs];

    // Regional queries → inject countries in that region (capped at 10)
    Object.entries(REGIONS).forEach(([region, codes]) => {
        if (q.includes(region.toLowerCase())) {
            codes.slice(0, 10).forEach(iso => { if (!tier2ISOs.includes(iso)) tier2ISOs.push(iso); });
        }
    });

    // Regime screen → inject FO+SR+high TOS countries
    if (isRegime && namedISOs.length === 0) {
        const candidates = getRegimeCell(['FO','SR'], 0.5).slice(0, 12).map(r => r.country);
        tier2ISOs = [...new Set([...tier2ISOs, ...candidates])];
    }

    // Archetype → inject archetype peers for named countries
    if (isArchetype && namedISOs.length > 0) {
        const row = getLatestRow(namedISOs[0]);
        if (row) {
            const peers = getPeersByArchetype(namedISOs[0], window.LATEST_YEAR || 2025).slice(0, 6).map(r => r.country);
            tier2ISOs = [...new Set([...tier2ISOs, ...peers])];
        }
    }

    // Screening with no named country → inject top 10 by RAO
    if (isScreening && namedISOs.length === 0) {
        const top10 = latestSlice.slice(0, 10).map(r => r.country);
        tier2ISOs = [...new Set([...tier2ISOs, ...top10])];
    }

    return { tier2ISOs, tier3ISOs, isTemporal };
}

async function callGroqAPI(messages, tools = null, onToken = null) {
    const isCompound = GROQ_MODEL.startsWith('groq/compound');
    const useStream = isCompound && onToken !== null;

    const body = {
        model: GROQ_MODEL,
        messages,
        temperature: 0.25,
        max_completion_tokens: 3500,
        stream: useStream
    };

    if (isCompound) {
        body.compound_custom = { tools: { enabled_tools: ['web_search'] } };
    } else if (tools) {
        body.tools = tools;
        body.tool_choice = 'auto';
    }

    const response = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
        signal: _abortController ? _abortController.signal : undefined
    });

    if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${response.status}`);
    }

    if (useStream) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullContent = '';
        let buffer = '';

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop() ?? '';

            for (const line of lines) {
                if (!line.startsWith('data: ')) continue;
                const raw = line.slice(6).trim();
                if (raw === '[DONE]') continue;
                let parsed;
                try { parsed = JSON.parse(raw); } catch { continue; }
                // Surface stream-level errors (e.g. rate limits mid-stream)
                if (parsed.error) throw new Error(parsed.error.message || 'Stream error');
                // Only surface delta.content — skip delta.reasoning and delta.executed_tools
                const chunk = parsed.choices?.[0]?.delta?.content || '';
                if (chunk) { fullContent += chunk; onToken(chunk); }
            }
        }

        return { content: fullContent, tool_calls: null };
    }

    const data = await response.json();
    return data.choices?.[0]?.message || { content: 'No response received.' };
}

// ===== AGENTIC LOOP =====
async function runAgentLoop(userText) {
    _agentSources = [];
    _webSearchResultsData = [];
    clearTrace();
    addTraceStep('think', 'Analyzing query and selecting data strategy…');
    updateChatStatus('thinking', 'Reasoning…');

    const recentHistory = chatHistory.slice(-3);
    let messages = [
        { role: 'system', content: buildAgentSystemPrompt() },
        ...recentHistory
    ];

    for (let step = 0; step < MAX_AGENT_STEPS; step++) {
        const maxTok = step === 0 ? 500 : 2500;
        const response = await callGroqAPIAgent(messages, ALL_TOOLS, maxTok);

        if (response.tool_calls && response.tool_calls.length > 0) {
            const toolResults = [];
            for (const tc of response.tool_calls) {
                const fnName = tc.function.name;
                let fnArgs = {};
                try { fnArgs = JSON.parse(tc.function.arguments); } catch {}

                addTraceStep('tool-call', fnName.replace(/_/g, ' ') + '(' + formatToolArgs(fnArgs) + ')', { fnName, fnArgs });
                updateChatStatus('thinking', 'Retrieving: ' + fnName.replace(/_/g, ' ') + '…');

                let result;
                try { result = await executeToolCall(fnName, fnArgs); }
                catch (e) { result = 'Tool error: ' + e.message; addTraceStep('step-error', 'Failed: ' + fnName); }

                if (fnName === 'web_search') _agentSources.push({ type: 'web', query: fnArgs.query });
                else if (!fnName.startsWith('render_')) _agentSources.push({ type: 'rao', tool: fnName });

                addTraceStep('tool-result', summarizeToolResult(fnName, result), { fnName, result: typeof result === 'string' ? result : JSON.stringify(result) });
                toolResults.push({ role: 'tool', tool_call_id: tc.id, content: typeof result === 'string' ? result : JSON.stringify(result) });
            }
            messages = [...messages, response, ...toolResults];
            updateChatStatus('thinking', 'Synthesizing…');
        } else {
            const reply = response.content || 'No response received.';
            addTraceStep('respond', reply.slice(0, 100) + (reply.length > 100 ? '…' : ''), reply);
            return reply;
        }
    }
    // Fallback final call if loop exhausted without direct response
    addTraceStep('respond', 'Generating final response…');
    const final = await callGroqAPIAgent(messages, null, 2500);
    return final.content || 'Analysis complete.';
}

async function callGroqAPIAgent(messages, tools = null, maxTokens = 2500) {
    const isGemini = selectedModel.startsWith('gemini-');
    const url = isGemini ? GEMINI_CHAT_URL : WORKER_URL;
    const body = { model: selectedModel, messages, temperature: 0.2, max_tokens: maxTokens };
    if (tools && tools.length) {
        body.tools = tools;
        if (!isGemini) body.tool_choice = 'auto';
    }
    const response = await fetch(url, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
        signal: _abortController ? _abortController.signal : undefined
    });
    if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        throw new Error(err?.error?.message || `HTTP ${response.status}`);
    }
    const data = await response.json();
    const msg = data.choices?.[0]?.message || { content: 'No response.' };
    if (!isGemini && msg.content) msg.content = msg.content.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    return msg;
}

async function executeToolCall(name, args) {
    switch (name) {
        case 'get_country_profile':  return toolGetCountryProfile(args);
        case 'compare_countries':    return toolCompareCountries(args);
        case 'rank_by_pillar':       return toolRankByPillar(args);
        case 'find_anomalies':       return toolFindAnomalies(args);
        case 'web_search':           return await toolWebSearch(args);
        case 'render_scatter_plot':  { const el = buildScatterPlot(args);      if (el) renderChatChart(el); return 'Scatter plot rendered.'; }

function toolGetCountryProfile({ countries = [], include_history = false } = {}) {
    const results = [];
    for (const name of countries.slice(0, 5)) {
        const c = resolveCountry(name);
        if (!c) { results.push({ error: 'Not found: ' + name }); continue; }
        const row = getLatestRow(c.country) || c;
        const profile = {
            country: row.country, country_name: row.country_name, year: row.year,
            rao_score: row.rao_score, rao_pre_overlay: row.rao_score_pre_overlay,
            overlay_adjustment: row.overlay_adjustment, volatility_band: row.volatility_band,
            pillars: { opportunity: row.pillar_opportunity, stability: row.pillar_stability, absorptive_capacity: row.pillar_absorptive_capacity, trajectory: row.pillar_trajectory },
            tos_score: row.tos_score, tos_signal: row.tos_signal_label, sis_score: row.sis_score, dgi_score: row.dgi_score, rvs_score: row.rvs_score,
            regime: row.regime, regime_label: row.regime_label, archetype: row.archetype, trajectory_class: row.trajectory_class, rank: row.rank
        };
        const indicators = {};
        for (const [k, v] of Object.entries(row)) { if (k.startsWith('norm_')) indicators[k] = v; }
        profile.normalized_indicators = indicators;
        if (include_history) {
            profile.history = getCountryHistory(c.country).map(r => ({ year: r.year, rao: r.rao_score, opp: r.pillar_opportunity, stab: r.pillar_stability, ac: r.pillar_absorptive_capacity, traj: r.pillar_trajectory, regime: r.regime, tos: r.tos_score }));
        }
        results.push(profile);
    }
    return JSON.stringify(results, null, 2);
}

function toolCompareCountries({ countries = [] } = {}) {
    const resolved = countries.slice(0, 5).map(n => resolveCountry(n)).filter(Boolean);
    if (!resolved.length) return 'No countries found.';
    return JSON.stringify(resolved.map(c => {
        const r = getLatestRow(c.country) || c;
        return { country: r.country_name, iso: r.country, year: r.year, rao: +r.rao_score?.toFixed(2), opp: +r.pillar_opportunity?.toFixed(3), stab: +r.pillar_stability?.toFixed(3), ac: +r.pillar_absorptive_capacity?.toFixed(3), traj: +r.pillar_trajectory?.toFixed(3), tos: +r.tos_score?.toFixed(2), regime: r.regime, archetype: r.archetype, rank: r.rank };
    }), null, 2);
}

// Maps broad region aliases → sub-region labels stored in CSV
const REGION_ALIASES = {
    'sub-saharan africa': ['West Africa','East Africa','Central Africa','Southern Africa'],
    'africa': ['West Africa','East Africa','Central Africa','Southern Africa','North Africa'],
    'east asia & pacific': ['East Asia','Southeast Asia','Australasia','Pacific Islands'],
    'asia pacific': ['East Asia','Southeast Asia','South Asia','Central Asia','Australasia','Pacific Islands'],
    'middle east & north africa': ['Middle East','North Africa'],
    'mena': ['Middle East','North Africa'],
    'europe & central asia': ['Western Europe','Eastern Europe','Southern Europe','Central Asia'],
    'europe': ['Western Europe','Eastern Europe','Southern Europe'],
    'latin america & caribbean': ['South America','Central America','Caribbean'],
    'latin america': ['South America','Central America','Caribbean'],
};

function matchRegion(rowRegion, query) {
    if (!query || !rowRegion) return !query;
    const r = (rowRegion || '').toLowerCase();
    const q = query.toLowerCase().trim();
    if (r === q) return true;
    const subs = REGION_ALIASES[q];
    if (subs) return subs.some(s => r === s.toLowerCase());
    // fallback: exact sub-region prefix match (avoids "East Asia" matching "Southeast Asia")
    return r === q || r.startsWith(q + ' ');
}

function toolRankByPillar({ metric = 'rao_score', top_n = 20, year, region } = {}) {
    let slice = year ? getSlice(year) : latestSlice;
    if (region) slice = slice.filter(r => matchRegion(r.region, region));
    const ranked = [...slice].filter(r => r[metric] != null).sort((a, b) => b[metric] - a[metric]).slice(0, Math.min(top_n || 20, 50)).map((r, i) => ({ rank: i + 1, country: r.country_name, iso: r.country, value: +r[metric]?.toFixed(3), regime: r.regime, tos: +r.tos_score?.toFixed(2), region: r.region || '' }));
    return JSON.stringify({ metric, year: year || window.LATEST_YEAR, region: region || 'global', rankings: ranked }, null, 2);
}

function toolFindAnomalies({ focus = 'all', year, region } = {}) {
    let slice = year ? getSlice(year) : latestSlice;
    if (region) slice = slice.filter(r => matchRegion(r.region, region));
    const regionScores = {};
    slice.forEach(r => { const rg = r.region || 'Unknown'; if (!regionScores[rg]) regionScores[rg] = []; regionScores[rg].push(r.rao_score || 0); });
    const regionMeans = {};
    for (const [rg, scores] of Object.entries(regionScores)) regionMeans[rg] = scores.reduce((a, b) => a + b, 0) / scores.length;
    const anomalies = [];
    for (const r of slice) {
        const flags = [];
        if ((focus === 'opportunity' || focus === 'all') && (r.regime === 'FO' || r.regime === 'SR') && (r.tos_score || 0) >= 0.55) flags.push(r.regime + ' + TOS ' + r.tos_score?.toFixed(2) + ' — pre-breakout signal');
        const rm = regionMeans[r.region || 'Unknown'];
        if (focus === 'all' && rm && Math.abs((r.rao_score || 0) - rm) > 1.5) flags.push('Regional outlier: ' + (((r.rao_score || 0) - rm) > 0 ? '+' : '') + ((r.rao_score || 0) - rm).toFixed(2) + ' vs ' + (r.region || 'regional') + ' mean');
        if ((focus === 'risk' || focus === 'all') && (r.volatility_band || 0) > 1.8) flags.push('High volatility band: ' + r.volatility_band?.toFixed(2));
        if (flags.length) anomalies.push({ country: r.country_name, iso: r.country, rao: +r.rao_score?.toFixed(2), regime: r.regime, tos: +r.tos_score?.toFixed(2), region: r.region || '', flags });
    }
    return JSON.stringify({ year: year || window.LATEST_YEAR, focus, region: region || 'global', anomalies: anomalies.slice(0, 25) }, null, 2);
}

async function toolWebSearch({ query = '' } = {}) {
    if (!query) return 'No query provided.';
    try {
        const authQuery = query.slice(0, 380) + ` site:un.org OR site:worldbank.org OR site:imf.org OR site:oecd.org OR site:chathamhouse.org OR site:rand.org OR site:brookings.edu OR site:csis.org ${new Date().getFullYear()}`;
        const [newsRes, authRes] = await Promise.all([
            fetch(SEARCH_WORKER_URL + '/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: query.slice(0, 400) }) }),
            fetch(SEARCH_WORKER_URL + '/search', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ query: authQuery.slice(0, 400) }) })
        ]);
        let newsData = {}, authData = {};
        if (newsRes.ok) { try { newsData = JSON.parse(await newsRes.text()); } catch {} }
        if (authRes.ok) { try { authData = JSON.parse(await authRes.text()); } catch {} }

        const authDomains = ['un.org','worldbank.org','imf.org','oecd.org','chathamhouse.org','rand.org','brookings.edu','csis.org'];
        const isAuth = (url) => { try { return authDomains.some(d => new URL(url).hostname.replace('www.','').endsWith(d)); } catch { return false; } };

        const newsResults = (newsData.results || []).map(r => ({ ...r, type: 'news' }));
        const authResults = (authData.results || []).map(r => ({ ...r, type: 'authoritative' }));

        // Deduplicate by URL
        const seenUrls = new Set(newsResults.map(r => r.url));
        const merged = [...newsResults, ...authResults.filter(r => r.url && !seenUrls.has(r.url))];

        // Populate footnote data
        merged.forEach(r => {
            if (!r.url) return;
            try {
                const domain = new URL(r.url).hostname.replace('www.', '');
                _webSearchResultsData.push({ title: r.title || r.url, url: r.url, domain, type: r.type || (isAuth(r.url) ? 'authoritative' : 'news') });
            } catch {}
        });

        return JSON.stringify({ results: merged, answer: newsData.answer || authData.answer });
    } catch (e) { return 'Search error: ' + e.message; }
}

function formatToolArgs(args) {
    return Object.entries(args).map(([k, v]) => Array.isArray(v) ? k + '=[' + v.slice(0, 3).join(',') + (v.length > 3 ? '…' : '') + ']' : k + '=' + JSON.stringify(v)).join(', ');
}

function summarizeToolResult(name, result) {
    try {
        if (name === 'web_search') { const d = JSON.parse(result); return 'Web: ' + (d.results?.length || 0) + ' results' + (d.answer ? ' + answer' : ''); }
        if (name === 'get_country_profile') { const d = JSON.parse(result); return 'Profile: ' + d.map(c => c.country_name || c.error).join(', '); }
        if (name === 'compare_countries') { const d = JSON.parse(result); return 'Compare: ' + d.length + ' countries'; }
        if (name === 'rank_by_pillar') { const d = JSON.parse(result); return 'Rankings: top ' + d.rankings?.length + ' by ' + d.metric; }
        if (name === 'find_anomalies') { const d = JSON.parse(result); return 'Anomalies: ' + d.anomalies?.length + ' flagged'; }
    } catch {}
    if (name.startsWith('render_')) return 'Chart rendered';
    return String(result || '').slice(0, 60);
}

function closeTraceModal(e) {
    if (e && e.target !== document.getElementById('trace-modal')) return;
    document.getElementById('trace-modal').classList.remove('open');

function buildTraceModalContent(type, data) {
    if (type === 'respond') {
        return '<div class="tm-md">' + chatMarkdownToHTML(String(data)) + '</div>';
    }
    if (type === 'tool-call') {
        return '<div class="tm-fn-name">' + escapeHTMLSafe(data.fnName) + '</div>' +
               '<pre class="tm-code">' + escapeHTMLSafe(JSON.stringify(data.fnArgs, null, 2)) + '</pre>';
    }
    if (type === 'tool-result') {
        if (data.fnName === 'web_search') return buildWebSearchModal(data.result);
        try {
            return '<pre class="tm-code">' + escapeHTMLSafe(JSON.stringify(JSON.parse(data.result), null, 2)) + '</pre>';
        } catch { return '<pre class="tm-code">' + escapeHTMLSafe(String(data.result)) + '</pre>'; }
    }
    return '<div style="white-space:pre-wrap;">' + escapeHTMLSafe(String(data)) + '</div>';
}

function buildWebSearchModal(resultStr) {
    let data;
    try { data = JSON.parse(resultStr); } catch { return '<pre class="tm-code">' + escapeHTMLSafe(resultStr) + '</pre>'; }
    let html = '';
    if (data.answer) {
        html += '<div class="tm-answer"><div class="tm-section-lbl">Answer</div>' + escapeHTMLSafe(data.answer) + '</div>';
    }
    if (data.results?.length) {
        html += '<div class="tm-section-lbl">Sources (' + data.results.length + ')</div>';
        for (const r of data.results) {
            html += '<div class="tm-source">' +
                '<div class="tm-source-title">' + escapeHTMLSafe(r.title || '') + '</div>' +
                '<div class="tm-source-url"><a href="' + escapeHTMLSafe(r.url || '') + '" target="_blank" rel="noopener">' + escapeHTMLSafe(r.url || '') + '</a></div>' +
                '<div class="tm-source-snippet">' + escapeHTMLSafe(r.content || '') + '</div>' +
                '</div>';
        }
    }
    return html || '<div>No results.</div>';
}

function listSessions() {
    try { return JSON.parse(localStorage.getItem(SESSION_STORAGE_KEY) || '[]'); } catch { return []; }
}

function saveSessions(sessions) {
    try { localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify(sessions)); } catch {}
}

function newSession() {
    currentSessionId = 'sess_' + Date.now();
    chatHistory = [];
    _chartInstances.forEach(c => { try { c.destroy(); } catch {} });
    _chartInstances.length = 0;
    showWelcomeState();
    clearTrace();
    const bar = document.getElementById('coverage-bar');
    if (bar) bar.style.display = 'none';
    const ep = document.getElementById('entity-panel');
    if (ep) ep.style.display = 'none';
    const container = document.getElementById('chat-messages-container');
    container?.querySelectorAll('.topic-menu, .drill-down-bar').forEach(el => el.remove());
    updateChatStatus('ready', 'Ready');
    renderSessionsSidebar();
}

function autoSaveSession() {
    if (!chatHistory.length || !currentSessionId) return;
    const sessions = listSessions();
    const firstUser = chatHistory.find(m => m.role === 'user');
    const name = firstUser ? firstUser.content.slice(0, 48) + (firstUser.content.length > 48 ? '…' : '') : 'Untitled';
    const idx = sessions.findIndex(s => s.id === currentSessionId);
    const entry = { id: currentSessionId, name, updatedAt: new Date().toISOString(), messages: chatHistory.filter(m => m.role !== 'chart').slice(-16) };
    if (idx >= 0) sessions[idx] = entry; else sessions.unshift(entry);
    saveSessions(sessions.slice(0, 15));
    renderSessionsSidebar();
}

function loadSession(id) {
    const sess = listSessions().find(s => s.id === id);
    if (!sess) return;
    currentSessionId = id;
    chatHistory = sess.messages || [];
    _chartInstances.forEach(c => { try { c.destroy(); } catch {} });
    _chartInstances.length = 0;
    const container = document.getElementById('chat-messages-container');
    if (!container) return;
    container.innerHTML = '';
    if (!chatHistory.length) { showWelcomeState(); }
    else { hideWelcomeState(); chatHistory.forEach(m => { if (m.role === 'user') renderChatMessage('user', m.content); else if (m.role === 'assistant') renderChatMessage('assistant', m.content); }); }
    clearTrace();
    const bar = document.getElementById('coverage-bar');
    if (bar) bar.style.display = 'none';
    renderSessionsSidebar();
}

function deleteSession(id, evt) {
    evt?.stopPropagation();
    saveSessions(listSessions().filter(s => s.id !== id));
    if (currentSessionId === id) { currentSessionId = null; newSession(); } else renderSessionsSidebar();
}

function renderSessionsSidebar(query) {
    const list = document.getElementById('sessions-list');
    if (!list) return;
    let sessions = listSessions();
    if (query && query.trim()) {
        const q = query.toLowerCase();
        sessions = sessions.filter(s => s.name.toLowerCase().includes(q));
    }
    if (!sessions.length) {
        list.innerHTML = '<div style="padding:1.2rem 0.9rem;font-size:0.77rem;color:var(--text-muted);font-style:italic;text-align:center;">No sessions yet</div>';
        return;
    }
    list.innerHTML = sessions.map(s => {
        const dt = new Date(s.updatedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        return '<div class="session-item' + (s.id === currentSessionId ? ' active' : '') + '" onclick="loadSession(\'' + s.id + '\')">'
            + '<span class="session-name" title="' + escapeHTMLSafe(s.name) + '" ondblclick="renameSession(\'' + s.id + '\', event)">' + escapeHTMLSafe(s.name) + '</span>'
            + '<span class="session-time">' + dt + '</span>'
            + '<button class="session-del" onclick="deleteSession(\'' + s.id + '\', event)" title="Delete"><i class="ri-delete-bin-line"></i></button>'
            + '</div>';
    }).join('');
}

function closeSessionSearchModal(e) {
    if (e && e.target !== document.getElementById('session-search-modal')) return;
    document.getElementById('session-search-modal').style.display = 'none';

function runSessionSearch(query) {
    const results = document.getElementById('ssm-results');
    if (!query.trim()) { results.innerHTML = '<div class="ssm-empty">Type to search your research history.</div>'; return; }
    const sessions = listSessions();
    const q = query.toLowerCase();
    const matches = [];
    sessions.forEach(s => {
        const nameMatch = s.name.toLowerCase().includes(q);
        let excerpt = '';
        let msgMatch = false;
        (s.messages || []).forEach(m => {
            if (m.content && m.content.toLowerCase().includes(q)) {
                msgMatch = true;
                if (!excerpt) {
                    const idx = m.content.toLowerCase().indexOf(q);
                    excerpt = '…' + m.content.slice(Math.max(0, idx - 40), idx + 120) + '…';
                }
            }
        });
        if (nameMatch || msgMatch) matches.push({ s, excerpt, nameMatch });
    });
    if (!matches.length) { results.innerHTML = '<div class="ssm-empty">No matches found.</div>'; return; }
    const reQ = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    const highlight = (text) => escapeHTMLSafe(text).replace(reQ, m => `<mark>${m}</mark>`);
    results.innerHTML = matches.map(({ s, excerpt }) =>
        `<div class="ssm-result" onclick="loadSession('${s.id}'); closeSessionSearchModal();">` +
        `<div class="ssm-result-name">${highlight(s.name)}</div>` +
        (excerpt ? `<div class="ssm-result-excerpt">${highlight(excerpt)}</div>` : '') +
        `<div class="ssm-result-meta">${new Date(s.updatedAt).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</div>` +
        `</div>`
    ).join('');
}

// Process only text nodes (between HTML tags) to avoid breaking attributes
function processTextNodes(html, fn) {
    return html.replace(/(?<=>|^)([^<]+)(?=<|$)/g, (match, text, offset, str) => {
        const before = str.slice(0, offset);
        const lastOpen = before.lastIndexOf('<span');
        const lastClose = before.lastIndexOf('</span>');
        if (lastOpen > lastClose && str.slice(lastOpen, lastOpen + 60).includes('stat-tag')) {
            return match;
        }
        return fn(text);
    });
}

function chatMarkdownToHTML(text) {
    let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

    // Headers
    html = html.replace(/^#{4,} (.+)$/gm, '<h4>$1</h4>');
    html = html.replace(/^### (.+)$/gm,   '<h3>$1</h3>');
    html = html.replace(/^## (.+)$/gm,    '<h3>$1</h3>');

    // Normalize * bullets to - bullets BEFORE bold/italic so the bullet
    // asterisk never gets paired with inline asterisks like "word*" footnotes
    html = html.replace(/^(\s*)\* (?!\*)/gm, '$1- ');

    // Bold (process before italic so ** isn't consumed by * rule)
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic — opening * must not be followed by space; closing * must not
    // be preceded by space; neither side touches another *
    html = html.replace(/(?<!\*)\*(?!\s)([^*\n]+?)(?<!\s)\*(?!\*)/g, '<em>$1</em>');

    // Inline code -> stat tag, with norm_ variable names replaced by human-readable labels
    html = html.replace(/`([^`]+)`/g, (_, inner) => {
        const label = NORM_VAR_LABELS[inner.trim()];
        return `<span class="stat-tag">${label || inner}</span>`;
    });

    // Also replace bare norm_ variable names in prose (not inside tags or already replaced)
    html = html.replace(/\bnorm_[a-z_]+\b/g, m => NORM_VAR_LABELS[m] || m);

    // Markdown tables (process before lists/paragraphs)
    html = html.replace(/((?:^\|.+\|\n?)+)/gm, match => {
        const lines = match.trim().split('\n');
        const isSep = l => /^\|[\s\-:|]+\|$/.test(l);
        const dataLines = lines.filter(l => !isSep(l));
        if (dataLines.length < 2) return match;
        const parseRow = l => l.split('|').slice(1, -1).map(c => c.trim());
        const [hdr, ...body] = dataLines;
        const thead = `<thead><tr>${parseRow(hdr).map(c => `<th>${c}</th>`).join('')}</tr></thead>`;
        const tbody = `<tbody>${body.map(r => `<tr>${parseRow(r).map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>`;
        return `<div class="chat-table-wrap"><table>${thead}${tbody}</table></div>`;
    });

    // Horizontal rules
    html = html.replace(/^---+$/gm, '<hr class="chat-hr">');

    // Unordered lists (handles both - and any remaining * prefix)
    html = html.replace(/((?:^- .+$\n?)+)/gm, match => {
        const items = match.trim().split('\n')
            .map(l => `<li>${l.replace(/^- /, '')}</li>`).join('');
        return `<ul>${items}</ul>`;
    });

    // Ordered lists
    html = html.replace(/((?:^\d+\. .+$\n?)+)/gm, match => {
        const items = match.trim().split('\n')
            .map(l => `<li>${l.replace(/^\d+\. /, '')}</li>`).join('');
        return `<ol>${items}</ol>`;
    });

    // Paragraphs: wrap bare lines not already in a block tag
    html = html.replace(/^(?!<[huoldt])(.+)$/gm, '<p>$1</p>');

    // Clean up empty paragraphs
    html = html.replace(/<p>\s*<\/p>/g, '');

    // Score chips — color decimal numbers 1.00–10.00 (RAO scale) in text nodes only
    html = processTextNodes(html, text =>
        text.replace(/\b(\d{1,2}\.\d{1,2})\b/g, (match, num) => {
            const v = parseFloat(num);
            if (v < 1 || v > 10) return match;
            const cls = v >= 7.0 ? 'score-hi' : v >= 4.5 ? 'score-mid' : 'score-lo';
            return `<span class="score-chip ${cls}">${num}</span>`;
        })
    );

    // ISO badges — tag known 3-letter country codes in text nodes
    if (rawData && rawData.length) {
        const isoSet = new Set(rawData.map(c => c.country));
        html = processTextNodes(html, text =>
            text.replace(/\b([A-Z]{3})\b/g, (match, iso) =>
                isoSet.has(iso) ? `<span class="iso-badge">${iso}</span>` : match
            )
        );
    }

    return html;
}

function streamChatContent(bubble, html, container, timeStr) {
    // Split HTML into tag tokens and text-word tokens, reveal text word-by-word
    const chunks = [];
    let rem = html;
    while (rem.length) {
        const m = rem.match(/<[^>]+>/);
        if (!m) {
            rem.split(/(\s+)/).forEach(w => { if (w.length) chunks.push({ tag: false, val: w }); });
            break;
        }
        if (m.index > 0) {
            rem.substring(0, m.index).split(/(\s+)/).forEach(w => { if (w.length) chunks.push({ tag: false, val: w }); });
        }
        chunks.push({ tag: true, val: m[0] });
        rem = rem.substring(m.index + m[0].length);
    }

    let i = 0;
    let rendered = '';

    let userScrolled = false;
    const onScroll = () => {
        userScrolled = container.scrollHeight - container.scrollTop - container.clientHeight > 80;
    };
    container.addEventListener('scroll', onScroll);

    const scroll = () => {
        requestAnimationFrame(() => { if (!userScrolled) container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' }); });
    };

    function step() {
        if (i >= chunks.length) {
            bubble.innerHTML = rendered + (timeStr ? `<span class="msg-time">${timeStr}</span>` : '');
            container.removeEventListener('scroll', onScroll);
            scroll();
            return;
        }
        // Flush all consecutive tag tokens instantly
        while (i < chunks.length && chunks[i].tag) {
            rendered += chunks[i].val;
            i++;
        }
        // Reveal a few text tokens per tick
        let words = 0;
        while (i < chunks.length && !chunks[i].tag && words < 3) {
            rendered += chunks[i].val;
            i++;
            words++;
        }
        bubble.innerHTML = rendered + '<span class="stream-cursor"></span>';
        scroll();
        setTimeout(step, 16);
    }
    scroll();
    step();
}
