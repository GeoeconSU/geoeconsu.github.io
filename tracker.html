  <!-- ─── FIREBASE + APP LOGIC ─────────────────────────────────────── -->
  <script type="module">

  /*
   * ─── FIREBASE SECURITY RULES ─────────────────────────────────────────────
   *
   * Paste these rules into Firebase Console → Realtime Database → Rules tab.
   *
   * OPTION A: Open access — no authentication required.
   *           Simple for internal/private URLs. NOT safe for public pages.
   * ─────────────────────────────────────────────────────────────────────────
   * {
   *   "rules": {
   *     "projects": {
   *       ".read": true,
   *       ".write": true
   *     }
   *   }
   * }
   *
   * OPTION B: Firebase Authentication required (recommended).
   *           Enable Auth (Anonymous or Email/Password) in Firebase Console first.
   * ─────────────────────────────────────────────────────────────────────────
   * {
   *   "rules": {
   *     "projects": {
   *       ".read":  "auth !== null",
   *       ".write": "auth !== null",
   *       "$projectId": {
   *         ".validate": "newData.hasChildren(['name', 'collapsed'])",
   *         "tasks": {
   *           "$taskId": {
   *             ".validate": "newData.hasChildren(['name', 'status', 'priority']) &&
   *                           newData.child('status').val().matches(/^(todo|inprogress|done)$/) &&
   *                           newData.child('priority').val().matches(/^(low|medium|high)/)"
   *           }
   *         }
   *       }
   *     }
   *   }
   * }
   *
   * OPTION C: Restrict to specific UIDs (allowlist specific team members).
   * ─────────────────────────────────────────────────────────────────────────
   * {
   *   "rules": {
   *     "allowedUsers": {
   *       ".read": "auth !== null"
   *     },
   *     "projects": {
   *       ".read":  "root.child('allowedUsers').child(auth.uid).exists()",
   *       ".write": "root.child('allowedUsers').child(auth.uid).exists()"
   *     }
   *   }
   * }
   * ─────────────────────────────────────────────────────────────────────────
   */

  // ─── FIREBASE CONFIG ─────────────────────────────────────────────────────
  // PASTE YOUR FIREBASE CONFIG HERE
  // Replace this placeholder object with your actual config from:
  // Firebase Console → Project Settings → General → Your apps → Web app → SDK setup
const firebaseConfig = {
  apiKey: "AIzaSyCMacVixbatCn2JVvh4RMixUcOZToQKRKs",
  authDomain: "gsu-tracker.firebaseapp.com",
  databaseURL: "https://gsu-tracker-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gsu-tracker",
  storageBucket: "gsu-tracker.firebasestorage.app",
  messagingSenderId: "359938689049",
  appId: "1:359938689049:web:3a9deef5f6b354cee20288",
  measurementId: "G-Z3KWSFQPTG"
};
  // ─────────────────────────────────────────────────────────────────────────

  // ─── TEAM MEMBERS ─────────────────────────────────────────────────────────
  // Update this list with real names when ready
  const TEAM_MEMBERS = [
    'Adip',
    'Bhuvanya',
    'Dhanashree',
    'Ishan',
    'Lauren',
    'Lucas',
    'Nandana',
    'Niamh',
    'Nurein',
    'Pranoy',
    'Shiva',
    'Shubhangi',
    'Vrinda',
  ];

  // ─── FIREBASE IMPORTS ─────────────────────────────────────────────────────
  import { initializeApp }                              from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getDatabase, ref, onValue, push, set,
           update, remove }                             from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  // ─── FIREBASE INIT ────────────────────────────────────────────────────────
  let app, db;

  try {
    app = initializeApp(firebaseConfig);
    db  = getDatabase(app);
  } catch (err) {
    showBanner('Firebase init failed — check config', true);
    console.error('[GSU Tracker] Firebase init error:', err);
  }

  // ─── APP STATE ────────────────────────────────────────────────────────────
  const VERTICALS = ['research', 'marketing', 'bespoke'];

  const state = {
    activeTab:          'overview',   // 'overview' | 'research' | 'marketing' | 'bespoke'
    verticalData:       { research: {}, marketing: {}, bespoke: {} },
    get projects() { return this.verticalData[this.activeTab] ?? {}; },
    filter:             'all',  // 'all' | 'todo' | 'inprogress' | 'done' | 'high'
    addTaskForProject:  null,   // projectId targeted by add-task modal
    editTaskRef:        null,   // { projectId, taskId } for edit modal
    startTaskRef:       null,   // { projectId, taskId } for start-task modal
    editProjectRef:     null,   // projectId for edit-project modal
    connected:          false,
    undoItem:           null,   // { type, vertical, pid, tid?, data, label }
    undoTimer:          null,   // setTimeout handle
  };

  // ─── REALTIME LISTENERS (one per vertical) ───────────────────────────────
  if (db) {
    let loadedCount = 0;
    showBanner('Connecting to database…', false);

    VERTICALS.forEach(v => {
      onValue(ref(db, `verticals/${v}/projects`), (snapshot) => {
        state.verticalData[v] = snapshot.val() ?? {};
        state.connected = true;
        loadedCount++;
        if (loadedCount >= VERTICALS.length) hideBanner();
        renderAll();
      }, (error) => {
        showBanner('Connection error — check Firebase rules', true);
        console.error(`[GSU Tracker] onValue error (${v}):`, error);
      });
    });
  }

  // ─── CRUD OPERATIONS ─────────────────────────────────────────────────────

  // Path helper — always uses the active vertical
  function vpath(segments) {
    return `verticals/${state.activeTab}/projects/${segments}`;
  }

  async function addProject(name, description) {
    const newRef = push(ref(db, `verticals/${state.activeTab}/projects`));
    await set(newRef, {
      name:        name.trim(),
      description: description.trim(),
      collapsed:   false,
      tasks:       {}
    });
  }

  async function updateProject(projectId, fields) {
    await update(ref(db, vpath(projectId)), fields);
  }

  async function addTask(projectId, { name, description, status, priority, due, assignee }) {
    const taskRef = push(ref(db, vpath(`${projectId}/tasks`)));
    await set(taskRef, {
      name:        name.trim(),
      description: description.trim(),
      status,
      priority,
      due:         due || '',
      assignee:    assignee || ''
    });
  }

  async function updateTask(projectId, taskId, fields) {
    await update(ref(db, vpath(`${projectId}/tasks/${taskId}`)), fields);
  }

  async function deleteTask(projectId, taskId) {
    await remove(ref(db, vpath(`${projectId}/tasks/${taskId}`)));
  }

  async function deleteProject(projectId) {
    await remove(ref(db, vpath(projectId)));
  }

  async function toggleCollapse(projectId) {
    const current = state.projects[projectId]?.collapsed ?? false;
    await update(ref(db, vpath(projectId)), { collapsed: !current });
  }

  async function toggleTaskDone(projectId, taskId) {
    const task = state.projects[projectId]?.tasks?.[taskId];
    if (!task) return;
    const newStatus = task.status === 'done' ? 'todo' : 'done';
    await updateTask(projectId, taskId, { status: newStatus });
  }

  // ─── RENDER ENGINE ────────────────────────────────────────────────────────

  function renderAll() {
    if (state.activeTab === 'overview') {
      document.getElementById('stats-bar').hidden   = true;
      document.getElementById('toolbar').hidden     = true;
      document.getElementById('projects-list').hidden = true;
      document.getElementById('empty-state').hidden = true;
      document.getElementById('overview-panel').hidden = false;
      renderOverview();
    } else {
      document.getElementById('stats-bar').hidden    = false;
      document.getElementById('toolbar').hidden      = false;
      document.getElementById('overview-panel').hidden = true;
      // projects-list visibility is managed by renderProjects() based on content
      renderStats();
      renderProjects();
    }
  }

  // Compute stats for a given projects map
  function computeStats(projects) {
    let total = 0, todo = 0, inprogress = 0, done = 0;
    for (const pid of Object.keys(projects)) {
      const tasks = projects[pid].tasks ?? {};
      for (const tid of Object.keys(tasks)) {
        total++;
        const s = tasks[tid].status;
        if      (s === 'todo')       todo++;
        else if (s === 'inprogress') inprogress++;
        else if (s === 'done')       done++;
      }
    }
    return { total, todo, inprogress, done };
  }

  function renderStats() {
    const { total, todo, inprogress, done } = computeStats(state.projects);
    document.getElementById('stat-total').textContent      = total;
    document.getElementById('stat-todo').textContent       = todo;
    document.getElementById('stat-inprogress').textContent = inprogress;
    document.getElementById('stat-done').textContent       = done;
  }

  function renderOverview() {
    // Defensively ensure the vertical empty state is never visible on overview
    document.getElementById('empty-state').hidden = true;

    const grid = document.getElementById('overview-grid');
    const list = document.getElementById('overview-projects');

    // ── Summary cards
    grid.innerHTML = VERTICALS.map(v => {
      const s   = computeStats(state.verticalData[v]);
      const pct = s.total > 0 ? Math.round((s.done / s.total) * 100) : 0;
      const projectCount = Object.keys(state.verticalData[v]).length;
      return `
        <div class="vertical-card" data-tab="${v}" title="Go to ${VERTICAL_LABELS[v]}">
          <div class="vertical-card-header">
            <span class="vertical-card-name">${VERTICAL_LABELS[v]}</span>
            <span class="vertical-card-go">${projectCount} project${projectCount !== 1 ? 's' : ''} →</span>
          </div>
          <div class="vertical-card-stats">
            <div class="vs-item"><div class="vs-value">${s.total}</div><div class="vs-label">Total</div></div>
            <div class="vs-item"><div class="vs-value">${s.todo}</div><div class="vs-label">To Do</div></div>
            <div class="vs-item"><div class="vs-value" style="color:var(--status-ip)">${s.inprogress}</div><div class="vs-label">Active</div></div>
            <div class="vs-item"><div class="vs-value" style="color:var(--accent-gold)">${s.done}</div><div class="vs-label">Done</div></div>
          </div>
          <div class="vertical-card-progress">
            <div class="vertical-card-progress-fill" style="width:${pct}%"></div>
          </div>
        </div>
      `;
    }).join('');

    // ── All projects list
    const allProjects = [];
    VERTICALS.forEach(v => {
      Object.keys(state.verticalData[v]).forEach(pid => {
        allProjects.push({ v, pid, project: state.verticalData[v][pid] });
      });
    });

    if (allProjects.length === 0) {
      list.innerHTML = `
        <div style="padding:2.5rem 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.25rem">
          <div style="font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--text-dim)">No projects yet</div>
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center">
            ${VERTICALS.map(v => `
              <button class="btn btn-primary" style="border-color:${v === 'research' ? 'rgba(123,108,255,0.4)' : v === 'marketing' ? 'rgba(74,222,128,0.3)' : 'var(--accent-gold-dim)'};color:${v === 'research' ? '#7b6cff' : v === 'marketing' ? '#4ade80' : 'var(--accent-gold)'};background:${v === 'research' ? 'rgba(123,108,255,0.08)' : v === 'marketing' ? 'rgba(74,222,128,0.08)' : 'var(--accent-gold-low)'}" data-goto="${v}">
                + Start ${VERTICAL_LABELS[v]}
              </button>
            `).join('')}
          </div>
        </div>`;
      return;
    }

    list.innerHTML = allProjects.map(({ v, pid, project }) => {
      const tasks = project.tasks ?? {};
      const total = Object.keys(tasks).length;
      const done  = Object.keys(tasks).filter(t => tasks[t].status === 'done').length;
      const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
      return `
        <div class="overview-project-row" style="cursor:pointer" data-goto="${v}">
          <span class="ovr-vertical-tag ovr-tag-${v}">${v}</span>
          <span class="ovr-project-name">${escHtml(project.name)}</span>
          <span class="ovr-project-meta">${total} task${total !== 1 ? 's' : ''} · ${pct}%</span>
          <div class="ovr-progress-wrap">
            <div class="ovr-progress-fill" style="width:${pct}%;background:${v === 'research' ? '#7b6cff' : v === 'marketing' ? '#4ade80' : 'var(--accent-gold)'}"></div>
          </div>
        </div>
      `;
    }).join('');
  }

  const VERTICAL_LABELS = { research: 'Research', marketing: 'Marketing', bespoke: 'Bespoke' };

  function renderProjects() {
    // Never run on overview — overview has its own render path
    if (state.activeTab === 'overview') return;

    const container  = document.getElementById('projects-list');
    const emptyState = document.getElementById('empty-state');
    const projectIds = Object.keys(state.projects);
    const label      = VERTICAL_LABELS[state.activeTab];

    if (projectIds.length === 0) {
      container.innerHTML = '';
      container.hidden    = true;
      // Always keep empty state text in sync with the active tab
      document.getElementById('empty-title').textContent = `No ${label} projects yet`;
      document.getElementById('empty-sub').textContent   = `Create the first project for the ${label} vertical.`;
      emptyState.hidden = false;
      return;
    }

    container.hidden  = false;
    emptyState.hidden = true;

    const html = projectIds.map(pid => {
      const project  = state.projects[pid];
      const tasks    = project.tasks ?? {};
      const taskIds  = Object.keys(tasks);

      // Apply filter
      const visibleIds = taskIds.filter(tid => taskMatchesFilter(tasks[tid], state.filter));

      // Hide entire project if filtered and no matching tasks
      if (state.filter !== 'all' && visibleIds.length === 0) return '';

      const doneCount  = taskIds.filter(tid => tasks[tid].status === 'done').length;
      const totalCount = taskIds.length;
      const pct        = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
      const collapsed  = project.collapsed ?? false;

      // Estimate max-height for smooth animation (40px per task row + header)
      const estimatedHeight = visibleIds.length * 46 + 10;

      return `
        <div class="project-block" data-id="${escAttr(pid)}" data-collapsed="${collapsed}">
          <div class="project-header">
            <span class="collapse-icon">&#9654;</span>
            <div class="project-name-cell">
              <span class="project-name">${escHtml(project.name)}</span>
              ${project.description ? `<span class="project-desc">${escHtml(project.description)}</span>` : ''}
            </div>
            <span class="project-meta">${totalCount} task${totalCount !== 1 ? 's' : ''} &middot; ${pct}%</span>
            <div class="progress-bar-wrap">
              <div class="progress-fill" style="width:${pct}%"></div>
            </div>
            <div class="project-actions">
              <button class="btn btn-sm btn-add-task" data-pid="${escAttr(pid)}">+ Task</button>
              <button class="btn btn-sm btn-ghost btn-edit-project" data-pid="${escAttr(pid)}" title="Edit project">
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l2 2-6 6H2V8l6-6z"/></svg>
              </button>
              <button class="btn btn-sm btn-ghost btn-danger btn-del-project" data-pid="${escAttr(pid)}" title="Delete project">
                <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 3h8M5 3V2h2v1M4 9V5m4 4V5M3 3l.5 7h5l.5-7"/></svg>
              </button>
            </div>
          </div>
          <div class="task-list" style="max-height:${collapsed ? '0' : estimatedHeight + 'px'}">
            ${visibleIds.map(tid => renderTaskRow(pid, tid, tasks[tid])).join('')}
            ${visibleIds.length === 0 ? `<div style="padding:1rem 3.2rem;font-size:0.7rem;color:var(--text-dim)">No tasks match the current filter.</div>` : ''}
          </div>
        </div>
      `;
    }).join('');

    container.innerHTML = html;
  }

  function renderTaskRow(pid, tid, task) {
    const overdueClass   = isOverdue(task.due, task.status) ? 'overdue' : '';
    const dueDisplay     = task.due ? formatDate(task.due) : '—';
    const checked        = task.status === 'done' ? 'checked' : '';
    const assigneeHtml   = task.assignee
      ? `<div class="task-assignee">
           <span class="assignee-avatar">${getInitials(task.assignee)}</span>
           <span class="assignee-name">${escHtml(task.assignee.split(' ')[0])}</span>
         </div>`
      : `<div class="task-assignee"><span class="assignee-name" style="opacity:0.25">—</span></div>`;

    return `
      <div class="task-row" data-pid="${escAttr(pid)}" data-tid="${escAttr(tid)}" data-status="${task.status}">
        <input type="checkbox" class="task-checkbox" ${checked}
               data-pid="${escAttr(pid)}" data-tid="${escAttr(tid)}">
        <span class="status-badge ${task.status}">${statusLabel(task.status)}</span>
        <span class="priority-dot ${task.priority}" title="${task.priority} priority"></span>
        <div class="task-name-cell">
          <span class="task-name">${escHtml(task.name)}</span>
          ${task.description ? `<span class="task-desc-text">${escHtml(task.description)}</span>` : ''}
        </div>
        ${assigneeHtml}
        <span class="task-due ${overdueClass}">${dueDisplay}${overdueClass ? ' ⚠' : ''}</span>
        <div class="task-hover-actions">
          ${task.status === 'todo' ? `<button class="btn btn-sm btn-start-task" data-pid="${escAttr(pid)}" data-tid="${escAttr(tid)}" title="Move to In Progress">▶ Start</button>` : ''}
          <button class="btn btn-sm btn-ghost btn-edit-task" data-pid="${escAttr(pid)}" data-tid="${escAttr(tid)}" title="Edit">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2l2 2-6 6H2V8l6-6z"/></svg>
          </button>
          <button class="btn btn-sm btn-ghost btn-danger btn-del-task" data-pid="${escAttr(pid)}" data-tid="${escAttr(tid)}" title="Delete">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2 3h8M5 3V2h2v1M4 9V5m4 4V5M3 3l.5 7h5l.5-7"/></svg>
          </button>
        </div>
      </div>
    `;
  }

  // ─── FILTER ───────────────────────────────────────────────────────────────

  function setFilter(value) {
    state.filter = value;

    document.querySelectorAll('.filter-pill').forEach(el => {
      el.classList.toggle('active', el.dataset.filter === value);
    });

    document.querySelectorAll('.stat-card').forEach(el => {
      el.classList.toggle('active', el.dataset.filter === value);
    });

    renderProjects();
  }

  function taskMatchesFilter(task, filter) {
    if (!task) return false;
    if (filter === 'all')        return true;
    if (filter === 'high')       return task.priority === 'high';
    return task.status === filter;
  }

  // ─── MODAL CONTROLLER ─────────────────────────────────────────────────────

  function openModal(id) {
    const overlay = document.getElementById(id);
    if (!overlay) return;
    overlay.hidden = false;
    requestAnimationFrame(() => {
      requestAnimationFrame(() => overlay.classList.add('open'));
    });
  }

  function closeModal(id) {
    const overlay = document.getElementById(id);
    if (!overlay || overlay.hidden) return;
    overlay.classList.remove('open');
    const onEnd = () => { overlay.hidden = true; };
    overlay.addEventListener('transitionend', onEnd, { once: true });
  }

  function closeAllModals() {
    ['modal-add-project', 'modal-add-task', 'modal-edit-task'].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.hidden) closeModal(id);
    });
  }

  // Escape key closes modals
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAllModals();
  });

  // Enter key confirms focused modal
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const active = ['modal-add-project', 'modal-add-task', 'modal-edit-task']
      .find(id => {
        const el = document.getElementById(id);
        return el && !el.hidden;
      });
    if (!active) return;
    const confirmMap = {
      'modal-add-project': 'confirm-add-project',
      'modal-add-task':    'confirm-add-task',
      'modal-edit-task':   'confirm-edit-task',
      'modal-start-task':  'confirm-start-task',
      'modal-edit-project': 'confirm-edit-project',
    };
    // Only fire if focused element isn't a select (let select use enter normally)
    if (document.activeElement.tagName !== 'SELECT') {
      document.getElementById(confirmMap[active])?.click();
    }
  });

  // Backdrop click closes modal
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal(overlay.id);
    });
  });

  // All [data-close] buttons close their target modal
  document.querySelectorAll('[data-close]').forEach(btn => {
    btn.addEventListener('click', () => closeModal(btn.dataset.close));
  });

  // ─── EVENT DELEGATION ─────────────────────────────────────────────────────

  document.getElementById('projects-list').addEventListener('click', async (e) => {
    const t = e.target;

    // Project header → toggle collapse (but not if clicking action buttons)
    const header = t.closest('.project-header');
    if (header && !t.closest('.project-actions')) {
      const pid = t.closest('.project-block').dataset.id;
      toggleCollapse(pid);
      return;
    }

    // + Task button
    if (t.closest('.btn-add-task')) {
      state.addTaskForProject = t.closest('.btn-add-task').dataset.pid;
      openModal('modal-add-task');
      return;
    }

    // Delete project
    if (t.closest('.btn-del-project')) {
      const pid     = t.closest('.btn-del-project').dataset.pid;
      const project = state.projects[pid];
      if (!project) return;
      softDelete({
        type:     'project',
        vertical: state.activeTab,
        pid,
        data:     JSON.parse(JSON.stringify(project)),
        label:    `Project "${project.name}" deleted`,
      });
      return;
    }

    // Start task (move todo → inprogress)
    if (t.closest('.btn-start-task')) {
      const btn  = t.closest('.btn-start-task');
      const pid  = btn.dataset.pid;
      const tid  = btn.dataset.tid;
      const task = state.projects[pid]?.tasks?.[tid];
      if (!task) return;
      if (task.assignee) {
        // Has assignee — move directly
        try {
          await update(ref(db, vpath(`${pid}/tasks/${tid}`)), { status: 'inprogress' });
        } catch { showBanner('Update failed — check Firebase rules', true); }
      } else {
        // No assignee — open picker modal
        state.startTaskRef = { projectId: pid, taskId: tid };
        document.getElementById('start-task-assignee').value = '';
        openModal('modal-start-task');
      }
      return;
    }

    // Edit project
    if (t.closest('.btn-edit-project')) {
      const pid = t.closest('.btn-edit-project').dataset.pid;
      const project = state.projects[pid];
      if (!project) return;
      state.editProjectRef = pid;
      document.getElementById('edit-project-name').value = project.name;
      document.getElementById('edit-project-desc').value = project.description || '';
      openModal('modal-edit-project');
      return;
    }

    // Edit task
    if (t.closest('.btn-edit-task')) {
      const btn = t.closest('.btn-edit-task');
      state.editTaskRef = { projectId: btn.dataset.pid, taskId: btn.dataset.tid };
      populateEditModal(btn.dataset.pid, btn.dataset.tid);
      openModal('modal-edit-task');
      return;
    }

    // Delete task
    if (t.closest('.btn-del-task')) {
      const btn  = t.closest('.btn-del-task');
      const pid  = btn.dataset.pid;
      const tid  = btn.dataset.tid;
      const task = state.projects[pid]?.tasks?.[tid];
      if (!task) return;
      softDelete({
        type:     'task',
        vertical: state.activeTab,
        pid,
        tid,
        data:     JSON.parse(JSON.stringify(task)),
        label:    `Task "${task.name}" deleted`,
      });
      return;
    }
  });

  // Checkbox change
  document.getElementById('projects-list').addEventListener('change', (e) => {
    if (e.target.classList.contains('task-checkbox')) {
      toggleTaskDone(e.target.dataset.pid, e.target.dataset.tid);
    }
  });

  // Filter pills
  document.querySelectorAll('.filter-pill').forEach(pill => {
    pill.addEventListener('click', () => setFilter(pill.dataset.filter));
  });

  // Stats cards → set filter
  document.querySelectorAll('.stat-card').forEach(card => {
    card.addEventListener('click', () => setFilter(card.dataset.filter));
  });

  // + New Project button
  document.getElementById('btn-add-project').addEventListener('click', () => {
    document.getElementById('new-project-name').value = '';
    document.getElementById('new-project-desc').value = '';
    openModal('modal-add-project');
    setTimeout(() => document.getElementById('new-project-name').focus(), 80);
  });

  // Confirm add project
  document.getElementById('confirm-add-project').addEventListener('click', async () => {
    const name = document.getElementById('new-project-name').value.trim();
    if (!name) { document.getElementById('new-project-name').focus(); return; }
    const description = document.getElementById('new-project-desc').value;
    await addProject(name, description);
    closeModal('modal-add-project');
    document.getElementById('new-project-desc').value = '';
  });

  // Open add-task: focus name field
  document.getElementById('modal-add-task').addEventListener('transitionend', (e) => {
    if (e.target === document.getElementById('modal-add-task') &&
        document.getElementById('modal-add-task').classList.contains('open')) {
      document.getElementById('new-task-name').focus();
    }
  });

  // Confirm add task
  document.getElementById('confirm-add-task').addEventListener('click', async () => {
    const name     = document.getElementById('new-task-name').value.trim();
    if (!name) {
      document.getElementById('new-task-name').focus();
      return;
    }
    const status   = document.getElementById('new-task-status').value;
    const priority = document.getElementById('new-task-priority').value;
    const due      = document.getElementById('new-task-due').value;

    const assignee    = document.getElementById('new-task-assignee').value;
    const description = document.getElementById('new-task-desc').value;
    await addTask(state.addTaskForProject, { name, description, status, priority, due, assignee });
    closeModal('modal-add-task');
    // Reset form
    document.getElementById('new-task-name').value       = '';
    document.getElementById('new-task-desc').value       = '';
    document.getElementById('new-task-status').value     = 'todo';
    document.getElementById('new-task-priority').value   = 'medium';
    document.getElementById('new-task-due').value        = '';
    document.getElementById('new-task-assignee').value   = '';
  });

  // Confirm edit task
  document.getElementById('confirm-edit-task').addEventListener('click', async () => {
    const { projectId, taskId } = state.editTaskRef ?? {};
    if (!projectId || !taskId) return;
    const name = document.getElementById('edit-task-name').value.trim();
    if (!name) { document.getElementById('edit-task-name').focus(); return; }

    await updateTask(projectId, taskId, {
      name,
      description: document.getElementById('edit-task-desc').value,
      status:      document.getElementById('edit-task-status').value,
      priority:    document.getElementById('edit-task-priority').value,
      due:         document.getElementById('edit-task-due').value,
      assignee:    document.getElementById('edit-task-assignee').value,
    });
    closeModal('modal-edit-task');
  });

  function populateEditModal(projectId, taskId) {
    const task = state.projects[projectId]?.tasks?.[taskId];
    if (!task) return;
    document.getElementById('edit-task-name').value       = task.name;
    document.getElementById('edit-task-desc').value       = task.description || '';
    document.getElementById('edit-task-status').value     = task.status;
    document.getElementById('edit-task-priority').value   = task.priority;
    document.getElementById('edit-task-due').value        = task.due || '';
    document.getElementById('edit-task-assignee').value   = task.assignee || '';
  }

  // Confirm edit project
  document.getElementById('confirm-edit-project').addEventListener('click', async () => {
    const pid = state.editProjectRef;
    if (!pid) return;
    const name = document.getElementById('edit-project-name').value.trim();
    if (!name) { document.getElementById('edit-project-name').focus(); return; }
    const description = document.getElementById('edit-project-desc').value;
    try {
      await updateProject(pid, { name, description: description.trim() });
      closeModal('modal-edit-project');
      state.editProjectRef = null;
    } catch { showBanner('Update failed — check Firebase rules', true); }
  });

  // Confirm start task (assign + move to inprogress)
  document.getElementById('confirm-start-task').addEventListener('click', async () => {
    const { projectId, taskId } = state.startTaskRef ?? {};
    if (!projectId || !taskId) return;
    const assignee = document.getElementById('start-task-assignee').value;
    if (!assignee) { document.getElementById('start-task-assignee').focus(); return; }
    try {
      await update(ref(db, vpath(`${projectId}/tasks/${taskId}`)), { status: 'inprogress', assignee });
      closeModal('modal-start-task');
      state.startTaskRef = null;
    } catch { showBanner('Update failed — check Firebase rules', true); }
  });

  // ─── UNDO / SOFT DELETE ───────────────────────────────────────────────────

  const UNDO_DURATION = 5000; // ms

  function softDelete(item) {
    // Cancel any pending undo from a previous delete
    if (state.undoTimer) {
      clearTimeout(state.undoTimer);
      commitPendingDelete(); // flush the previous one immediately
    }

    state.undoItem = item;

    // Perform the actual Firebase delete
    const vbase = `verticals/${item.vertical}/projects`;
    if (item.type === 'task') {
      remove(ref(db, `${vbase}/${item.pid}/tasks/${item.tid}`));
    } else {
      remove(ref(db, `${vbase}/${item.pid}`));
    }

    showUndoToast(item.label);

    state.undoTimer = setTimeout(() => {
      hideUndoToast();
      state.undoItem  = null;
      state.undoTimer = null;
    }, UNDO_DURATION);
  }

  function commitPendingDelete() {
    // The delete has already been sent to Firebase; just clear state
    state.undoItem  = null;
    state.undoTimer = null;
  }

  async function restoreDeleted() {
    if (!state.undoItem) return;

    clearTimeout(state.undoTimer);
    const item     = state.undoItem;
    state.undoItem  = null;
    state.undoTimer = null;
    hideUndoToast();

    const vbase = `verticals/${item.vertical}/projects`;
    if (item.type === 'task') {
      await set(ref(db, `${vbase}/${item.pid}/tasks/${item.tid}`), item.data);
    } else {
      await set(ref(db, `${vbase}/${item.pid}`), item.data);
    }
  }

  function showUndoToast(message) {
    const toast    = document.getElementById('undo-toast');
    const msgEl    = document.getElementById('undo-toast-msg');
    const progress = document.getElementById('undo-progress');

    msgEl.textContent = message;

    // Reset and restart the progress bar animation
    progress.style.transition = 'none';
    progress.style.transform  = 'scaleX(1)';

    toast.classList.add('visible');

    // Trigger reflow then animate
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        progress.style.transition = `transform ${UNDO_DURATION}ms linear`;
        progress.style.transform  = 'scaleX(0)';
      });
    });
  }

  function hideUndoToast() {
    document.getElementById('undo-toast').classList.remove('visible');
  }

  document.getElementById('btn-undo').addEventListener('click', restoreDeleted);

  // ─── EXPORT / IMPORT ──────────────────────────────────────────────────────

  document.getElementById('btn-export').addEventListener('click', () => {
    const hasData = VERTICALS.some(v => Object.keys(state.verticalData[v]).length > 0);
    if (!hasData) { alert('No data to export yet.'); return; }
    const data = JSON.stringify({ verticals: state.verticalData }, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `gsu-tracker-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  });

  document.getElementById('btn-import').addEventListener('click', () => {
    document.getElementById('import-file').click();
  });

  document.getElementById('import-file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    let parsed;
    try {
      const text = await file.text();
      parsed     = JSON.parse(text);
    } catch {
      alert('Could not parse file — make sure it is a valid JSON export from GSU Tracker.');
      e.target.value = '';
      return;
    }

    if (!parsed.projects || typeof parsed.projects !== 'object') {
      alert('Invalid format: file must contain a top-level "projects" object.');
      e.target.value = '';
      return;
    }

    const projectCount = Object.keys(parsed.projects).length;
    if (!confirm(`Import ${projectCount} project(s)?\n\nThis will REPLACE all current data. This cannot be undone.`)) {
      e.target.value = '';
      return;
    }

    if (parsed.verticals) {
      await set(ref(db, 'verticals'), parsed.verticals);
    } else if (state.activeTab !== 'overview') {
      await set(ref(db, `verticals/${state.activeTab}/projects`), parsed.projects);
    } else {
      alert('Please switch to a specific vertical tab before importing a project file.');
    }
    e.target.value = '';
  });

  // ─── DATE UTILITIES ───────────────────────────────────────────────────────

  function formatDate(isoString) {
    if (!isoString) return '';
    try {
      const d = new Date(isoString + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
    } catch {
      return isoString;
    }
  }

  function isOverdue(isoString, status) {
    if (!isoString || status === 'done') return false;
    try {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return new Date(isoString + 'T00:00:00') < today;
    } catch {
      return false;
    }
  }

  function statusLabel(status) {
    return { todo: 'To Do', inprogress: 'In Progress', done: 'Done' }[status] ?? status;
  }

  function getInitials(name) {
    if (!name) return '?';
    const parts = name.trim().split(' ');
    return parts.length >= 2
      ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
      : parts[0].slice(0, 2).toUpperCase();
  }

  function escHtml(str) {
    if (typeof str !== 'string') return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function escAttr(str) {
    if (typeof str !== 'string') return '';
    return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // ─── CONNECTION BANNER ────────────────────────────────────────────────────

  function showBanner(msg, isError) {
    const banner  = document.getElementById('connection-banner');
    const text    = document.getElementById('banner-text');
    text.textContent = msg;
    banner.classList.toggle('error', !!isError);
    banner.classList.add('visible');
    if (!isError) {
      setTimeout(() => banner.classList.remove('visible'), 3000);
    }
  }

  function hideBanner() {
    document.getElementById('connection-banner').classList.remove('visible');
  }

  // ─── TAB SWITCHING ────────────────────────────────────────────────────────

  function switchTab(tab) {
    state.activeTab = tab;
    state.filter    = 'all';

    // Update tab button active states
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tab === tab);
    });

    // Update filter pills to "All" when switching tabs
    document.querySelectorAll('.filter-pill').forEach(p => {
      p.classList.toggle('active', p.dataset.filter === 'all');
    });
    document.querySelectorAll('.stat-card').forEach(c => {
      c.classList.toggle('active', c.dataset.filter === 'all');
    });

    // Empty state text is now updated reactively inside renderProjects()

    renderAll();
  }

  // Tab bar clicks
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });

  // Overview vertical card clicks → navigate to that tab
  document.getElementById('overview-grid').addEventListener('click', (e) => {
    const card = e.target.closest('.vertical-card');
    if (card) switchTab(card.dataset.tab);
  });

  // Overview project row clicks → navigate to that vertical's tab
  document.getElementById('overview-projects').addEventListener('click', (e) => {
    const row = e.target.closest('[data-goto]');
    if (row) switchTab(row.dataset.goto);
  });

  // ─── BOOTSTRAP ────────────────────────────────────────────────────────────

  // Populate assignee dropdowns from TEAM_MEMBERS list
  const assigneeOptions = TEAM_MEMBERS
    .map(m => `<option value="${escHtml(m)}">${escHtml(m)}</option>`)
    .join('');
  document.getElementById('new-task-assignee').insertAdjacentHTML('beforeend', assigneeOptions);
  document.getElementById('edit-task-assignee').insertAdjacentHTML('beforeend', assigneeOptions);
  document.getElementById('start-task-assignee').insertAdjacentHTML('beforeend', assigneeOptions);

  // Start on overview
  renderAll();

  </script>
</body>
</html>
