name: Update Strategic Briefs

on:
  push:
    paths:
      - 'insights/*.pdf'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write  # Allow pushing commits

jobs:
  process-pdfs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Process PDFs and update briefs.json
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python process_pdf.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update briefs.json from PDF upload"
          file_pattern: "briefs.json"
          commit_user_name: "GSU Bot"
          commit_user_email: "bot@geoecon.solutions"
          commit_author: "GSU Bot <bot@geoecon.solutions>"
